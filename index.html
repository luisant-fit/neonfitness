.swatches{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:10px}
.swatch{display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px 6px 5px;border:1px solid var(--line);border-radius:4px;background:var(--panel-2);min-width:0}
.swatch[aria-pressed="true"]{border-color:var(--neon);box-shadow:0 0 0 1px var(--neon) inset}
.swatch i{display:block;width:100%;max-width:46px;height:20px;border-radius:3px;border:1px solid rgba(128,128,128,.35);background:linear-gradient(135deg,#050505 0 50%,#F7F8F5 50% 100%);position:relative;overflow:hidden}
.swatch i::before,.swatch i::after{content:"";position:absolute;width:8px;height:8px;border-radius:50%;top:5px}
.swatch i::before{left:7px;background:var(--sw-d);box-shadow:0 0 6px var(--sw-d)}
.swatch i::after{right:7px;background:var(--sw-l)}
.swatch span{font-family:var(--f-display);font-size:7.5px;letter-spacing:.08em;color:var(--muted);white-space:nowrap}
.swatch[aria-pressed="true"] span{color:var(--neon)}

/* ---------- total par exercice & chrono d'effort ---------- */
.ex-total{display:flex;align-items:baseline;gap:10px;margin:-14px -14px 0;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--neon-soft);border-radius:4px 4px 0 0}
.ex-total span{font-family:var(--f-display);font-size:8.5px;letter-spacing:.2em;color:var(--neon)}
.ex-total b{flex:1;min-width:0;font-size:13px;font-weight:600;color:var(--text)}
.ex-total em{font-style:normal;font-family:var(--f-display);font-size:12px;color:var(--neon);white-space:nowrap}
.btn .play{width:14px;height:14px;fill:currentColor;flex:none}
.manual-link{grid-column:1/-1;justify-self:start;font-size:12px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:2px 0}
.effort{background:var(--void)}
.effort h2{font-size:17px;letter-spacing:.08em;line-height:1.3}
.effort .btn-quiet{min-height:42px}
.ef-ctrl{width:100%;display:flex;flex-direction:column;gap:12px;align-items:stretch}
.ef-review{padding:14px;display:flex;flex-direction:column;gap:10px;text-align:left}
.ef-step{display:grid;grid-template-columns:44px 40px minmax(0,1fr) 40px 44px}
.ef-step input{font-family:var(--f-display);font-size:22px;text-align:center;min-width:0}
.ef-step button{font-family:var(--f-display);font-size:12px}
.ef-pv{font-size:13px;color:var(--muted)}.ef-pv b{font-family:var(--f-display);font-size:16px;color:var(--neon)}
.ring.paused .fg{stroke:var(--muted);filter:none}
.btn[disabled]{opacity:.45}

/* ---------- succès ---------- */
.ach-b{flex:none;display:block}
.ach-b .hx{stroke-width:2;fill:var(--panel-2)}
.ach-b .hx2{fill:none;stroke-width:.8;opacity:.6}
.ach-b .gl{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ach-b.ex{--m:var(--legend)}.ach-b.ex .gl{transform:translate(0,1.5px)}
.ach-b.t0{--m:#C98A4B}.ach-b.t1{--m:#B9C6D2}.ach-b.t2{--m:#F2B53A}.ach-b.t3{--m:var(--neon)}
.ach-b.got .hx{stroke:var(--m);fill:color-mix(in srgb,var(--m) 16%,var(--panel))}
.ach-b.got .hx2,.ach-b.got .gl{stroke:var(--m)}
.ach-b.got.t2,.ach-b.got.t3,.ach-b.got.ex{filter:drop-shadow(0 0 3px color-mix(in srgb,var(--m) 60%,transparent))}
.ach-b.lock .hx{stroke:var(--line)}.ach-b.lock .hx2,.ach-b.lock .gl{stroke:var(--dim)}
.ach-favs{display:flex;gap:10px;align-items:flex-start}
.ach-fav{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;flex:1;text-align:center}
.ach-fav small{font-size:10px;line-height:1.2;color:var(--muted);max-width:90px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.op-ach{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:10px 0 0;border-top:1px solid var(--line);text-align:left;width:100%}
.op-ach .ach-favs{flex:1;min-width:0;justify-content:flex-start}
.op-ach .ach-fav{flex:0 1 92px}
.op-ach-empty{flex:1;font-size:12.5px;color:var(--muted)}
.op-ach-n{font-family:var(--f-display);font-size:10px;letter-spacing:.12em;color:var(--neon);white-space:nowrap}
.ach-sum{display:flex;align-items:center;gap:14px;padding:14px;width:100%;text-align:left}
.ach-sum>div:first-child{display:flex;flex-direction:column;gap:2px}
.ach-sum b{font-family:var(--f-display);font-size:24px;color:var(--neon)}.ach-sum b small{font-size:12px;color:var(--muted)}
.ach-sum span{font-size:12px;color:var(--muted)}
.ach-sum .ach-favs{flex:1;justify-content:center;gap:6px}
.ach-sum .go{font-family:var(--f-display);font-size:10px;letter-spacing:.14em;color:var(--neon);white-space:nowrap}
.ach-list{display:flex;flex-direction:column;gap:8px}
.ach-row{display:flex;align-items:center;gap:12px;padding:10px;border:1px solid var(--line);border-radius:4px;background:var(--panel-2)}
.ach-row.got{border-color:var(--line-hi)}
.ach-i{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.ach-i b{font-size:14.5px;font-weight:600;color:var(--text)}
.ach-i span{font-size:12.5px;color:var(--muted)}
.ach-i small{font-family:var(--f-display);font-size:8.5px;letter-spacing:.12em;color:var(--muted)}
.ach-i small.ok{color:var(--neon)}
.ach-i .mini-bar{margin-top:2px}
.ach-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pips{display:inline-flex;gap:3px}.pips i{width:7px;height:7px;border-radius:50%;border:1px solid var(--line-hi);background:transparent}
.pips i.t0{--m:#C98A4B}.pips i.t1{--m:#B9C6D2}.pips i.t2{--m:#F2B53A}.pips i.t3{--m:var(--neon)}
.pips i.on{background:var(--m);border-color:var(--m)}
.tier-leg{display:flex;gap:12px;flex-wrap:wrap;font-family:var(--f-display);font-size:8.5px;letter-spacing:.14em;color:var(--muted);margin-bottom:4px}
.tier-leg span{display:flex;align-items:center;gap:5px}.tier-leg i{width:10px;height:10px;border-radius:50%}
.tier-leg i.t0{background:#C98A4B}.tier-leg i.t1{background:#B9C6D2}.tier-leg i.t2{background:#F2B53A}.tier-leg i.t3{background:var(--neon)}
.ach-pin{width:40px;height:40px;flex:none;font-size:22px;color:var(--dim);border:1px solid var(--line);border-radius:4px;background:var(--panel)}
.ach-pin.on{color:var(--legend);border-color:var(--legend)}
.ach-pinned{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 10px}
.ach-pinned .slot{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border:1px dashed var(--line);border-radius:4px;text-align:center;min-height:92px;justify-content:center}
.ach-pinned .slot.on{border-style:solid;border-color:var(--line-hi)}
.ach-pinned .slot i{width:34px;height:38px;border:1px dashed var(--dim);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.ach-pinned .slot small{font-size:10.5px;color:var(--muted);line-height:1.2}
.ach-toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));z-index:140;display:flex;align-items:center;gap:12px;padding:10px 16px 10px 10px;max-width:calc(100vw - 24px);
  background:var(--panel);border:1px solid var(--neon);border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.5),0 0 20px var(--neon-soft);transform:translate(-50%,-160%);transition:transform .45s cubic-bezier(.2,1.3,.4,1);text-align:left}
.ach-toast.show{transform:translate(-50%,0)}
.ach-toast span{display:flex;flex-direction:column;gap:1px;min-width:0}
.ach-toast small{font-family:var(--f-display);font-size:8.5px;letter-spacing:.16em;color:var(--neon)}
.ach-toast b{font-size:15px;font-weight:700;color:var(--text)}
.ach-toast em{font-style:normal;font-family:var(--f-display);font-size:11px;color:var(--legend)}
.sq-row .row-ach{display:inline-flex;gap:3px;margin-left:6px;vertical-align:middle}
/* ---------- carte des muscles ---------- */
.mmap{padding:14px;display:flex;flex-direction:column;gap:12px}
.mm-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mm-tog .pick{height:30px;min-width:46px;font-size:9px}
.mm-figs{display:grid;grid-template-columns:1fr 1fr;gap:6px;justify-items:center}
.mm-figs figure{margin:0;width:100%;display:flex;flex-direction:column;align-items:center;gap:6px}
.mm-figs svg{width:100%;max-width:150px;height:auto;display:block}
.mm-figs figcaption{font-family:var(--f-display);font-size:8.5px;letter-spacing:.24em;color:var(--muted)}
.mm-figs .mn>*{fill:var(--panel-2);stroke:var(--line);stroke-width:.45}
.mm-figs .mr>*{fill:var(--panel-2);stroke:var(--line-hi);stroke-width:.45;stroke-linejoin:round;transition:fill .3s}
.mm-figs .mr.l1>*{fill:rgba(var(--neon-rgb),.3);stroke:rgba(var(--neon-rgb),.65)}
.mm-figs .mr.l2>*{fill:rgba(var(--neon-rgb),.6);stroke:var(--neon)}
.mm-figs .mr.l3>*{fill:var(--neon);stroke:var(--neon);filter:drop-shadow(0 0 1.5px rgba(var(--neon-rgb),.8))}
.mm-leg{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;font-size:11.5px;color:var(--muted)}
.mm-leg span{display:flex;align-items:center;gap:6px}
.mm-leg i{width:12px;height:12px;border-radius:3px;border:1px solid var(--line-hi);background:var(--panel-2)}
.mm-leg i.l1{background:rgba(var(--neon-rgb),.3)}.mm-leg i.l2{background:rgba(var(--neon-rgb),.6)}.mm-leg i.l3{background:var(--neon)}
.mm-list{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;border-top:1px solid var(--line);padding-top:10px}
.mm-row{display:grid;grid-template-columns:76px minmax(0,1fr) 30px;align-items:center;gap:6px;font-size:12px;color:var(--text)}
.mm-row.zero{color:var(--muted)}
.mm-row i{height:5px;background:var(--panel-2);border-radius:3px;overflow:hidden}
.mm-row i b{display:block;height:100%;background:rgba(var(--neon-rgb),.6)}.mm-row i b.l3{background:var(--neon)}.mm-row i b.l1{background:rgba(var(--neon-rgb),.35)}
.mm-row em{font-style:normal;font-family:var(--f-display);font-size:10.5px;color:var(--neon);text-align:right}
.mm-row.zero em{color:var(--dim)}
/* ---------- calendrier ---------- */
.cal{padding:14px;display:flex;flex-direction:column;gap:12px}
.cal-nav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cal-nav b{font-family:var(--f-display);font-size:13px;letter-spacing:.12em;color:var(--text);text-transform:uppercase}
.cal-btn{width:40px;height:36px;border:1px solid var(--line-hi);border-radius:4px;color:var(--neon);font-size:20px;line-height:1;background:var(--panel-2)}
.cal-btn[disabled]{opacity:.3;pointer-events:none}
.cal-month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal-month .cw{font-family:var(--f-display);font-size:9px;letter-spacing:.1em;color:var(--muted);text-align:center;padding-bottom:2px}
.cal-month .cd{position:relative;aspect-ratio:1;display:grid;place-items:center;border-radius:4px;border:1px solid var(--line);background:var(--panel-2);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.cal-month .cd.blank{border:0;background:none}
.cal-month .cd.fut{opacity:.35}
.cal-month .cd.a1{background:rgba(var(--neon-rgb),.28);border-color:var(--neon);color:var(--text);font-weight:600}
.cal-month .cd.a2{background:var(--neon);border-color:var(--neon);color:var(--ink);font-weight:700;box-shadow:0 0 8px var(--neon-glow)}
.cal-month .cd.now{outline:2px solid var(--text);outline-offset:1px}
.cal-month sup{position:absolute;top:2px;right:4px;font-size:8px;font-family:var(--f-display)}
.cal-leg{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;font-size:11.5px;color:var(--muted)}
.cal-leg span{display:flex;align-items:center;gap:6px}
.cal-leg i{width:12px;height:12px;border-radius:3px;border:1px solid var(--line);background:var(--panel-2)}
.cal-leg i.a1{background:rgba(var(--neon-rgb),.28);border-color:var(--neon)}.cal-leg i.a2{background:var(--neon);border-color:var(--neon)}
.cal-leg i.now{outline:2px solid var(--text);outline-offset:0}
.cal-sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;border-top:1px solid var(--line);padding-top:10px}
.cal-sum div{display:flex;flex-direction:column;gap:2px}
.cal-sum b{font-family:var(--f-display);font-size:18px;color:var(--neon)}
.cal-sum span{font-size:11.5px;color:var(--muted);line-height:1.3}
/* ---------- poids de corps ---------- */
.wt{padding:14px;display:flex;flex-direction:column;gap:12px}
.wt-top{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.wt-top div{display:flex;flex-direction:column;gap:3px}
.wt-top b{font-family:var(--f-display);font-size:20px;color:var(--text)}
.wt-top b small{font-size:11px;color:var(--muted)}
.wt-top b.up{color:var(--legend)}.wt-top b.down{color:var(--neon)}
/* ---------- échauffement ---------- */
.warm{border:1px dashed var(--line-hi);border-radius:4px;background:var(--panel-2)}
.warm:empty{display:none}
.warm.done{border-style:solid}
.warm summary{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;list-style:none}
.warm summary::-webkit-details-marker{display:none}
.warm summary::after{content:"▾";color:var(--neon);font-size:12px;transition:transform .2s}
.warm[open] summary::after{transform:rotate(180deg)}
.warm .w-t{font-family:var(--f-display);font-size:9.5px;letter-spacing:.16em;color:var(--neon)}
.warm .w-s{flex:1;text-align:right;font-size:12px;color:var(--muted)}
.warm-list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.warm-row{display:grid;grid-template-columns:24px minmax(0,1fr);grid-template-rows:auto auto;column-gap:12px;align-items:center;padding:9px 12px;text-align:left;border-bottom:1px solid var(--line)}
.warm-row .check{grid-row:1/3;width:20px;height:20px}
.warm-row b{font-size:14px;font-weight:600;color:var(--text)}
.warm-row small{font-size:11.5px;color:var(--muted)}
.warm-row.on b{color:var(--muted);text-decoration:line-through}
.warm .hint{padding:8px 12px 10px;font-size:11.5px}

/* ---------- épuration ---------- */
.top-r{gap:6px}
.sync{width:34px;height:31px;padding:0;justify-content:center}
.sync span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sync i{width:9px;height:9px}
.icon-btn{width:34px;height:31px;display:grid;place-items:center;border:1px solid var(--line);border-radius:3px;color:var(--muted);background:var(--panel)}
.icon-btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.icon-btn:hover{color:var(--neon);border-color:var(--line-hi)}
.hq-go{margin-top:10px;display:grid;grid-template-columns:1fr;gap:10px}
.hq-go.two{grid-template-columns:1.25fr 1fr}
.hq-go .ex-entry{margin-top:0}
.ex-entry,.sq-entry{padding:12px;gap:10px}
.sq-entry{display:flex;align-items:center;border:1px solid var(--line-hi);border-radius:4px;background:var(--panel);text-align:left;min-width:0}
.sq-entry .ex-ic{background:transparent;border:1px solid var(--line-hi);color:var(--neon)}
.sq-entry .ex-ic svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;width:20px;height:20px}
.sq-entry .ex-txt b{font-size:12.5px;color:var(--text)}
.ex-entry .ex-txt b{font-size:13.5px}
.ex-txt small{font-size:11.5px;line-height:1.3}
.ex-ic{width:34px;height:34px}
.h2-sub{margin-left:auto;order:3;font-size:9.5px;letter-spacing:.14em;color:var(--muted);font-weight:400}
.h2 .h2-sub{flex:none}
.streak-line{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.streak-line b{font-family:var(--f-display);font-size:22px;font-weight:900;color:var(--muted);line-height:1}
.streak-line span{font-size:13px;color:var(--text)}
.streak-line em{font-style:normal;color:var(--legend);font-weight:600}
.streak-line small{font-family:var(--f-display);font-size:9px;letter-spacing:.1em;color:var(--muted);white-space:nowrap}
.streak-line.hot b{color:var(--legend)}
.sugg{display:flex;align-items:center;gap:10px;padding:9px 12px}
.sugg .sg-t{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;font-size:12.5px;color:var(--muted)}
.sugg .sg-t b{font-size:14px}
.sugg .sg-t small{flex-basis:100%;font-size:11px}
.fav-star{min-width:0;padding:0;font-size:20px;color:var(--legend)}
.eq-bar{padding:6px 10px}
.eq-set{padding:6px 4px;font-size:11px;font-family:var(--f-display);letter-spacing:.12em;text-decoration:none;color:var(--neon)}
.eq-lab{flex-direction:row;align-items:baseline;gap:8px}
.eq-lab small{font-size:11.5px}
.seg.seg3{grid-template-columns:repeat(3,minmax(0,1fr))}
.suivi-seg{margin-top:18px}
.more-btn{width:100%;margin-top:8px;padding:10px;border:1px dashed var(--line-hi);border-radius:4px;font-family:var(--f-display);font-size:9.5px;letter-spacing:.14em;color:var(--neon);background:var(--panel)}
.ach-sum{margin-top:10px}
.ach-sum-t{flex:1;font-size:12.5px;color:var(--muted);text-align:right}
.mm-det summary{cursor:pointer;list-style:none;font-family:var(--f-display);font-size:9.5px;letter-spacing:.16em;color:var(--neon);padding:4px 0;display:flex;justify-content:center;gap:6px}
.mm-det summary::-webkit-details-marker{display:none}
.mm-det summary::after{content:"▾";transition:transform .2s}.mm-det[open] summary::after{transform:rotate(180deg)}
.mm-det[open] .mm-list{margin-top:8px}
.set-links{display:flex;flex-direction:column;gap:10px}
#sheet-in .theme-picks .pick{flex:1 1 0}

/* ---------- arsenal en icônes ---------- */
.g-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.g-tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;padding:12px 6px 10px;border:1px solid var(--line);border-radius:4px;background:var(--panel);text-align:center;min-width:0}
.g-tile:hover{border-color:var(--line-hi)}
.g-tile.eq{border-color:var(--neon);background:var(--neon-soft)}
.g-tile.locked{opacity:.6}
.g-tile b{font-size:11.5px;font-weight:600;line-height:1.25;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.g-fx{font-size:10.5px;line-height:1.35;color:var(--neon)}
.g-tile.locked .g-fx{color:var(--muted)}
.g-tile .rar{font-family:var(--f-display);font-size:7.5px;letter-spacing:.14em}
.g-tile .mini-bar{width:70%;margin-top:3px}
.g-flag{position:absolute;top:-1px;right:-1px;font-family:var(--f-display);font-size:7px;letter-spacing:.12em;padding:3px 5px;background:var(--neon);color:var(--ink);border-radius:0 4px 0 4px}
.g-icw{position:relative;display:grid;place-items:center;width:58px;height:58px;border-radius:50%;background:var(--panel-2);border:1px solid var(--line)}
.g-tile.eq .g-icw{border-color:var(--neon);box-shadow:0 0 10px var(--neon-soft)}
.g-lock{position:absolute;right:-3px;bottom:-3px;width:18px;height:18px;padding:2px;border-radius:50%;background:var(--panel);border:1px solid var(--line);fill:none;stroke:var(--muted);stroke-width:2.2;stroke-linecap:round}
.g-ic{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.g-ic .f{fill:currentColor;stroke:none}.g-ic .fs{fill:currentColor;fill-opacity:.2;stroke:none}
.g-ic.r-COMMUN{color:var(--common)}.g-ic.r-RARE{color:var(--neon)}.g-ic.r-EPIQUE{color:var(--neon);filter:drop-shadow(0 0 3px var(--neon-glow))}.g-ic.r-LEGENDAIRE{color:var(--legend);filter:drop-shadow(0 0 3px rgba(var(--legend-rgb),.6))}
.g-tile.locked .g-ic{color:var(--muted);filter:none}
.g-head{display:flex;align-items:center;gap:12px}
/* ---------- aptitudes en icônes ---------- */
.pp-line{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.pp-line b{font-family:var(--f-display);font-size:24px;color:var(--neon)}
.pp-line .hint{flex-basis:100%;font-size:12px}
.p-branch{margin-top:14px}
.p-bh{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.p-bh b{font-family:var(--f-display);font-size:11px;letter-spacing:.16em;color:var(--neon)}
.p-bh span{font-size:12px;color:var(--muted)}
.p-row{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.p-row::before{content:"";position:absolute;left:12%;right:12%;top:30px;height:2px;background:var(--line)}
.p-tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 2px;text-align:center;min-width:0;border-radius:4px}
.p-icw{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--panel);color:var(--dim)}
.p-ic{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.p-tile b{font-size:10.5px;font-weight:600;line-height:1.25;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.p-tile small{font-family:var(--f-display);font-size:7.5px;letter-spacing:.1em;color:var(--dim)}
.p-tile.owned .p-icw{border-color:var(--neon);background:var(--neon);color:var(--ink);box-shadow:0 0 10px var(--neon-glow)}
.p-tile.owned b{color:var(--text)}.p-tile.owned small{color:var(--neon)}
.p-tile.avail .p-icw{border-color:var(--neon);color:var(--neon);animation:pulse 1.6s infinite}
.p-tile.avail b{color:var(--text)}.p-tile.avail small{color:var(--neon)}
.perk-hero{display:flex;align-items:center;gap:14px;padding:14px;border:1px solid var(--line);border-radius:4px;background:var(--panel-2)}
.perk-hero .p-ic{flex:none;color:var(--neon)}
.perk-hero p{font-size:15px;line-height:1.5;color:var(--text)}
.perk-hero.locked .p-ic{color:var(--muted)}
.perk-confirm{padding:14px;display:flex;flex-direction:column;gap:12px;border-color:var(--neon)}
.perk-confirm p{font-size:14px;line-height:1.5}
.perk-done{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;font-family:var(--f-display);font-size:11px;letter-spacing:.14em;color:var(--neon);border:1px solid var(--neon);border-radius:4px;background:var(--neon-soft)}
.perk-done .p-ic{color:var(--neon)}
/* ---------- QG : tuiles Exercices / Escouades ---------- */
.hq-go.two .ex-entry,.hq-go.two .sq-entry{flex-direction:column;align-items:flex-start;gap:8px;padding:12px}
.hq-go .ex-txt b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;letter-spacing:.1em}
.hq-go.two .ex-txt b{font-size:12px}
.hq-go.two{grid-template-columns:1fr 1fr}

/* ---------- QG : EXERCICES dominant, escouades et synchro dans la barre ---------- */
.ex-main{margin-top:12px;padding:18px 16px;gap:14px}
.ex-main .ex-ic{width:48px;height:48px}.ex-main .ex-ic svg{width:30px;height:30px}
.ex-main .ex-txt b{font-size:18px;letter-spacing:.16em}
.ex-main .ex-txt small{font-size:12.5px}
.ex-main .go{font-size:28px;line-height:1;color:var(--neon)}
.set-btn{position:relative}
.set-btn .sync{position:absolute;top:-4px;right:-4px;width:auto;height:auto;padding:0;border:0;background:none}
.set-btn .sync i{width:9px;height:9px;border:2px solid var(--void);box-sizing:content-box}
.sync-row{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-size:11px;letter-spacing:.14em}
.sync-row .sync{width:auto;height:auto;padding:0;border:0;background:none}
/* ---------- coach ---------- */
.coach{display:flex;flex-direction:column;gap:8px}
.ct-tip{display:flex;gap:12px;padding:12px 14px;align-items:flex-start}
.ct-tip svg{flex:none;width:22px;height:22px;margin-top:1px;fill:none;stroke:var(--neon);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ct-tip b{display:block;font-size:14.5px;font-weight:600;color:var(--text);margin-bottom:3px}
.ct-tip p{font-size:13px;line-height:1.5;color:var(--muted)}
.ct-tip.warn{border-color:rgba(var(--legend-rgb),.5)}
.ct-tip.warn svg{stroke:var(--legend)}

.sq-strip{margin-top:8px;width:100%;display:flex;align-items:center;gap:12px;padding:9px 14px 9px 10px;border:1px solid var(--line-hi);border-radius:4px;background:linear-gradient(90deg,var(--neon-soft),var(--panel) 70%);text-align:left}
.sq-strip:hover{border-color:var(--neon)}
.sq-logo svg{display:block;width:34px;height:34px;fill:none;stroke:var(--neon);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.sq-logo .hx{fill:rgba(var(--neon-rgb),.1);stroke-width:1.4}
.sq-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.sq-t b{font-family:var(--f-display);font-size:11.5px;letter-spacing:.18em;color:var(--neon)}
.sq-t small{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sq-strip .go{font-size:22px;line-height:1;color:var(--neon)}

/* ---------- illustrations des systèmes ---------- */
.cat{position:relative;overflow:hidden;min-height:0;padding-top:10px}
.cat-ill{display:block;width:100%;height:78px;margin:0 0 6px;pointer-events:none}
.cat-ill .mn>*{fill:var(--panel-2);stroke:var(--line);stroke-width:.45}
.cat-ill .mr>*{fill:var(--panel-2);stroke:var(--line-hi);stroke-width:.45;stroke-linejoin:round}
.cat-ill .mr.l1>*{fill:rgba(var(--neon-rgb),.22);stroke:rgba(var(--neon-rgb),.5)}
.cat-ill .mr.l3>*{fill:var(--neon);stroke:var(--panel);stroke-width:.9}
.cat-ill .mr.l2>*{fill:rgba(var(--neon-rgb),.55);stroke:var(--panel);stroke-width:.9}
.cat-ill .mr.l3{filter:drop-shadow(0 0 1.5px rgba(var(--neon-rgb),.7))}
.cat.sel .cat-ill .mn>*,.cat.sel .cat-ill .mr.l0>*{fill:var(--panel)}

/* ---------- détail d'une mission ---------- */
.rows .r-btn{width:100%;text-align:left;cursor:pointer}
.rows .r-btn:hover{background:var(--neon-soft)}
.md-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:12px}
.md-kpis div{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border:1px solid var(--line);border-radius:4px;background:var(--panel-2)}
.md-kpis b{font-family:var(--f-display);font-size:14px;color:var(--neon);white-space:nowrap}
.md-kpis span{font-size:11px;color:var(--muted)}
.md-note{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;border:1px solid var(--line);border-radius:4px;margin-bottom:6px}
.md-note span{font-family:var(--f-display);font-size:9px;letter-spacing:.12em;padding:4px 7px;border:1px solid var(--line-hi);border-radius:3px;color:var(--neon)}
.md-note p{flex-basis:100%;font-size:13.5px;color:var(--text);margin-top:2px}
.md-list{display:flex;flex-direction:column;gap:8px}
.md-ex{padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:var(--panel-2)}
.md-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.md-name{font-size:14.5px;font-weight:600;color:var(--text);text-align:left;flex:1;min-width:0}
.md-name:hover{color:var(--neon)}
.md-rec{font-family:var(--f-display);font-size:8.5px;letter-spacing:.12em;color:var(--legend)}
.md-xp{font-family:var(--f-display);font-size:11px;color:var(--neon)}
.md-sets{display:flex;flex-direction:column;margin-top:6px}
.md-sets div{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:8px;padding:5px 0;border-top:1px dashed var(--line);font-size:13px;align-items:baseline}
.md-sets span{font-family:var(--f-display);font-size:9px;color:var(--muted)}
.md-sets b{font-weight:500;color:var(--text)}
.md-sets em{font-style:normal;font-family:var(--f-display);font-size:10.5px;color:var(--muted)}
.md-tot{font-size:12px;color:var(--muted);margin-top:6px}

/* ---------- séances prêtes ---------- */
.ex-seg{margin-top:14px}
.prog-list{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.prog{padding:14px;display:flex;flex-direction:column;gap:8px}
.prog-top{display:flex;justify-content:space-between;align-items:center}
.prog-lvl{display:flex;align-items:center;gap:3px}
.prog-lvl i{width:14px;height:5px;border-radius:2px;background:var(--line)}
.prog-lvl i.on{background:var(--neon)}
.prog.l4 .prog-lvl i.on{background:var(--legend)}
.prog-lvl b{margin-left:8px;font-family:var(--f-display);font-size:9px;letter-spacing:.16em;color:var(--muted);font-weight:400}
.prog-xp{font-family:var(--f-display);font-size:11px;color:var(--legend)}
.prog h3{font-family:var(--f-display);font-size:16px;letter-spacing:.12em;color:var(--text)}
.prog-sub{font-size:12.5px;color:var(--muted)}
.prog-ex{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.prog-ex li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px}
.prog-ex li b{font-family:var(--f-display);font-size:11px;color:var(--neon);white-space:nowrap}
.prog-ex li.no{opacity:.45}
.prog-ex .link-ex{text-align:left;color:var(--text);font-size:13px}.prog-ex .link-ex:hover{color:var(--neon)}
.prog-head{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.prog-miss{font-size:12px;color:var(--legend)}
.prog-bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:12px 14px;margin-top:12px;border-color:var(--line-hi)}
.prog-bar b{font-family:var(--f-display);font-size:14px;letter-spacing:.1em;color:var(--text)}
.prog-bar>div:first-child{display:flex;flex-direction:column;gap:3px;min-width:0}
.prog-bar .pb-r{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.prog-bar .pb-r b{color:var(--neon)}
.prog-bar .pb-r span{font-family:var(--f-display);font-size:8px;letter-spacing:.12em;color:var(--legend)}
.prog-bar .mini-bar{grid-column:1/-1}
.prog-bar .mini-bar i,.prog-bar.ok .mini-bar i{background:var(--neon)}
.prog-bar.ok{border-color:var(--neon);background:var(--neon-soft)}
.prog-goal{display:flex;align-items:center;gap:10px;padding:7px 10px;border:1px dashed var(--line-hi);border-radius:4px;font-size:12px}
.prog-goal span{font-family:var(--f-display);font-size:8.5px;letter-spacing:.14em;color:var(--muted)}
.prog-goal b{flex:1;color:var(--text);font-weight:600}
.prog-goal em{font-style:normal;font-family:var(--f-display);font-size:10px;color:var(--neon)}
.prog-goal.ok{border-style:solid;border-color:var(--neon);background:var(--neon-soft)}
.prog-res{padding:14px;display:flex;flex-direction:column;gap:4px;border-color:var(--line-hi)}
.prog-res b{font-family:var(--f-display);font-size:14px;letter-spacing:.1em;color:var(--muted)}
.prog-res.ok{border-color:var(--legend)}.prog-res.ok b{color:var(--legend)}
.prog-res small{font-size:12.5px;color:var(--muted)}
</style>

<body>
<main id="app" class="app" aria-live="polite"></main>

<div id="sheet" class="sheet-wrap" hidden>
  <div class="sheet-bg" data-act="close-sheet"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-label="Terminal d'analyse"><div class="sheet-in" id="sheet-in"></div></div>
</div>

<div id="rest" class="rest" hidden role="dialog" aria-modal="true" aria-labelledby="rest-title">
  <div class="rest-in">
    <div class="eyebrow">CHRONOMÈTRE TACTIQUE</div>
    <h2 id="rest-title">REPOS TACTIQUE</h2>
    <div class="gain" id="rest-gain">+0 XP</div>
    <div class="gain-tags" id="rest-tags"></div>
    <div class="ring" id="ring">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <circle class="ticks" cx="100" cy="100" r="93"></circle>
        <circle class="bg" cx="100" cy="100" r="82"></circle>
        <circle class="fg" id="ring-fg" cx="100" cy="100" r="82" stroke-dasharray="515.22" stroke-dashoffset="0"></circle>
      </svg>
      <div class="ring-txt"><b id="rest-time">0:00</b><span id="rest-state">RÉCUPÉRATION</span></div>
    </div>
    <div class="rest-ctrl">
      <button class="btn btn-ghost" data-act="rest-add" data-d="-15">−15 s</button>
      <button class="btn btn-ghost" data-act="rest-add" data-d="15">+15 s</button>
    </div>
    <div class="panel rest-stats">
      <div><span>XP MISSION</span><b id="rest-mxp">0</b></div>
      <div><span>SÉRIES</span><b id="rest-sets">0</b></div>
      <div><span>TONNAGE</span><b id="rest-ton">0</b></div>
    </div>
    <p class="rest-next" id="rest-next"></p>
    <button class="btn btn-neon btn-wide" data-act="rest-skip" id="rest-btn">PASSER LE REPOS</button>
    <p class="rest-note" id="rest-note"></p>
  </div>
</div>

<div id="flash" class="flash"></div>

<div id="onboard" class="ob" hidden role="dialog" aria-modal="true" aria-labelledby="ob-title"><div class="ob-in" id="ob-in"></div></div>

<div id="auth" class="auth" hidden role="dialog" aria-modal="true" aria-label="Connexion">
  <div class="auth-in">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span>NEONFITNESS<b>PRO</b></span></div>
    <div id="auth-body"></div>
  </div>
</div>

<script>
"use strict";
/* =====================================================================
   NEONFITNESS PRO — base de données de jeu
   ===================================================================== */
/* Même code pour deux plateformes : l'artifact Claude (stockage du compte Claude)
   et la version autonome (window.NEON_STANDALONE = true, connexion + Firestore). */
const STANDALONE = window.NEON_STANDALONE === true;
let STORAGE_KEY = "neonfitness-pro-v1";

const STATS = {
  power:      { label: "PUISSANCE BRUTE",        short: "PUISSANCE",  groups: "Pectoraux · Épaules · Triceps" },
  armor:      { label: "BLINDAGE & STRUCTURE",   short: "BLINDAGE",   groups: "Dos · Trapèzes · Lombaires" },
  propulsion: { label: "PROPULSION HYDRAULIQUE", short: "PROPULSION", groups: "Jambes · Mollets" },
  core:       { label: "STABILITÉ & NOYAU",      short: "NOYAU",      groups: "Abdos · Gainage" }
};
const STAT_KEYS = Object.keys(STATS);

const CATS = [
  { id: "pecs",    label: "PECTORAUX",       code: "SYS-01" },
  { id: "dos",     label: "DOS",             code: "SYS-02" },
  { id: "epaules", label: "ÉPAULES",         code: "SYS-03" },
  { id: "bras",    label: "BRAS",            code: "SYS-04" },
  { id: "jambes",  label: "JAMBES",          code: "SYS-05" },
  { id: "abdos",   label: "ABDOS & GAINAGE", code: "SYS-06" }
];
const CAT_BY_ID = Object.fromEntries(CATS.map(c => [c.id, c]));

/* type: "load" = charge externe, "bw" = poids du corps (+lest), "time" = isométrie en secondes */
function ex(id, name, cat, type, coef, stats, rest, defKg, defReps, muscles, desc, bw) {
  return { id, name, cat, type, coef, stats, rest, defKg, defReps, muscles, desc, bw: bw || 0 };
}
const EXERCISES = [
  // PECTORAUX
  ex("bench","Développé couché barre","pecs","load",1.3,{power:1},120,40,8,["Grand pectoral","Deltoïde antérieur","Triceps brachial"],"Poussée horizontale polyarticulaire. Omoplates rétractées et abaissées, la barre descend au bas du sternum puis remonte sur une trajectoire légèrement en J. Principal générateur de force de poussée du haut du corps."),
  ex("incline_db","Développé incliné haltères","pecs","load",1.25,{power:1},105,16,10,["Faisceau claviculaire du pectoral","Deltoïde antérieur","Triceps"],"Banc incliné à 30°. L'angle déplace la charge vers le faisceau supérieur du pectoral ; les haltères autorisent une amplitude plus grande et corrigent les déséquilibres gauche/droite."),
  ex("decline","Développé décliné barre","pecs","load",1.2,{power:1},105,40,8,["Faisceau sternal inférieur","Triceps"],"Banc décliné à -15°. Raccourcit l'amplitude et sollicite la portion inférieure du pectoral, avec une contrainte réduite sur l'épaule."),
  ex("dips_chest","Dips buste penché","pecs","bw",1.3,{power:1},105,0,8,["Pectoral inférieur","Triceps","Deltoïde antérieur"],"Poussée verticale au poids du corps. Buste incliné vers l'avant et coudes légèrement ouverts pour transférer la charge sur les pectoraux. Descendre jusqu'à l'épaule au niveau du coude.",0.92),
  ex("pushup","Pompes","pecs","bw",1.0,{power:0.8,core:0.2},75,0,15,["Grand pectoral","Triceps","Sangle abdominale"],"Planche dynamique : le corps reste gainé de la nuque aux talons. Environ 65 % du poids du corps est déplacé. Excellent volume de travail sans matériel.",0.65),
  ex("fly","Écarté couché haltères","pecs","load",0.9,{power:1},75,10,12,["Grand pectoral (adduction)"],"Mouvement monoarticulaire d'adduction horizontale. Coudes fléchis et fixes, étirement contrôlé en bas. Isole le pectoral sans l'aide des triceps."),
  ex("cable_cross","Crossover à la poulie","pecs","load",0.85,{power:1},60,10,12,["Pectoral","Deltoïde antérieur"],"Tension constante grâce aux câbles sur toute l'amplitude. Croiser légèrement les mains en fin de mouvement pour une contraction maximale."),
  ex("pec_deck","Pec deck (butterfly)","pecs","load",0.8,{power:1},60,30,12,["Grand pectoral"],"Machine guidée d'adduction. Trajectoire fixe qui permet de travailler proche de l'échec en sécurité."),
  // DOS
  ex("deadlift","Soulevé de terre","dos","load",1.5,{armor:0.7,propulsion:0.3},150,60,5,["Érecteurs du rachis","Fessiers","Ischio-jambiers","Trapèzes"],"Extension de hanche lourde depuis le sol. Dos neutre, barre au contact des tibias, poussée du sol avec les jambes puis verrouillage des hanches. Mouvement le plus coûteux du catalogue."),
  ex("pullup","Tractions pronation","dos","bw",1.45,{armor:0.8,power:0.2},120,0,6,["Grand dorsal","Grand rond","Biceps","Rhomboïdes"],"Traction verticale au poids du corps. Départ bras tendus, épaules abaissées, menton au-dessus de la barre. Ajoutez du lest une fois 12 répétitions atteintes.",1.0),
  ex("row_bb","Rowing barre","dos","load",1.3,{armor:1},105,40,8,["Grand dorsal","Rhomboïdes","Trapèze moyen","Lombaires"],"Buste penché à 45°, dos verrouillé. Tirage de la barre vers le nombril en ramenant les coudes près du corps. Construit l'épaisseur du dos."),
  ex("row_db","Rowing haltère unilatéral","dos","load",1.15,{armor:1},90,22,10,["Grand dorsal","Grand rond","Rhomboïdes"],"Un genou et une main sur le banc. Le coude glisse le long du flanc vers la hanche. L'unilatéral permet une plus grande amplitude."),
  ex("lat_pd","Tirage vertical poulie","dos","load",1.1,{armor:1},90,45,10,["Grand dorsal","Biceps","Grand rond"],"Barre tirée devant vers le haut du sternum, buste légèrement incliné. Alternative réglable aux tractions."),

  ex("squat","Squat barre","jambes","load",1.5,{propulsion:0.85,core:0.15},150,60,5,["Quadriceps","Grand fessier","Adducteurs","Érecteurs du rachis"],"Flexion simultanée hanches/genoux, barre sur les trapèzes. Descendre sous la parallèle, genoux dans l'axe des pieds, poussée explosive. Générateur principal de puissance des jambes."),

  ex("leg_press","Presse à cuisses","jambes","load",0.8,{propulsion:1},120,100,10,["Quadriceps","Fessiers"],"Poussée guidée à 45°. Permet des charges élevées sans contrainte axiale sur la colonne. Ne pas décoller le bassin."),

  const torso = pts([[cx - ch, yS], [cx + ch, yS], [cx + ch - 3, yC], [cx + wh, yW], [cx - wh, yW], [cx - ch + 3, yC]]);
  const pelvis = pts([[cx - wh - 1, yW], [cx + wh + 1, yW], [cx + 12, yP + 2], [cx - 12, yP + 2]]);
  const helmet = pts([[68, 16], [92, 16], [97, 29], [94, 43], [87, 50], [73, 50], [66, 43], [63, 29]]);
  let body = `<g class="av-body">
    <polygon points="${helmet}"/><path d="M70 31H90"/>
    <polygon points="${pts([[75, 50], [85, 50], [86, yS], [74, yS]])}"/>
    <polygon points="${torso}"/><polygon points="${pelvis}"/>
    ${both(s => `<circle cx="${f1(side(S, s)[0])}" cy="${f1(side(S, s)[1] - 1)}" r="${f1(shR)}"/>`)}
    ${both(s => `<polygon points="${quad(side(S, s), side(E, s), armW, armW - 1)}"/><polygon points="${quad(side(E, s), side(H, s), foreW, foreW - 1)}"/><circle cx="${f1(side(H, s)[0])}" cy="${f1(side(H, s)[1] + 3)}" r="3.6"/>`)}
    ${both(s => `<polygon points="${quad(side(hipR, s), side(kneeR, s), thW, thW - 2)}"/><polygon points="${quad(side(kneeR, s), side(ankR, s), shinW, shinW - 2)}"/><polygon points="${pts([side([ankR[0] - 6, 204], s), side([ankR[0] + 6, 204], s), side([ankR[0] + 8 + 2 * s * 0, 212], s), side([ankR[0] - 7, 212], s)])}"/>`)}
  </g>`;
  // --- détails par niveau
  let lines = "";
  if (lvl >= 3) lines += `<path d="M${cx} ${yS + 2}V${yC + 2}M${f1(cx - ch + 6)} ${yS + 18}Q${cx} ${yS + 27} ${f1(cx + ch - 6)} ${yS + 18}M${f1(cx - 8)} ${yS + 2}L${cx} ${yS + 8}L${f1(cx + 8)} ${yS + 2}"/>`;
  if (lvl >= 6) lines += `<path d="M${f1(cx - wh + 2)} ${yC + 6}H${f1(cx + wh - 2)}M${f1(cx - wh + 1)} ${yC + 13}H${f1(cx + wh - 1)}M${f1(cx - wh)} ${yC + 20}H${f1(cx + wh)}"/>` + both(s => `<circle cx="${f1(side(kneeR, s)[0])}" cy="${kneeR[1]}" r="${f1(thW - 3)}"/>`);
  if (lvl >= 10) lines += `<path d="M80 16L80 6M74 16L76 9M86 16L84 9"/>` + both(s => `<path d="M${f1(side([S[0] - shR, S[1] - shR - 2], s)[0])} ${f1(S[1] - shR - 2)}Q${f1(side([S[0] + shR + 4, 0], s)[0])} ${f1(S[1] - shR)} ${f1(side([S[0] + shR + 3, 0], s)[0])} ${f1(S[1] + shR)}"/>`);
  if (lvl >= 15) lines += both(s => `<path d="M${f1(side([cx + ch - 2, yS + 4], s)[0])} ${yS + 4}L${f1(side([cx + ch + 26, 0], s)[0])} ${yS - 14}M${f1(side([cx + ch - 2, yS + 12], s)[0])} ${yS + 12}L${f1(side([cx + ch + 30, 0], s)[0])} ${yS}M${f1(side([cx + ch - 3, yS + 20], s)[0])} ${yS + 20}L${f1(side([cx + ch + 28, 0], s)[0])} ${yS + 14}"/>`);
  const halo = lvl >= 20 ? `<circle class="av-halo" cx="80" cy="31" r="27"/><circle class="av-halo" cx="80" cy="31" r="31" stroke-dasharray="2 5"/>` : "";
  // --- traces d'aptitudes
  const TRACES = [
    `M${cx - 4} ${yS + 32}h-8v8`, `M${cx + 4} ${yS + 32}h8v8`, `M${cx - 6} ${yS + 44}h-6`, `M${cx + 6} ${yS + 44}h6`,
    `M${cx - 3} ${yS + 4}v10h-5`, `M${cx + 3} ${yS + 4}v10h5`, `M${cx - 10} ${yW - 4}h-3v-6`, `M${cx + 10} ${yW - 4}h3v-6`,
    `M${cx - 14} ${yS + 26}l-4 4`, `M${cx + 14} ${yS + 26}l4 4`, `M${cx - 2} ${yP - 6}h4`, `M${cx} ${yC - 4}v6`
  ];
  const nPerk = st.perks.length;
  const traces = nPerk ? `<path class="av-trace" d="${TRACES.slice(0, Math.min(nPerk * 1, 12)).join("")}"/>` : "";
  const heart = st.perks.includes("adrenaline") ? `<circle class="av-heart" cx="${cx + 9}" cy="${yS + 16}" r="2.4"/>` : "";
  // --- cyberware
  const G = {};
  // implant neural
  G.neural_civ = `<rect x="94" y="26" width="5" height="7" rx="1"/><circle cx="96.5" cy="29.5" r="1.2" class="fill"/>`;
  G.neural_adren = `<rect x="94" y="25" width="5" height="9" rx="1"/><path d="M96.5 34Q99 46 88 56"/><rect x="85" y="52" width="6" height="8" rx="1.5" class="fillsoft"/>`;
  G.neural_sync = `<path d="M63 17Q80 0 97 17M59 13Q80 -6 101 13"/><circle cx="80" cy="6" r="1.6" class="fill"/>`;
  G.neural_ghost = `<polygon class="fillsoft" points="66,26 94,26 92,35 68,35"/><path d="M68 17L61 4M92 17L99 4"/><circle cx="61" cy="4" r="1.5" class="fill"/><circle cx="99" cy="4" r="1.5" class="fill"/>`;
  // exosquelette dorsal (vu de face : harnais et cadre)
  const harness = `<path d="M${f1(cx - ch - 6)} ${yS}H${f1(cx + ch + 6)}M${f1(cx - ch + 5)} ${yS}L${cx + 9} ${yC + 4}M${f1(cx + ch - 5)} ${yS}L${cx - 9} ${yC + 4}"/><circle cx="${cx}" cy="${yS + 24}" r="3"/>`;
  G.dorsal_mk1 = harness;
  G.dorsal_mk2 = harness + both(s => `<path d="M${f1(side([cx + ch + 4, 0], s)[0])} ${yS + 4}V${yC}"/><circle cx="${f1(side([cx + ch + 4, 0], s)[0])}" cy="${yS + 4}" r="2.2" class="fill"/><circle cx="${f1(side([cx + ch + 4, 0], s)[0])}" cy="${yC}" r="2.2" class="fill"/>`);
  G.dorsal_aegis = `<polygon class="fillsoft" points="${pts([[cx - ch + 5, yS + 2], [cx + ch - 5, yS + 2], [cx + ch - 9, yC - 6], [cx, yC + 4], [cx - ch + 9, yC - 6]])}"/><polygon points="${pts([[cx, yS + 14], [cx + 7, yS + 18], [cx + 7, yS + 26], [cx, yS + 30], [cx - 7, yS + 26], [cx - 7, yS + 18]])}"/>` + both(s => { const p = side(S, s); return `<path d="M${f1(p[0] - s * shR)} ${f1(S[1] - shR + 1)}Q${f1(p[0] + s * (shR + 4))} ${f1(S[1] - 3)} ${f1(p[0] + s * (shR + 2))} ${f1(S[1] + shR + 2)}"/>`; });
  // module brachial
  G.arms_mk0 = both(s => { const a = side(E, s), h = side(H, s); const m = [a[0] + (h[0] - a[0]) * 0.62, a[1] + (h[1] - a[1]) * 0.62], n = [a[0] + (h[0] - a[0]) * 0.86, a[1] + (h[1] - a[1]) * 0.86]; return `<polygon class="fillsoft" points="${quad(m, n, foreW + 1.5, foreW + 1.5)}"/>`; });
  G.arms_hydra = both(s => { const a = side(S, s), e = side(E, s), h = side(H, s), o = s * (armW + 2.5); return `<path d="M${f1(a[0] + o)} ${f1(a[1] + 4)}L${f1(e[0] + o)} ${f1(e[1] - 3)}M${f1(e[0] + o * 0.9)} ${f1(e[1] + 4)}L${f1(h[0] + o * 0.8)} ${f1(h[1] - 4)}"/><circle cx="${f1(e[0])}" cy="${f1(e[1])}" r="3.4"/><circle cx="${f1(a[0] + o)}" cy="${f1(a[1] + 4)}" r="1.8" class="fill"/>`; });
  G.arms_plasma = both(s => { const e = side(E, s), h = side(H, s); return `<polygon class="fillsoft" points="${quad(e, h, foreW + 1, foreW)}"/><path d="M${f1(e[0] - 4)} ${f1(e[1] + 6)}l8 4l-8 4l8 4l-8 4l8 4"/><circle cx="${f1(h[0])}" cy="${f1(h[1] + 3)}" r="4.6" class="fillsoft"/>`; });
  // noyau abdominal
  G.core_belt = `<rect class="fillsoft" x="${f1(cx - wh - 1)}" y="${yW - 7}" width="${f1(2 * wh + 2)}" height="7" rx="1.5"/><rect x="${cx - 4}" y="${yW - 6}" width="8" height="5" rx="1"/>`;
  G.core_gyro = `<circle cx="${cx}" cy="${yC + 9}" r="7.5"/><path d="M${cx - 7.5} ${yC + 9}H${cx + 7.5}M${cx} ${yC + 1.5}V${yC + 16.5}"/><circle cx="${cx}" cy="${yC + 9}" r="2.2" class="fill"/>`;
  G.core_arc = `<circle class="fillsoft" cx="${cx}" cy="${yC + 9}" r="9"/><circle cx="${cx}" cy="${yC + 9}" r="5"/><circle cx="${cx}" cy="${yC + 9}" r="2.2" class="fill"/><path d="M${cx} ${yC - 3}V${yC - 7}M${cx - 11} ${yC + 15}l-3 2M${cx + 11} ${yC + 15}l3 2"/>`;
  G.core_raid = `<polygon class="fillsoft" points="${[0, 1, 2, 3, 4, 5].map(i => { const a = Math.PI / 3 * i + Math.PI / 6; return (cx + 9.5 * Math.cos(a)).toFixed(1) + "," + (yC + 9 + 9.5 * Math.sin(a)).toFixed(1); }).join(" ")}"/><polygon points="${cx},${yC + 3.5} ${cx + 5},${yC + 12} ${cx - 5},${yC + 12}"/><circle cx="${cx}" cy="${yC + 9.5}" r="1.7" class="fill"/><path d="M${cx - 12.5} ${yC + 9}h-3M${cx + 12.5} ${yC + 9}h3M${cx} ${yC - 3}v-3"/>`;
  // module jambier
  G.legs_g0 = both(s => { const a = side(ankR, s); return `<polygon class="fillsoft" points="${pts([[a[0] - 8, 200], [a[0] + 8, 200], [a[0] + 9, 213], [a[0] - 9, 213]])}"/><path d="M${f1(a[0] - 5)} 216v3M${f1(a[0])} 216v4M${f1(a[0] + 5)} 216v3"/>`; });
  G.legs_titan = both(s => { const h = side(hipR, s), k = side(kneeR, s), o = s * (thW + 2); return `<path d="M${f1(h[0] + o)} ${h[1] + 4}L${f1(k[0] + o * 0.8)} ${k[1] - 4}"/><circle cx="${f1(h[0] + o)}" cy="${h[1] + 4}" r="2" class="fill"/><circle cx="${f1(k[0])}" cy="${k[1]}" r="4.2"/>`; });
  G.legs_quant = both(s => { const k = side(kneeR, s), a = side(ankR, s); return `<polygon class="fillsoft" points="${quad(k, a, shinW, shinW - 2)}"/><path d="M${f1(k[0] - 7)} ${k[1] + 10}h14M${f1(k[0] - 6.5)} ${k[1] + 19}h13M${f1(a[0] - 6)} ${a[1] - 6}h12"/><circle cx="${f1(k[0])}" cy="${k[1]}" r="4.6"/>`; });
  const gear = SLOT_KEYS.map(sl => eq[sl] && G[eq[sl]] ? `<g class="av-gear ${gearCls(sl)}${hl(sl)}">${G[eq[sl]]}</g>` : "").join("");
  // --- cadre de rang
  const W = 160, Hh = 246;
  const rankName = RANK_TIERS[tier].name;
  let frame = "";
  const corner = (x, y, dx, dy, l) => `M${x} ${y + dy * l}V${y}H${x + dx * l}`;
  const corners = l => corner(3, 3, 1, 1, l) + corner(W - 3, 3, -1, 1, l) + corner(3, Hh - 3, 1, -1, l) + corner(W - 3, Hh - 3, -1, -1, l);
  if (tier === 0) frame = `<path class="fr fr-dim" d="${corners(12)}"/>`;
  if (tier === 1) frame = `<path class="fr" d="${corners(16)}"/>`;
  if (tier === 2) frame = `<rect class="fr fr-thin" x="3" y="3" width="${W - 6}" height="${Hh - 6}"/><path class="fr" d="${corners(18)}"/><path class="fr" d="M3 ${Hh / 2 - 10}h5M3 ${Hh / 2}h8M3 ${Hh / 2 + 10}h5M${W - 3} ${Hh / 2 - 10}h-5M${W - 3} ${Hh / 2}h-8M${W - 3} ${Hh / 2 + 10}h-5"/>`;
  if (tier === 3) frame = `<rect class="fr fr-thin" x="3" y="3" width="${W - 6}" height="${Hh - 6}"/><rect class="fr fr-run" x="7" y="7" width="${W - 14}" height="${Hh - 14}"/><path class="fr" d="${corners(20)}"/>`;
  if (tier >= 4) {
    const oct = c => pts([[c + 10, c], [W - c - 10, c], [W - c, c + 10], [W - c, Hh - c - 10], [W - c - 10, Hh - c], [c + 10, Hh - c], [c, Hh - c - 10], [c, c + 10]]);
    frame = `<polygon class="fr fr-thick${tier === 5 ? " fr-legend" : ""}" points="${oct(3)}"/><polygon class="fr fr-thin${tier === 5 ? " fr-legend" : ""}" points="${oct(8)}"/>` +
      [[14, 14], [W - 14, 14], [14, Hh - 14], [W - 14, Hh - 14]].map(p => `<circle class="fr-rivet${tier === 5 ? " fr-legend" : ""}" cx="${p[0]}" cy="${p[1]}" r="2"/>`).join("");
  }
  const plate = `<g class="fr-plate${tier === 5 ? " fr-legend" : ""}"><path d="M${W / 2 - 54} ${Hh - 3}L${W / 2 - 47} ${Hh - 15}H${W / 2 + 47}L${W / 2 + 54} ${Hh - 3}"/><text x="${W / 2}" y="${Hh - 6.5}">NIV ${lvl} · ${rankName.split(" ")[0]}</text></g>`;
  const grid = Array.from({ length: 9 }, (_, i) => `M${i * 20} 0V${Hh}`).join("") + Array.from({ length: 12 }, (_, i) => `M0 ${i * 20}H${W}`).join("");
  // emblèmes : série de semaines (gauche) et défis d'escouade réussis (droite)
  const sk = opts.noBadges ? 0 : streakInfo().weeks, wins = opts.noBadges ? 0 : (st.squadWins || 0);
  const badges = (sk >= 2 ? `<g class="badge"><title>Série de ${sk} semaines actives</title><path d="M14 14H44L48 22L44 30H14Z"/><path class="bi" d="M19 26l4-4l4 4M19 21l4-4l4 4"/><text x="38" y="25.5">${sk}</text></g>` : "")
    + (wins ? `<g class="badge bw"><title>${wins} défi${wins > 1 ? "s" : ""} d'escouade réussi${wins > 1 ? "s" : ""}</title><polygon points="${pts([[W - 30, 12], [W - 18, 12], [W - 12, 22], [W - 18, 32], [W - 30, 32], [W - 36, 22]])}"/><text x="${W - 24}" y="25.5">${wins}</text></g>` : "");
  return `<svg class="avatar tier-${RANK_TIERS[tier].key}${opts.big ? " big" : ""}" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Châssis de l'opérateur, ${rankName}, niveau ${lvl}, ${SLOT_KEYS.filter(s => eq[s]).length} modules équipés sur 5">
    <defs><linearGradient id="${uid}g" x1="0" x2="0" y1="0" y2="1"><stop offset="0" style="stop-color:var(--neon)" stop-opacity="0"/><stop offset="1" style="stop-color:var(--neon)" stop-opacity=".2"/></linearGradient>
    <clipPath id="${uid}c"><rect x="0" y="0" width="${W}" height="${Hh}"/></clipPath></defs>
    <path class="av-grid" d="${grid}"/>
    ${halo}
    <g transform="translate(0 4)">${body}<g class="av-lines">${lines}</g>${traces}${heart}${gear}</g>
    ${frame}${plate}${badges}
    <g clip-path="url(#${uid}c)"><rect class="scan" x="0" y="0" width="${W}" height="22" fill="url(#${uid}g)"/></g>
  </svg>`;
}

function renderHQ() {

  const st = state, b = computeBonuses(st), need = xpNeeded(st.level), pct = Math.min(100, st.xp / need * 100);
  const availPerks = PERKS.filter(p => perkState(p) === "avail").length;
  const mSets = st.mission ? missionTotals().sets : 0;
  const tabs = [["fiche", "FICHE"], ["arsenal", "ARSENAL"], ["aptitudes", "APTITUDES"], ["archives", "SUIVI"]];
  return `
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span>NEONFITNESS<b>PRO</b></span></div>
    <div class="top-r">${audBtn()}
    <button class="icon-btn set-btn" data-act="settings-open" aria-label="Réglages et sauvegarde"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span class="sync ${sync.mode}" id="sync-chip"><i aria-hidden="true"></i><span>${SYNC_LABEL[sync.mode]}</span></span></button></div>
  </header>
  <section class="panel bracket op-card" aria-label="Fiche de l'opérateur">
    <button class="av-btn" data-act="chassis" aria-label="Ouvrir la fiche du châssis">${avatarSVG(st)}</button>
    <div class="op-info">
      <div class="eyebrow">OPÉRATEUR</div>
      <button class="callsign-btn" data-act="edit-name" aria-label="Modifier le nom de code"><h1 class="callsign">${esc(st.operator.callsign)}</h1><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/></svg></button>
      <div class="rank">${rankFor(st.level)}</div>
      <div class="lvl-row">
        <div class="lvl"><span>NIV</span><b class="num">${st.level}</b></div>
        ${st.perkPoints > 0 && availPerks ? `<button class="pp-badge" data-act="tab" data-tab="aptitudes">${plural(st.perkPoints, "POINT")} D'APTITUDE</button>` : ""}
      </div>
      <div class="xpbar" role="progressbar" aria-valuemin="0" aria-valuemax="${need}" aria-valuenow="${Math.round(st.xp)}" aria-label="Expérience"><i style="width:${pct}%"></i></div>
      <div class="xp-meta"><span>${fmt(st.xp)} / ${fmt(need)} XP</span><span>${fmt(need - st.xp)} XP avant NIV ${st.level + 1}</span></div>
    </div>
    <button class="op-ach" data-act="ach-open" aria-label="Badges : ${badgesGot(st)} obtenus. Ouvrir le tableau d'honneur">
      ${favFams(st).length ? achFavRow(favFams(st), 30, true) : `<span class="op-ach-empty">${badgesGot(st) ? "Épinglez jusqu'à 3 badges ici" : "Aucun badge pour l'instant"}</span>`}
      <span class="op-ach-n">${badgesGot(st)}/${FAM_KEYS.length} ★</span></button>
  </section>
  ${st.mission ? `<button class="banner" data-act="go" data-to="briefing"><div><div class="d">MISSION EN COURS · ${hms(Date.now() - st.mission.start)}</div><p>${plural(mSets, "série").toLowerCase()} validée${mSets > 1 ? "s" : ""}, ${state.loadoutSession.length} exercice${state.loadoutSession.length > 1 ? "s" : ""} au loadout</p></div><span class="go">REPRENDRE →</span></button>` : ""}
  <nav class="tabs" role="tablist">
    ${tabs.map(([id, l]) => `<button class="tab" role="tab" aria-selected="${ui.tab === id}" data-act="tab" data-tab="${id}">${l}${id === "aptitudes" && st.perkPoints > 0 && availPerks ? '<span class="pip" aria-label="points disponibles"></span>' : ""}</button>`).join("")}

  <button class="ex-entry ex-main" data-act="go" data-to="systems"><span class="ex-ic" aria-hidden="true"><svg viewBox="0 0 24 24"><path class="f" d="M1.5 10h2v4h-2zM4.5 6.5h3.5v11H4.5zM16 6.5h3.5v11H16zM20.5 10h2v4h-2zM8 11h8v2H8z"/></svg></span><span class="ex-txt"><b>EXERCICES</b><small>${st.mission ? "Mission en cours : reprendre ou compléter le loadout" : `Choisir un système et lancer une mission · ${EXERCISES.length} exercices`}</small></span><span class="go" aria-hidden="true">›</span></button>
  ${STANDALONE && fb.user ? `<button class="sq-strip" data-act="go" data-to="squad">
    <span class="sq-logo" aria-hidden="true"><svg viewBox="0 0 32 32"><polygon class="hx" points="16,2 28.5,9 28.5,23 16,30 3.5,23 3.5,9"/><path d="M12.5 15.5a2.6 2.6 0 1 0 0-5.2 2.6 2.6 0 0 0 0 5.2zM7.5 22.5c0-2.8 2.2-4.6 5-4.6s5 1.8 5 4.6M19.5 10.4a2.6 2.6 0 0 1 0 5.1M21 18c1.9.5 3.5 2 3.5 4.5"/></svg></span>
    <span class="sq-t"><b>ESCOUADES</b><small>${st.squads.length ? `${esc(st.squads.length === 1 ? (st.squads[0].name || "Mon escouade") : `${st.squads.length} escouades`)} · défi de la semaine et raid du mois` : "Créez ou rejoignez une escouade avec vos amis"}</small></span>
    <span class="go" aria-hidden="true">›</span></button>` : ""}
  <div>${ui.tab === "arsenal" ? tabArsenal(b) : ui.tab === "aptitudes" ? tabPerks() : ui.tab === "archives" ? tabArchives() : tabFiche(b)}</div>`;
}

function tabFiche(b) {
  const st = state, rookie = st.missions === 0;
  const scale = Math.max(40, ...STAT_KEYS.map(k => statTotal(k, b))) * 1.15;

/* ---- Courbe de progression ---- */
function progressChart(id) {

  const ticks = [y0, (y0 + y1) / 2, y1];
  const path = vals.map((v, i) => `${i ? "L" : "M"}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join("");
  const area = log.length > 1 ? `${path}L${X(vals.length - 1).toFixed(1)} ${H - padB}L${X(0).toFixed(1)} ${H - padB}Z` : "";
  const first = vals[0], last = vals[vals.length - 1], delta = last - first;
  const best = log.reduce((a, x) => (time ? x.reps : x.e1) > (time ? a.reps : a.e1) ? x : a, log[0]);

function gripSVG(id) {

      <path class="gr-body" d="M${cx - SW} 70H${cx + SW}L${cx + 16} 118H${cx - 16}Z"/>
      <path class="gr-body" d="M${cx - 8} 118L${cx - 10} 152M${cx + 8} 118L${cx + 10} 152"/>
      ${hand(hx(-1), -1)}${hand(hx(1), 1)}

  }

async function squadCreate() {
  if (squad.busy || !fb.fs || !fb.user) return;
  const name = cleanName(($("#sq-name") || {}).value || "");
  squad.draftName = name;
  if (name.length < 2) { setSqMsg("Donnez un nom d'au moins 2 caractères à l'escouade."); shake($("#sq-name")); return; }
  if (state.squads.length >= 10) { setSqMsg("Limite de 10 escouades atteinte. Quittez-en une pour en créer une nouvelle."); return; }
  squad.busy = true; setSqMsg("");
  try {
    let code = null;
    for (let i = 0; i < 5 && !code; i++) {
      const c = genCode();
      const s = await fb.fs.collection("squads").doc(c).get();
      if (!s.exists) code = c;
    }
    if (!code) throw { code: "busy" };
    await fb.fs.collection("squads").doc(code).set({ name, createdBy: fb.user.uid, createdAt: Date.now() });
    await joinWrite(code, name, true);
  } catch (e) { setSqMsg(sqErr(e)); }
  squad.busy = false;
}
async function squadJoin() {
  if (squad.busy || !fb.fs || !fb.user) return;
  const raw = ($("#sq-code") || {}).value || "";
  squad.draftCode = raw;
  const code = normCode(raw);
  if (code.length !== 6) { setSqMsg("Le code contient 6 caractères, par exemple NX7-K2P."); shake($("#sq-code")); return; }
  if (state.squads.some(s => s.code === code)) { ui.squadSel = code; squad.panel = null; squad.draftCode = ""; render(); toast("Vous faites déjà partie de cette escouade."); return; }
  if (state.squads.length >= 10) { setSqMsg("Limite de 10 escouades atteinte. Quittez-en une pour en rejoindre une autre."); return; }
  squad.busy = true; setSqMsg("");
  try {
    const s = await fb.fs.collection("squads").doc(code).get();
    if (!s.exists) { setSqMsg("Aucune escouade avec ce code. Vérifiez-le auprès de votre ami."); squad.busy = false; return; }
    const d = s.data() || {};
    if (Array.isArray(d.banned) && d.banned.includes(fb.user.uid)) { setSqMsg("Le chef de cette escouade vous en a retiré : vous ne pouvez pas la rejoindre."); squad.busy = false; return; }
    await joinWrite(code, typeof d.name === "string" ? d.name.slice(0, 30) : "", false);
  } catch (e) { setSqMsg(sqErr(e)); }
  squad.busy = false;
}
async function joinWrite(code, name, created) {
  await fb.fs.collection("squads").doc(code).collection("members").doc(fb.user.uid).set(Object.assign({}, buildCard(), { updatedAt: Date.now() }));
  if (!state.squads.some(s => s.code === code)) state.squads.push({ code, name });
  ui.squadSel = code; squad.panel = null; squad.draftName = ""; squad.draftCode = ""; squad.msg = ""; squad.sort = "week";
  squad.lastSig = null;
  save();
  closeSquadSub();
  render();
  vibrate([30, 30, 80]);

}
async function squadInvite() {
  const entry = state.squads.find(s => s.code === squad.code); if (!entry) return;
  const url = location.origin + location.pathname;
  const name = squad.name || entry.name || "mon escouade";
  const text = `Rejoins mon escouade « ${name} » sur NeonFitness Pro ! Crée ton compte sur ${url} puis va dans Escouades → Rejoindre avec le code ${fmtCode(entry.code)}`;
  try {
    if (navigator.share) { await navigator.share({ title: "NeonFitness Pro", text }); return; }
  } catch (e) { if (e && e.name === "AbortError") return; }
  try { await navigator.clipboard.writeText(text); toast("Invitation copiée : collez-la dans un message à vos amis."); }

}
async function squadKick(uid) {
  if (!isLeader() || !uid || uid === fb.user.uid) return;
  const code = squad.code, m = squad.members.find(x => x.id === uid);
  const ref = fb.fs.collection("squads").doc(code);
  const banned = [...new Set([...squad.banned, uid])].slice(-200);
  const names = Object.assign({}, squad.bannedNames, { [uid]: m ? m.callsign : "Opérateur" });
  try {
    await ref.update({ banned, bannedNames: names });
    await ref.collection("members").doc(uid).delete();
    closeSheet();
    vibrate([80, 40, 120]);

  const banned = squad.banned.filter(x => x !== uid);
  const names = Object.assign({}, squad.bannedNames); delete names[uid];
  try { await fb.fs.collection("squads").doc(squad.code).update({ banned, bannedNames: names }); toast("Ce membre peut de nouveau rejoindre l'escouade avec le code."); }
  catch (e) { toast(sqErr(e), true); }

function missionTotals() {
  const m = state.mission; let xp = 0, sets = 0, ton = 0;
  if (m) for (const id in m.sets) { const e = EX[id]; m.sets[id].forEach(s => { xp += s.xp; sets++; if (e && e.type !== "time") ton += s.load * s.reps; }); }
  return { xp, sets, ton };
}
function loadCap(id) {
  const k = loadKind(id), pl = curPlace();
  if (!k) return 0;

  return cap > 0 && pl.items.includes(k) ? cap : 0;
}
function getDraft(id) {
  const e = EX[id], m = state.mission;
  const cap = loadCap(id);
  const d = (m && isObj(m.draft[id]) ? m.draft[id] : null) || state.lastSets[id] || { kg: cap ? Math.min(e.defKg, cap) : e.defKg, reps: e.defReps };

    $("#rest-time").textContent = mmss(Math.ceil(left));
    const sec = Math.ceil(left);
    if (sec !== restLastSec) { if (restLastSec !== null) { if (sec <= 3) sfx("count", sec); else sfx("sec", sec % 2); } restLastSec = sec; }
    $("#rest-state").textContent = "RÉCUPÉRATION";
    fg.setAttribute("stroke-dashoffset", (RING_C * (1 - Math.min(1, left / r.total))).toFixed(2));
    $("#rest-btn").textContent = "PASSER LE REPOS";
  } else {
    ring.classList.add("done");
    $("#rest-time").textContent = "+" + mmss(-left);
    $("#rest-state").textContent = "SYSTÈMES PRÊTS";
    fg.setAttribute("stroke-dashoffset", "0");
    $("#rest-btn").textContent = "REPRENDRE LE COMBAT";
    if (!restDoneFired) { restDoneFired = true; vibrate([200, 100, 200]); sfx("restDone"); musicRest(false); }
  }

/* =====================================================================
   Écran 4 — Rapport de mission
   ===================================================================== */
function finishMission() {
  const st = state, m = st.mission;
  if (!m) return;
  const t = missionTotals();
  if (!t.sets) { toast("Validez au moins une série avant de terminer.", true); return; }
  const b = computeBonuses(st);
  const undoSnap = progressSnapshot();
  const streakBefore = streakInfo();
  const gains = { power: 0, armor: 0, propulsion: 0, core: 0 };
  const xpStat = { power: 0, armor: 0, propulsion: 0, core: 0 };
  const perEx = [], records = [];
  let push = 0, coreSec = 0;
  const now = Date.now();
  for (const id in m.sets) {
    const e = EX[id]; if (!e) continue;
    let exXp = 0, exTon = 0, best = null;
    m.sets[id].forEach(s => {
      exXp += s.xp; if (e.type !== "time") exTon += s.load * s.reps;
      for (const k in e.stats) { gains[k] += s.xp * e.stats[k] / 60; xpStat[k] += s.xp * e.stats[k]; }
      if (PUSH_IDS(id)) push += s.reps;
      if (e.type === "time" && e.cat === "abdos") coreSec += s.reps;
      if (!best || s.score > best.score) best = s;
    });
    perEx.push({ id, sets: m.sets[id].length, xp: exXp, ton: exTon });
    if (best) {
      const log = st.exLog[id] || (st.exLog[id] = []);
      log.push({ d: now, kg: best.kg, reps: best.reps, score: best.score, e1: e1rm(e, best), sets: m.sets[id].length, vol: Math.round(exTon) });
      if (log.length > 40) log.splice(0, log.length - 40);
    }
    const old = st.records[id];
    if (best && (!old || best.score > old.score)) {
      st.records[id] = { score: best.score, kg: best.kg, reps: best.reps, date: Date.now() };
      if (old) records.push({ id, kg: best.kg, reps: best.reps, prev: old });
    }
  }
  // la série compte si cette mission est la 2e de la semaine ou si la série est déjà sécurisée
  const streakNow = streakBefore.secured ? streakBefore.weeks : (streakBefore.thisWeek + 1 >= 2 ? streakBefore.weeks + 1 : streakBefore.weeks);
  const sBonus = streakBonus(streakNow);
  const bonusPct = 10 + b.missionBonus + sBonus;
  const bonusXp = Math.round(t.xp * bonusPct / 100);
  const progRes = programProgress(m), progXp = progRes && progRes.done ? progRes.p.xp : 0;
  if (progXp) { st.life.programs++; const pk = "w" + weekIndex(weekStartOf()) + "l" + progRes.p.lvl; st.life.programsBy[pk] = (st.life.programsBy[pk] || 0) + 1; }
  const totalXp = t.xp + bonusXp + progXp;
  const oldLevel = st.level, oldXp = st.xp, oldStats = { ...st.stats };
  const oldPct = oldXp / xpNeeded(oldLevel) * 100;
  st.xp += totalXp; st.totalXp += totalXp;
  let levels = 0;
  while (st.xp >= xpNeeded(st.level)) { st.xp -= xpNeeded(st.level); st.level++; st.perkPoints++; levels++; }
  STAT_KEYS.forEach(k => { gains[k] = Math.round(gains[k] * 10) / 10; st.stats[k] = Math.round((st.stats[k] + gains[k]) * 10) / 10; });
  st.missions++; st.tonnage += t.ton;
  const newGear = checkUnlocks(st);
  const newPerks = PERKS.filter(p => p.lvl > oldLevel && p.lvl <= st.level).map(p => p.id);
  const dur = Date.now() - m.start;
  const catCount = {};
  perEx.forEach(p => { const c = EX[p.id].cat; catCount[c] = (catCount[c] || 0) + p.sets; });
  const focus = Object.keys(catCount).sort((a, z) => catCount[z] - catCount[a]).slice(0, 2).map(c => CAT_BY_ID[c].label.toLowerCase()).join(" + ");
  STAT_KEYS.forEach(k => { xpStat[k] = Math.round(xpStat[k]); });
  const repsTot = lifeOnMission(st, m, t, totalXp, records, now);
  const exDetail = Object.keys(m.sets).filter(id => EX[id] && m.sets[id].length).map(id => ({ id, s: m.sets[id].map(x => [x.kg, x.reps, Math.round(x.xp)]) }));
  st.history.unshift({ ex: exDetail, recIds: records.map(x => x.id), reps: repsTot, date: now, xp: totalXp, ton: Math.round(t.ton), sets: t.sets, exCount: perEx.length, dur, level: st.level, focus: focus.charAt(0).toUpperCase() + focus.slice(1),
    recs: records.length, push, coreSec, xpStat, cats: Object.keys(catCount), ...(progRes ? { prog: progRes.p.name, progDone: progRes.done } : {}) });
  st.undo = { at: now, snap: undoSnap };
  st.history = st.history.slice(0, 60);
  st.mission = null;
  st.loadoutSession = [];
  ui.report = { t, bonusXp, bonusPct, totalXp, oldLevel, newLevel: st.level, oldPct, newPct: st.xp / xpNeeded(st.level) * 100, levels,
                oldStats, newStats: { ...st.stats }, gains, newGear, newPerks, records, perEx, dur, missionNo: st.missions,
                streak: streakNow, sBonus, note: { energy: 0, rpe: 0, text: "" }, noteSaved: false,
                prog: progRes ? { name: progRes.p.name, done: progRes.done, xp: progXp, doneN: progRes.doneN, total: progRes.total, bonus: progRes.p.xp } : null };
  save();
  closeRest();
  ui.screen = "report";
  render();
  window.scrollTo(0, 0);
  achSoon(2600);
}

let reportAnimToken = 0;
function animateReport() {
  const r = ui.report; if (!r || r.animated) return;
  r.animated = true;
  const token = ++reportAnimToken;
  const bars = document.querySelectorAll(".stat-bar i[data-to]");
  const bar = $("#rp-xpfill"), lvlEl = $("#rp-level"), lu = $("#rp-levelup");
  if (reduced()) {
    bars.forEach(i => { i.style.width = i.dataset.to + "%"; });
    if (bar) bar.style.width = r.newPct + "%";
    if (lvlEl) lvlEl.textContent = r.newLevel;
    return;
  }
  setTimeout(() => bars.forEach(i => { i.style.width = i.dataset.to + "%"; }), 350);
  let level = r.oldLevel, steps = r.levels;
  const next = () => {
    if (token !== reportAnimToken || !bar) return;
    if (steps > 0) {
      bar.style.transition = ""; bar.style.width = "100%";
      setTimeout(() => {
        if (token !== reportAnimToken) return;
        level++; steps--;
        lvlEl.textContent = level;
        lu.classList.add("show");
        levelFlash(level);
        bar.style.transition = "none"; bar.style.width = "0%"; void bar.offsetWidth;
        setTimeout(next, 700);
      }, 950);
    } else {
      bar.style.transition = ""; bar.style.width = r.newPct + "%";
    }
  };
  setTimeout(next, 500);
}
function levelFlash(level) {
  vibrate([60, 40, 120]); sfx("levelup");
  const f = document.createElement("div");
  f.className = "lvl-flash"; f.setAttribute("aria-hidden", "true");
  f.innerHTML = `<div>LEVEL UP<small>NIVEAU ${level} · ${rankFor(level)}</small></div>`;
  document.body.appendChild(f);
  setTimeout(() => f.remove(), 1300);
}
