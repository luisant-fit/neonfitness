    toast(`Filtre actif : ${n} exercices réalisables (${PLACES[state.equip.active]}).`);
  },
  "sheet-ex": el => openExSheet(el.dataset.id),
  "close-sheet": () => closeSheet(),
  "toggle-ex": el => toggleEx(el.dataset.id),
  "validate-loadout": () => {
    if (!state.loadoutSession.length) { shake($("#lo-counter")); vibrate(60); toast("Loadout vide : cochez au moins un exercice.", true); return; }
    ensureMission(); save(); go("briefing");
  },
  "step": el => {
    const id = el.dataset.id, f = el.dataset.f, d = parseFloat(el.dataset.d), e = EX[id];
    const input = document.getElementById(`${f}-${id}`); if (!input || !e) return;
    let v = parseNum(input.value); if (!Number.isFinite(v)) v = f === "kg" ? e.defKg : e.defReps;
    v = f === "kg" ? Math.max(0, Math.min(1000, Math.round((v + d) * 100) / 100)) : Math.max(1, Math.min(e.type === "time" ? 3600 : 500, Math.round(v + d)));
    input.value = f === "kg" ? String(v).replace(".", ",") : String(v);
    input.parentElement.classList.remove("bad");
    onDraftInput(id);
  },
  "validate-set": el => validateSet(el.dataset.id, el),
  "del-set": el => deleteSet(el.dataset.id, +el.dataset.i),
  "adrenaline": () => {
    const m = state.mission; if (!m || m.adrenaline === "used") return;
    m.adrenaline = m.adrenaline === "armed" ? "ready" : "armed";
    if (m.adrenaline === "armed") { vibrate([20, 30, 60]); toast("Injection armée : prochaine série ×2 XP."); }
    save(); render();
  },
  "finish-mission": () => finishMission(),
  "rest-add": el => { const m = state.mission; if (!m || !m.rest) return; const d = +el.dataset.d * 1000; m.rest.endAt = Math.max(Date.now(), m.rest.endAt + d); m.rest.total = Math.max(1, m.rest.total + (+el.dataset.d)); if (m.rest.endAt > Date.now()) restDoneFired = false; save(); tickRest(); },
  "rest-skip": () => endRest(),
  "ach-open": () => { const t = $("#ach-toast"); if (t) t.classList.remove("show"); openAchSheet(); },
  "ach-pin": el => achPin(el.dataset.id),
  "cal-nav": el => { ui.calOff = Math.max(-12, Math.min(0, (ui.calOff || 0) + (+el.dataset.d))); render(); },
  "map-days": el => { ui.mapDays = +el.dataset.n; render(); },
  "weigh-save": () => weighSave(),
  "warm-tick": el => warmTick(el.dataset.id, +el.dataset.i),
  "raid-claim": () => claimRaid(squad.code),
  "effort-start": el => startEffort(el.dataset.id),
  "effort-stop": () => stopEffort(),
  "effort-cancel": () => cancelEffort(),
  "effort-resume": () => resumeEffort(),
  "effort-save": () => saveEffort(),
  "effort-back": () => backEffort(),
  "ef-adj": el => effortAdjust(+el.dataset.d),
  "equip": el => { const g = GEAR_BY_ID[el.dataset.id]; if (!g || !state.gear.unlocked.includes(g.id)) return; state.gear.equipped[g.slot] = g.id; save(); vibrate(25); toast(`${g.name} équipé.`); render(); if (el.dataset.reopen) openGearSheet(el.dataset.reopen); },
  "unequip": el => { const s = el.dataset.slot; if (!(s in state.gear.equipped)) return; state.gear.equipped[s] = null; save(); render(); if (el.dataset.reopen) openGearSheet(el.dataset.reopen); },
  "perk-sheet": el => openPerkSheet(el.dataset.id, false),
  "perk-ask": el => openPerkSheet(el.dataset.id, true),
  "perk": el => {
    const p = PERK_BY_ID[el.dataset.id]; if (!p || perkState(p) !== "avail") return;
    state.perks.push(p.id); state.perkPoints--; save(); vibrate([30, 30, 80]); sfx("reward"); toast(`Aptitude installée : ${p.name}`); render(); openPerkSheet(p.id, false); achSoon(800);
  },
  "report-done": () => { ui.report = null; ui.tab = "fiche"; go("hq"); },
  "edit-name": () => openNameSheet(),
  "save-name": () => { const i = $("#name-input"); if (i && commitName(i.value)) { closeSheet(); toast("Nom de code enregistré."); render(); } else if (i) shake(i); },
  "sync-info": () => openSyncSheet(),
  "sync-retry": () => { sync.fails = 0; if (!state.updatedAt) state.updatedAt = Date.now(); pushNow(); closeSheet(); },
  "dismiss-tip": el => { if (el.dataset.tip in state.tips) { state.tips[el.dataset.tip] = true; save(); render(); } },
  "replay-guide": () => openOnboard(),
  "ob-next": () => obNext(),
  "ob-back": () => { ui.ob = Math.max(0, (ui.ob || 0) - 1); renderOnboard(); },
  "ob-skip": () => closeOnboard(true),
  "export": () => openExportSheet(),
  "copy-export": () => copyExport(),
  "import": () => openImportSheet(),
  "import-preview": () => previewImport(),
  "sign-out": () => signOut(),
  "auth-mode": el => { const em = $("#au-email"); if (em) authEmail = em.value.trim(); renderAuth(el.dataset.mode); },
  "auth-google": () => googleAuth(),
  "squad-select": el => { ui.squadSel = el.dataset.code; squad.panel = null; render(); },
  "squad-panel": el => { squad.panel = el.dataset.panel || null; squad.msg = ""; render(); const f = $(squad.panel === "join" ? "#sq-code" : "#sq-name"); if (f) f.focus(); },
  "squad-create": () => squadCreate(),
  "squad-join": () => squadJoin(),
  "squad-sort": el => { if (el.dataset.sort in SORTS) { squad.sort = el.dataset.sort; render(); } },
  "squad-member": el => openMemberSheet(el.dataset.id),
  "squad-invite": () => squadInvite(),
  "squad-manage": () => { squad.manage = !squad.manage; render(); },
  "squad-rename": () => squadRename(),
  "squad-unban": el => squadUnban(el.dataset.id),
  "reload": () => location.reload()
};
function keepNoteText() { const t = $("#note-text"); if (t && ui.report) ui.report.note.text = t.value.slice(0, 200); }
const holdActions = {
  "undo-mission": () => undoLastMission(),
  "squad-leave": () => squadLeave(),
  "squad-kick": el => squadKick(el.dataset.id),
  "import-confirm": () => {
    if (!ui.pendingImport) return;
    state = ui.pendingImport; ui.pendingImport = null;
    state.onboarded = true;
    save();
    vibrate([60, 40, 120]);
    closeSheet(); closeRest();
    ui.screen = "hq"; ui.tab = "fiche"; ui.report = null;
    render();
    toast(`Progression importée : ${state.operator.callsign}, niveau ${state.level}.`);
  },
  "reset-loadout": el => {
    state.loadoutSession = [];
    save();
    vibrate([120, 60, 200]);
    redFlash();
    shake($("#ex-list"));
    shake(el);
    syncLoadoutUI();
    if (ui.sheetEx) openExSheet(ui.sheetEx);
    toast("Loadout purgé.");
  },
  "abort-mission": () => {
    state.mission = null; save();
    vibrate([120, 60, 200]); redFlash(); closeRest();
    toast("Mission abandonnée. Le loadout est conservé.");
    go("catalog");
  },
  "wipe-save": () => {
    const keepName = state.operator.callsign;
    state = defaultState(); state.operator.callsign = keepName; state.onboarded = true;
    save(); vibrate([200, 80, 300]); redFlash();
    ui.tab = "fiche"; closeSheet(); toast("Opérateur réinitialisé au niveau 1.");
    go("hq");
  }
};

const SND_OWN = new Set(["toggle-ex", "validate-set", "step", "close-sheet", "finish-mission", "aud-toggle", "warm-tick", "ach-pin"]);
const SND_NAV = new Set(["go", "tab", "validate-loadout", "report-done", "squad-select", "pick-cat"]);
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (el) {
    if (el.closest("[aria-disabled='true']")) return;
    const act = el.dataset.act, fn = actions[act];
    if (fn) {
      e.preventDefault();
      const own = SND_OWN.has(act);
      if (!own) sfx(SND_NAV.has(act) ? "nav" : "tap");
      fn(el, e);
      achSoon(900);
      if (act === "toggle-ex") sfx(state.loadoutSession.includes(el.dataset.id) ? "on" : "off");
      else if (act === "step") sfx("step", +el.dataset.d > 0);
      else if (act === "finish-mission" && ui.screen === "report") sfx("complete");
    }
    return;
  }
  const h = e.target.closest("[data-hold]");
  if (h && Date.now() - lastHoldFire > 400) toast(`Maintenez le bouton appuyé (${(+(h.dataset.ms || 600) / 1000).toLocaleString("fr-FR")} s) pour confirmer.`, true);
  if (ui.delArm && !e.target.closest(".del")) { ui.delArm = null; if (ui.screen === "briefing") render(); }
  if (ui.favDel && !e.target.closest(".del")) { ui.favDel = null; if (ui.screen === "hq" || ui.screen === "systems") render(); }
});

/* ---- appui long ---- */
let hold = null, lastHoldFire = 0;
function startHold(el) {
  cancelHold();
  const ms = +el.dataset.ms || 600;
  el.style.setProperty("--hold-ms", ms + "ms");
  void el.offsetWidth;
  el.classList.add("arming");
  vibrate(10); holdTone(ms);
  hold = { el, timer: setTimeout(() => {
    el.classList.remove("arming"); holdToneStop(); sfx("off");
    const act = el.dataset.hold; hold = null; lastHoldFire = Date.now();
    if (holdActions[act]) holdActions[act](el);
  }, ms) };
}
function cancelHold() { if (!hold) return; holdToneStop(); clearTimeout(hold.timer); hold.el.classList.remove("arming"); hold = null; }
document.addEventListener("pointerdown", e => {
  const el = e.target.closest("[data-hold]");
  if (!el || el.disabled || (e.button !== undefined && e.button > 0)) return;
  startHold(el);
});
["pointerup", "pointercancel"].forEach(t => document.addEventListener(t, cancelHold));
document.addEventListener("pointerout", e => { if (hold && e.target === hold.el && !hold.el.contains(e.relatedTarget)) cancelHold(); });
document.addEventListener("contextmenu", e => { if (e.target.closest("[data-hold]")) e.preventDefault(); });
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { if ($("#aud-pop")) { audClose(); return; } if (!$("#sheet").hidden) closeSheet(); return; }
  const el = e.target.closest && e.target.closest("[data-hold]");
  if (el && (e.key === " " || e.key === "Enter")) { e.preventDefault(); if (!e.repeat) startHold(el); }
  if (e.key === "Enter" && e.target.matches("[data-field]")) { e.preventDefault(); validateSet(e.target.dataset.id, e.target); }
  if (e.key === "Enter" && e.target.id === "name-input") { e.preventDefault(); actions["save-name"](); }
  if (e.key === "Enter" && e.target.id === "ob-name") { e.preventDefault(); obNext(); }
  if (e.key === "Enter" && e.target.id === "wt-in") { e.preventDefault(); weighSave(); }
  if (e.key === "Enter" && e.target.id === "ef-secs") { e.preventDefault(); saveEffort(); }
  if (e.key === "Enter" && e.target.id === "sq-name") { e.preventDefault(); squadCreate(); }
  if (e.key === "Enter" && e.target.id === "fav-name") { e.preventDefault(); saveFavorite(); }
  if (e.key === "Enter" && e.target.id === "sq-code") { e.preventDefault(); squadJoin(); }
});
document.addEventListener("keyup", e => { if (e.key === " " || e.key === "Enter") { if (e.target.closest && e.target.closest("[data-hold]")) e.preventDefault(); cancelHold(); } });

/* ---- saisies ---- */
function onDraftInput(id) {
  const { kg, reps } = readDraftInputs(id);
  const pl = document.getElementById("pl-" + id); if (pl) pl.innerHTML = plateHTML(kg);
  const wm = document.getElementById("warm-" + id); if (wm && Number.isFinite(kg)) wm.outerHTML = warmupHTML(EX[id], kg);
  storeDraft(id, kg, reps);
  const pv = document.getElementById("pv-" + id);
  if (pv) pv.textContent = previewXp(id, kg, reps);
}
document.addEventListener("input", e => {
  const t = e.target;
  if (t.matches("[data-field]")) { t.parentElement.classList.remove("bad"); onDraftInput(t.dataset.id); }
  if (t.dataset && t.dataset.eqbar) { const v = parseNum(t.value); if (Number.isFinite(v) && v >= 5 && v <= 30) { curPlace().barKg = Math.round(v * 10) / 10; save(); } }
  if (t.dataset && t.dataset.eqmax) {
    const v = parseNum(t.value), pl = curPlace();
    const val = Number.isFinite(v) && v > 0 ? Math.min(t.dataset.eqmax === "db" ? 200 : 500, Math.round(v * 10) / 10) : 0;
    if (t.dataset.eqmax === "db") pl.maxDb = val; else pl.maxBb = val;
    save();
  }
  if (t.id === "snd-sfxvol" || t.id === "snd-musvol") {
    t.style.setProperty("--p", t.value + "%");
    setSnd(t.id === "snd-sfxvol" ? { sfxVol: (+t.value || 0) / 100 } : { musicVol: (+t.value || 0) / 100 });
  }
  if (t.id === "ef-secs") effortReviewUpdate();
  if (t.id === "sq-name") squad.draftName = t.value;
  if (t.id === "sq-code") squad.draftCode = t.value;
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "snd-sfxvol") { sfx("confirm"); return; }
  if (t.id === "set-callsign") {
    if (commitName(t.value)) { toast("Nom de code mis à jour."); render(); } else t.value = state.operator.callsign;
  } else if (t.id === "set-bw") {
    const v = parseNum(t.value);
    if (!Number.isFinite(v) || v < 30 || v > 250) { toast("Poids de corps : entre 30 et 250 kg.", true); t.value = fmt1(state.operator.bodyweight); return; }
    logWeight(Math.round(v * 10) / 10); save(); toast("Poids de corps enregistré."); if (ui.screen === "hq") render(); achSoon(300);
  }
});
document.addEventListener("toggle", e => { const d = e.target; if (d && d.classList && d.classList.contains("mm-det")) ui.mmOpen = d.open; if (d && d.dataset && d.dataset.warm) { ui.warmOpen = ui.warmOpen || {}; ui.warmOpen[d.dataset.warm] = d.open; } }, true);
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { if (sync.ref && sync.mode === "saving") pushNow(); return; }
  if (effort) tickEffort();
  if (!$("#rest").hidden) tickRest();
});
window.addEventListener("pagehide", () => { if (sync.ref && sync.mode === "saving") pushNow(); });
window.addEventListener("error", () => toast("Anomalie système détectée. Rechargez la page si l'affichage est bloqué.", true));

/* ---- démarrage ---- */
window.addEventListener("offline", () => { if (sync.ref) setSyncMode("offline"); });
window.addEventListener("online", () => {
  if (!sync.ref) return;
  setSyncMode(sync.writing ? "saving" : "cloud");
  if (sync.pending || sync.fails) { sync.fails = 0; pushNow(); }
});
if (STANDALONE) {
  bootFirebase();
} else {
  bootPristine = isPristine();
  render();
  const obFallback = setTimeout(maybeOnboard, 3500);
  initSync().finally(() => { clearTimeout(obFallback); maybeOnboard(); });
}
</script>
</body>
</html>
