<title>NeonFitness Pro</title>

<style>
/* Layout: single-column tactical ship terminal (max 600px), sticky command bars, fixed action footers, bottom-sheet analysis terminal */
:root{
  --void:#000000;
  --panel:#0D0D0D;
  --panel-2:#141414;
  --line:#1C2819;
  --line-hi:rgba(var(--neon-rgb),.34);
  --neon:#39FF14;
  --neon-soft:rgba(var(--neon-rgb),.12);
  --neon-glow:rgba(var(--neon-rgb),.55);
  --alert:#FF3B30;
  --alert-soft:rgba(var(--alert-rgb),.14);
  --legend:#FFC53D;
  --text:#DCE8D6;
  --muted:#80907B;
  --dim:#3E4B3B;
  --ink:#000000;
  --f-display:"Orbitron","Eurostile","Arial Black",system-ui,sans-serif;
  --f-body:"Inter","Roboto",system-ui,-apple-system,"Segoe UI",sans-serif;
  --gut-l:max(16px, env(safe-area-inset-left, 0px));
  --gut-r:max(16px, env(safe-area-inset-right, 0px));
  --neon-rgb:57,255,20;
  --legend-rgb:255,197,61;
  --alert-rgb:255,59,48;
  --muted-rgb:128,144,123;
  --void-rgb:0,0,0;
  --deep:#030603;
  --sel:#0F140D;
  --common:#7bc96a;
  --equip:#86c46f;
  --prop:#3f5e39;
  --scan:rgba(255,255,255,.022);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--void);color:var(--text)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent;min-height:100%;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--void)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:200;background:repeating-linear-gradient(0deg,var(--scan) 0 1px,transparent 1px 3px)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--neon);outline-offset:2px}
input{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}

.app{max-width:600px;margin:0 auto;padding-left:var(--gut-l);padding-right:var(--gut-r);padding-block:12px 32px;min-height:100vh}
.app.has-footer{padding-bottom:calc(112px + env(safe-area-inset-bottom,0px))}

/* ---------- type ---------- */
.d{font-family:var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.eyebrow{font-family:var(--f-display);font-size:10px;letter-spacing:.22em;color:var(--muted);text-transform:uppercase}
.h2{font-family:var(--f-display);font-size:12px;font-weight:700;letter-spacing:.2em;color:var(--neon);text-transform:uppercase;display:flex;align-items:center;gap:10px}
.h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line-hi),transparent)}
.hint{color:var(--muted);font-size:13px}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}

/* ---------- panels ---------- */
.panel{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:4px}
.panel.bracket::before,.panel.bracket::after{content:"";position:absolute;width:12px;height:12px;border:2px solid var(--neon);pointer-events:none}
.panel.bracket::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
.panel.bracket::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
.block{display:flex;flex-direction:column;gap:12px;margin-top:26px}

/* ---------- buttons ---------- */
.btn{font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;min-height:48px;padding:10px 16px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;gap:8px;position:relative;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:transform .08s,box-shadow .2s,filter .2s}
.btn:active{transform:scale(.98)}
.btn-neon{background:var(--neon);color:var(--ink);box-shadow:0 0 18px rgba(var(--neon-rgb),.35)}
.btn-neon:hover{box-shadow:0 0 26px var(--neon-glow)}
.btn-alert{background:var(--alert);color:var(--ink)}
.btn-ghost{border:1px solid var(--neon);color:var(--neon);background:transparent}
.btn-ghost:hover{background:var(--neon-soft)}
.btn-quiet{border:1px solid var(--line);color:var(--muted);background:var(--panel-2)}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn small{display:block;font-size:8px;letter-spacing:.18em;opacity:.75;font-weight:500}
.btn .stack{display:flex;flex-direction:column;align-items:center;line-height:1.15;gap:2px}
.hold{touch-action:manipulation}
.hold::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.38);transform:scaleX(0);transform-origin:left;pointer-events:none}
.hold.arming::after{transform:scaleX(1);transition:transform var(--hold-ms,600ms) linear}
.hold.btn-ghost::after,.hold.btn-quiet::after{background:var(--alert-soft)}

/* ---------- top bar / HQ ---------- */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:6px 14px}
.brand{font-family:var(--f-display);font-weight:900;font-size:15px;letter-spacing:.12em;display:flex;align-items:center;gap:10px;color:var(--text)}
.brand b{color:var(--neon);margin-left:6px;text-shadow:0 0 10px var(--neon-glow)}
.brand-mark{width:14px;height:14px;border:2px solid var(--neon);transform:rotate(45deg);box-shadow:0 0 8px var(--neon-glow)}
.sys{font-family:var(--f-display);font-size:10px;letter-spacing:.18em;color:var(--muted);display:flex;align-items:center;gap:8px;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--neon);box-shadow:0 0 8px var(--neon);animation:blink 2.4s infinite}
@keyframes blink{0%,70%,100%{opacity:1}80%{opacity:.25}}

.op-card{display:grid;grid-template-columns:124px minmax(0,1fr);gap:16px;padding:16px;align-items:center}
.avatar{width:100%;height:auto;display:block}
.av-btn{display:block;width:100%;border-radius:4px}
.av-btn:hover .avatar{filter:brightness(1.15)}
.avatar .av-grid{stroke:rgba(var(--neon-rgb),.05);stroke-width:.5;fill:none}
.avatar .av-body polygon,.avatar .av-body circle{fill:rgba(var(--neon-rgb),.05);stroke:rgba(var(--neon-rgb),.5);stroke-width:1.1;stroke-linejoin:round}
.avatar .av-body path{fill:none;stroke:rgba(var(--neon-rgb),.5);stroke-width:1.1}
.avatar .av-lines path,.avatar .av-lines circle{fill:none;stroke:rgba(var(--neon-rgb),.45);stroke-width:.9}
.avatar .av-trace{fill:none;stroke:var(--neon);stroke-width:1;opacity:.9}
.avatar .av-heart{fill:var(--legend);filter:drop-shadow(0 0 3px var(--legend))}
.avatar .av-halo{fill:none;stroke:var(--legend);stroke-width:1.2;opacity:.8}
.avatar .av-gear{color:var(--neon)}
.avatar .av-gear *{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.avatar .av-gear .fill{fill:currentColor}
.avatar .av-gear .fillsoft{fill:currentColor;fill-opacity:.22}
.avatar .rc{color:var(--common)}
.avatar .rr{color:var(--neon)}
.avatar .re{color:var(--neon);filter:drop-shadow(0 0 2.5px rgba(var(--neon-rgb),.9))}
.avatar .rl{color:var(--legend);filter:drop-shadow(0 0 3px rgba(var(--legend-rgb),.9))}
.avatar .hl{animation:hlPulse 1.1s ease-in-out infinite}
@keyframes hlPulse{50%{opacity:.3}}
.avatar .fr{fill:none;stroke:var(--neon);stroke-width:2}
.avatar .fr-dim{stroke:var(--dim)}
.avatar .fr-thin{stroke-width:.8;stroke:rgba(var(--neon-rgb),.45)}
.avatar .fr-thick{stroke-width:3}
.avatar .fr-run{stroke-width:1;stroke-dasharray:6 6;animation:frRun 4s linear infinite}
@keyframes frRun{to{stroke-dashoffset:-48}}
.avatar .fr-legend{stroke:var(--legend);filter:drop-shadow(0 0 4px rgba(var(--legend-rgb),.7))}
.avatar circle.fr-rivet{fill:var(--neon)}
.avatar circle.fr-rivet.fr-legend{fill:var(--legend)}
.avatar .fr-plate path{fill:var(--panel);stroke:var(--neon);stroke-width:1}
.avatar .fr-plate.fr-legend path{stroke:var(--legend)}
.avatar .fr-plate text{font-family:var(--f-display);font-size:7.5px;letter-spacing:.12em;fill:var(--neon);text-anchor:middle;font-weight:700}
.avatar .fr-plate.fr-legend text{fill:var(--legend)}
.avatar.tier-legende .fr-thick{animation:legendPulse 2.4s ease-in-out infinite}
@keyframes legendPulse{50%{filter:drop-shadow(0 0 9px rgba(var(--legend-rgb),.95))}}
.avatar .scan{animation:scan 3.6s linear infinite;opacity:.55}
@keyframes scan{from{transform:translateY(-22px)}to{transform:translateY(250px)}}
.op-info{min-width:0;display:flex;flex-direction:column;gap:6px}
.callsign{font-family:var(--f-display);font-size:19px;font-weight:700;letter-spacing:.06em;color:var(--text);overflow-wrap:anywhere;line-height:1.2}
.rank{font-family:var(--f-display);font-size:10px;letter-spacing:.24em;color:var(--neon)}
.lvl-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:2px}
.lvl{display:flex;align-items:baseline;gap:6px;font-family:var(--f-display)}
.lvl span{font-size:11px;letter-spacing:.2em;color:var(--muted)}
.lvl b{font-size:34px;font-weight:900;color:var(--neon);line-height:1;text-shadow:0 0 14px var(--neon-glow)}
.pp-badge{font-family:var(--f-display);font-size:9px;letter-spacing:.16em;color:var(--ink);background:var(--neon);padding:5px 8px;border-radius:3px;animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 14px var(--neon-glow)}}
.xpbar{height:10px;background:var(--panel-2);border:1px solid var(--line-hi);border-radius:2px;overflow:hidden;position:relative}
.xpbar i{position:absolute;inset:0 auto 0 0;background:var(--neon);box-shadow:0 0 12px var(--neon);display:block}
.xpbar i.proj{background:repeating-linear-gradient(45deg,rgba(var(--neon-rgb),.55) 0 4px,rgba(var(--neon-rgb),.25) 4px 8px);box-shadow:none}
.xpbar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 9%,rgba(var(--void-rgb),.55) 9% 10%)}
.xp-meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.xp-meta span:first-child{color:var(--text);font-family:var(--f-display);font-size:10px;letter-spacing:.08em}

.banner{margin-top:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid var(--neon);border-radius:4px;background:var(--neon-soft);width:100%;text-align:left}
.banner .d{font-size:11px;color:var(--neon);letter-spacing:.18em}
.banner p{font-size:13px;color:var(--text)}
.banner .go{font-family:var(--f-display);font-size:11px;color:var(--neon);letter-spacing:.14em;white-space:nowrap}

.tabs{display:grid;grid-template-columns:repeat(4,1fr);margin-top:18px;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--panel)}
.tab{font-family:var(--f-display);font-size:9.5px;letter-spacing:.12em;padding:12px 2px;color:var(--muted);border-right:1px solid var(--line);position:relative}
.tab:last-child{border-right:0}
.tab[aria-selected="true"]{color:var(--neon);background:var(--neon-soft)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--neon);box-shadow:0 0 8px var(--neon)}
.tab .pip{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--neon);margin-left:4px;vertical-align:middle;box-shadow:0 0 6px var(--neon)}

.stats{display:flex;flex-direction:column;gap:14px;padding:16px}
.stat-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.stat-name{font-family:var(--f-display);font-size:11px;letter-spacing:.14em;font-weight:700}
.stat-val{font-family:var(--f-display);font-size:16px;color:var(--neon);font-variant-numeric:tabular-nums;white-space:nowrap}
.stat-val em{font-style:normal;font-size:10px;color:var(--muted);margin-left:6px}
.stat-bar{height:6px;background:var(--panel-2);border-radius:1px;margin-top:6px;overflow:hidden;position:relative}
.stat-bar i{position:absolute;inset:0 auto 0 0;background:var(--neon);box-shadow:0 0 8px var(--neon);transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.stat-bar i.gear{background:rgba(var(--neon-rgb),.35);box-shadow:none}
.stat-sub{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);margin-top:5px;flex-wrap:wrap}

.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.cat{text-align:left;padding:14px;display:flex;flex-direction:column;gap:4px;min-height:96px;transition:border-color .2s,background .2s}
.cat:hover{border-color:var(--line-hi)}
.cat.sel{border-color:var(--neon);background:var(--neon-soft)}
.cat .code{font-family:var(--f-display);font-size:9px;letter-spacing:.2em;color:var(--muted)}
.cat .lab{font-family:var(--f-display);font-size:clamp(12px,3.5vw,14px);font-weight:700;letter-spacing:.06em;color:var(--text);overflow-wrap:anywhere;line-height:1.25}
.cat.sel .lab{color:var(--neon)}
.cat .meta{font-size:12px;color:var(--muted);margin-top:auto}

.slot-list{display:flex;flex-direction:column}
.slot-line{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);align-items:baseline}
.slot-line:last-child{border-bottom:0}
.slot-line .eyebrow{font-size:9px}
.slot-line b{font-weight:600;font-size:14px;color:var(--text)}
.slot-line .empty{color:var(--dim);font-family:var(--f-display);font-size:11px;letter-spacing:.14em}
.slot-line .fx{font-size:12px;color:var(--neon);display:block}
.chips-wrap{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--f-display);font-size:10px;letter-spacing:.12em;padding:7px 10px;border:1px solid var(--line-hi);border-radius:3px;color:var(--neon);background:var(--panel)}
.chip.active-type{border-color:var(--legend);color:var(--legend)}
.empty-note{padding:14px;color:var(--muted);font-size:13px;border:1px dashed var(--line);border-radius:4px}

/* ---------- arsenal ---------- */
.gear-slot{display:flex;flex-direction:column;gap:10px}
.gear{padding:14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 12px;align-items:start}
.gear.equipped{border-color:var(--neon);box-shadow:inset 0 0 0 1px rgba(var(--neon-rgb),.2)}
.gear.locked{opacity:.78}
.gear .nm{font-weight:600;font-size:15px;color:var(--text)}
.gear.locked .nm{color:var(--muted)}
.rar{font-family:var(--f-display);font-size:9px;letter-spacing:.2em;color:var(--muted)}
.rar.RARE{color:var(--neon)}
.rar.ÉPIQUE{color:var(--neon);text-shadow:0 0 8px var(--neon-glow)}
.rar.LÉGENDAIRE{color:var(--legend);text-shadow:0 0 8px rgba(var(--legend-rgb),.5)}
.gear .ds{font-size:13px;color:var(--muted);grid-column:1/-1}
.fx-list{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.fx-list span{font-size:12px;padding:3px 8px;border-radius:3px;background:var(--neon-soft);color:var(--neon);font-variant-numeric:tabular-nums}
.gear.locked .fx-list span{background:var(--panel-2);color:var(--muted)}
.lock{grid-column:1/-1;display:flex;flex-direction:column;gap:6px}
.lock .req{font-family:var(--f-display);font-size:10px;letter-spacing:.14em;color:var(--text)}
.mini-bar{height:4px;background:var(--panel-2);overflow:hidden;border-radius:1px}
.mini-bar i{display:block;height:100%;background:var(--muted)}
.tag-eq{font-family:var(--f-display);font-size:9px;letter-spacing:.18em;color:var(--ink);background:var(--neon);padding:4px 7px;border-radius:2px;white-space:nowrap}
.btn-sm{min-height:36px;padding:6px 12px;font-size:10px}

/* ---------- perks ---------- */
.pp-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;flex-wrap:wrap}
.pp-head b{font-family:var(--f-display);font-size:28px;color:var(--neon);text-shadow:0 0 12px var(--neon-glow)}
.branches{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.branch{display:flex;flex-direction:column;gap:0}
.branch-h{padding:0 2px 10px}
.branch-h .d{font-size:13px;font-weight:700;color:var(--neon)}
.branch-h p{font-size:12px;color:var(--muted)}
.node{text-align:left;padding:12px;display:flex;flex-direction:column;gap:6px;width:100%}
.node + .link{display:block;width:2px;height:14px;margin-left:22px;background:var(--dim)}
.link.lit{background:var(--neon);box-shadow:0 0 6px var(--neon)}
.node .nm{font-weight:600;font-size:14px}
.node .ds{font-size:12.5px;color:var(--muted)}
.node .st{font-family:var(--f-display);font-size:9px;letter-spacing:.18em;display:flex;justify-content:space-between;gap:6px;align-items:center}
.node.owned{border-color:var(--neon);background:var(--neon-soft)}
.node.owned .nm{color:var(--neon)}
.node.avail{border-color:var(--line-hi);animation:pulse 1.6s infinite}
.node.avail .st{color:var(--neon)}
.node.locked{opacity:.55}
.node.locked .st{color:var(--muted)}
.ptype{font-family:var(--f-display);font-size:8px;letter-spacing:.16em;padding:2px 5px;border:1px solid var(--muted);color:var(--muted);border-radius:2px}
.ptype.ACTIVE{border-color:var(--legend);color:var(--legend)}

/* ---------- archives ---------- */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{padding:14px;display:flex;flex-direction:column;gap:4px}
.kpi b{font-family:var(--f-display);font-size:20px;color:var(--neon);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi span{font-size:12px;color:var(--muted)}
.rows{display:flex;flex-direction:column}
.rows .r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:13.5px}
.rows .r:last-child{border-bottom:0}
.rows .r .s{color:var(--muted);font-size:12px}
.rows .r .v{font-family:var(--f-display);font-size:12px;color:var(--neon);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.settings{padding:16px;display:flex;flex-direction:column;gap:14px}
.field-line{display:flex;flex-direction:column;gap:6px}
.field-line label{font-family:var(--f-display);font-size:10px;letter-spacing:.18em;color:var(--muted)}
.txt{background:var(--panel-2);border:1px solid var(--line-hi);border-radius:4px;padding:11px 12px;color:var(--text);width:100%;font-size:15px}
.danger-zone{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px}

/* ---------- command bar ---------- */
.cmdbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--void);margin-left:calc(-1 * var(--gut-l));margin-right:calc(-1 * var(--gut-r));padding:10px var(--gut-r) 12px var(--gut-l);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.back{width:44px;height:44px;border:2px solid var(--neon);border-radius:4px;display:grid;place-items:center;color:var(--neon);flex:none;box-shadow:0 0 10px rgba(var(--neon-rgb),.2)}
.back:hover{background:var(--neon-soft)}
.title-neon{font-family:var(--f-display);font-weight:900;font-size:21px;letter-spacing:.14em;color:var(--neon);text-shadow:0 0 12px var(--neon-glow);flex:1;min-width:0}
.lo-counter{font-family:var(--f-display);font-size:11px;letter-spacing:.14em;color:var(--text);border:1px solid var(--line-hi);padding:7px 10px;border-radius:3px;white-space:nowrap;font-variant-numeric:tabular-nums}
.lo-counter b{color:var(--neon);font-size:14px;display:inline-block;min-width:1.2ch;text-align:center}
.lo-counter.bump b{animation:bump .3s}
@keyframes bump{40%{transform:scale(1.5);text-shadow:0 0 10px var(--neon)}}
.timer{font-family:var(--f-display);font-size:13px;color:var(--neon);font-variant-numeric:tabular-nums;letter-spacing:.08em}

.filters{display:flex;flex-wrap:wrap;gap:8px;padding-block:14px 4px}
.filt.pdc{border-style:dashed}
.filt.pdc.on{border-style:solid}
.tag-pdc{font-family:var(--f-display);font-size:8px;letter-spacing:.14em;color:var(--neon);border:1px solid var(--line-hi);border-radius:2px;padding:1px 4px;margin-right:6px;vertical-align:1px}
.filters::-webkit-scrollbar{display:none}
.filt{font-family:var(--f-display);font-size:10px;letter-spacing:.14em;padding:9px 12px;border:1px solid var(--line);border-radius:3px;color:var(--muted);white-space:nowrap;background:var(--panel)}
.filt.on{border-color:var(--neon);color:var(--neon);background:var(--neon-soft)}
.list-head{display:flex;justify-content:space-between;gap:10px;padding:14px 2px 8px;font-family:var(--f-display);font-size:10px;letter-spacing:.18em;color:var(--muted)}

.ex-list{display:flex;flex-direction:column;gap:8px}
.ex-row{display:flex;align-items:stretch;background:var(--panel);border:1px solid var(--line);border-radius:4px;transition:border-color .15s,background .15s}
.ex-row.is-on{border-color:var(--line-hi);background:var(--sel)}
.ex-name{flex:1;min-width:0;text-align:left;padding:12px 8px 12px 14px;display:flex;flex-direction:column;gap:3px}
.ex-name:hover .ex-title{color:var(--neon)}
.ex-title{font-weight:600;font-size:15px;color:var(--text);display:flex;align-items:center;gap:8px}
.ex-title .i{font-family:var(--f-display);font-size:9px;color:var(--muted);border:1px solid var(--dim);border-radius:50%;width:16px;height:16px;display:inline-grid;place-items:center;flex:none}
.ex-meta{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ex-meta .x{color:var(--neon);font-family:var(--f-display);font-size:10px}
.check-hit{width:60px;flex:none;display:grid;place-items:center;border-left:1px solid var(--line)}
.check{width:24px;height:24px;border:2px solid var(--neon);border-radius:4px;background:transparent;display:block;transition:background .12s,box-shadow .12s}
.check.on{background:var(--neon);box-shadow:0 0 12px rgba(var(--neon-rgb),.7)}

.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:35;background:linear-gradient(180deg,rgba(var(--void-rgb),0),var(--void) 26%);padding:22px var(--gut-r) calc(12px + env(safe-area-inset-bottom,0px)) var(--gut-l)}
.actionbar-in{max-width:568px;margin:0 auto;display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.actionbar-in:has(.fav-star:not([hidden])){grid-template-columns:1fr 52px 1.4fr}
.actionbar .btn{min-height:56px}
.badge-n{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:11px;background:var(--ink);color:var(--neon);font-size:11px;padding:0 6px}

.shake{animation:shake .45s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}
.flash{position:fixed;inset:0;background:var(--alert);opacity:0;pointer-events:none;z-index:150}
.flash.go{animation:flash .5s ease-out}
@keyframes flash{0%{opacity:.35}100%{opacity:0}}

/* ---------- sheet ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:60}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.72);opacity:0;transition:opacity .25s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:86vh;overflow-y:auto;background:var(--panel-2);border-top:2px solid var(--neon);border-radius:18px 18px 0 0;box-shadow:0 -10px 40px rgba(var(--neon-rgb),.18);transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.9,.25,1);padding:10px var(--gut-r) calc(20px + env(safe-area-inset-bottom,0px)) var(--gut-l)}
.sheet-in{max-width:568px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.sheet-wrap.open .sheet{transform:none}
.sheet-wrap.open .sheet-bg{opacity:1}
.grip{width:44px;height:4px;border-radius:2px;background:var(--dim);margin:0 auto 4px}
.sheet-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sheet h2{font-family:var(--f-display);font-size:19px;font-weight:700;letter-spacing:.04em;color:var(--neon);margin-top:4px}
.x-close{width:40px;height:40px;border:1px solid var(--line-hi);border-radius:4px;color:var(--neon);display:grid;place-items:center;flex:none}
.sec{display:flex;flex-direction:column;gap:8px}
.sec h3{font-family:var(--f-display);font-size:10px;letter-spacing:.22em;color:var(--muted);font-weight:500}
.sec p{font-size:14.5px;line-height:1.6;max-width:62ch}
.mtags{display:flex;flex-wrap:wrap;gap:6px}
.mtags span{font-size:12.5px;padding:4px 9px;border:1px solid var(--line-hi);border-radius:3px;color:var(--text)}
.ratio{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.ratio div{background:var(--panel);padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.ratio span{font-size:11px;color:var(--muted)}
.ratio b{font-family:var(--f-display);font-size:15px;color:var(--neon);font-variant-numeric:tabular-nums}
.formula{font-size:12px;color:var(--muted);font-family:ui-monospace,"SF Mono",Menlo,monospace}

/* ---------- briefing ---------- */
.mstrip{margin-top:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.mstrip-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mstrip-row div{display:flex;flex-direction:column;gap:2px}
.mstrip-row span{font-family:var(--f-display);font-size:9px;letter-spacing:.18em;color:var(--muted)}
.mstrip-row b{font-family:var(--f-display);font-size:17px;color:var(--neon);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.adren{width:100%;margin-top:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--legend);border-radius:4px;color:var(--legend);text-align:left}
.adren .d{font-size:11px;letter-spacing:.14em}
.adren p{font-size:12px;color:var(--muted)}
.adren.armed{background:rgba(var(--legend-rgb),.12);box-shadow:0 0 18px rgba(var(--legend-rgb),.3)}
.adren.used{border-color:var(--dim);color:var(--dim);pointer-events:none}
.ex-cards{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.ex-card{padding:14px;display:flex;flex-direction:column;gap:12px}
.ex-card header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ex-card h3{font-size:16.5px;font-weight:600;margin-top:3px}
.setc{font-family:var(--f-display);font-size:10px;letter-spacing:.14em;color:var(--neon);white-space:nowrap;border:1px solid var(--line-hi);padding:4px 7px;border-radius:3px}
.sets{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.set{display:grid;grid-template-columns:34px minmax(0,1fr) auto 44px;align-items:center;gap:8px;padding:6px 6px 6px 10px;border-bottom:1px solid var(--line);background:var(--panel-2);font-variant-numeric:tabular-nums}
.set:last-child{border-bottom:0}
.set .n{font-family:var(--f-display);font-size:10px;color:var(--muted)}
.set .w{font-size:14px;min-width:0}
.set .w small{display:block;font-size:10px;color:var(--neon);font-family:var(--f-display);letter-spacing:.1em}
.set .w small.leg{color:var(--legend)}
.set .xp{font-family:var(--f-display);font-size:12px;color:var(--neon);white-space:nowrap}
.del{height:32px;border-radius:3px;color:var(--muted);border:1px solid transparent;font-size:15px}
.del:hover{color:var(--alert);border-color:var(--alert-soft)}
.del.confirm{background:var(--alert);color:var(--ink);font-family:var(--f-display);font-size:8px;letter-spacing:.06em}
.entry{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.field label{display:block;font-family:var(--f-display);font-size:9px;letter-spacing:.18em;color:var(--muted);margin-bottom:5px}
.stepper{display:grid;grid-template-columns:40px minmax(0,1fr) 40px;border:1px solid var(--line-hi);border-radius:4px;overflow:hidden;background:var(--panel-2)}
.stepper button{color:var(--neon);font-size:20px;font-family:var(--f-display);height:46px}
.stepper button:hover{background:var(--neon-soft)}
.stepper input{width:100%;min-width:0;background:transparent;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);text-align:center;font-family:var(--f-display);font-size:17px;color:var(--text);font-variant-numeric:tabular-nums}
.stepper input:focus{outline:none;background:var(--neon-soft)}
.stepper.bad{border-color:var(--alert)}
.bw-note{font-size:11px;color:var(--muted);margin-top:4px}
.entry-go{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
.pv{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.pv b{font-family:var(--f-display);color:var(--neon);font-size:14px}
.empty-lo{margin-top:30px;padding:24px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}

.float-xp{position:fixed;z-index:120;font-family:var(--f-display);font-weight:900;font-size:22px;color:var(--neon);text-shadow:0 0 14px var(--neon);pointer-events:none;animation:floatUp 1.1s ease-out forwards}
@keyframes floatUp{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-70px)}}

/* ---------- rest ---------- */
.rest{position:fixed;inset:0;z-index:80;background:rgba(var(--void-rgb),.96);overflow-y:auto;padding:calc(20px + env(safe-area-inset-top,0px)) var(--gut-r) calc(20px + env(safe-area-inset-bottom,0px)) var(--gut-l)}
.rest-in{max-width:440px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;min-height:100%;justify-content:center}
.rest h2{font-family:var(--f-display);font-size:20px;letter-spacing:.2em;color:var(--neon)}
.gain{font-family:var(--f-display);font-weight:900;font-size:30px;color:var(--neon);text-shadow:0 0 18px var(--neon-glow);animation:pop .5s}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.12)}100%{transform:none;opacity:1}}
.gain-tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;min-height:22px}
.gain-tags span{font-family:var(--f-display);font-size:9px;letter-spacing:.14em;padding:4px 7px;border:1px solid var(--line-hi);color:var(--neon);border-radius:3px}
.gain-tags span.leg{border-color:var(--legend);color:var(--legend)}
.ring{position:relative;width:min(240px,64vw);aspect-ratio:1;max-width:100%}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6}
.ring .bg{stroke:var(--panel-2)}
.ring .ticks{stroke:var(--line);stroke-width:10;stroke-dasharray:1 8.6}
.ring .fg{stroke:var(--neon);stroke-linecap:round;filter:drop-shadow(0 0 6px var(--neon));transition:stroke-dashoffset .25s linear}
.ring.done .fg{stroke:var(--legend);filter:drop-shadow(0 0 8px var(--legend))}
.ring-txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.ring-txt b{font-family:var(--f-display);font-size:44px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
.ring.done .ring-txt b{color:var(--legend)}
.ring-txt span{font-family:var(--f-display);font-size:9px;letter-spacing:.22em;color:var(--muted)}
.rest-ctrl{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.rest-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%;padding:12px}
.rest-stats span{display:block;font-family:var(--f-display);font-size:8.5px;letter-spacing:.16em;color:var(--muted)}
.rest-stats b{font-family:var(--f-display);font-size:15px;color:var(--neon);font-variant-numeric:tabular-nums}
.rest-next{font-size:13px;color:var(--muted)}
.rest-next b{color:var(--text);font-weight:600}
.rest .btn-wide{width:100%}
.rest-note{font-size:11.5px;color:var(--muted)}

/* ---------- report ---------- */
.rp-hero{text-align:center;padding:26px 16px 20px;display:flex;flex-direction:column;gap:8px;align-items:center}
.rp-hero h1{font-family:var(--f-display);font-weight:900;font-size:clamp(22px,6vw,30px);letter-spacing:.12em;color:var(--neon);text-shadow:0 0 18px var(--neon-glow)}
.rp-hero p{color:var(--muted);font-size:13px}
.rp-kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.rp-lvl{padding:16px;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.rp-lvl-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.levelup{font-family:var(--f-display);font-weight:900;font-size:13px;letter-spacing:.2em;color:var(--ink);background:var(--neon);padding:6px 10px;border-radius:3px;opacity:0;transform:scale(.6);transition:opacity .3s,transform .3s}
.levelup.show{opacity:1;transform:none;box-shadow:0 0 22px var(--neon-glow)}
.xpbar.big{height:14px}
.xpbar.big i{transition:width .9s cubic-bezier(.2,.8,.2,1)}
.loot{padding:14px;display:flex;flex-direction:column;gap:8px;border-color:var(--neon);animation:pop .6s backwards}
.loot .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.loot .nm{font-weight:600;font-size:15.5px}
.lvl-flash{position:fixed;inset:0;z-index:130;display:grid;place-items:center;pointer-events:none;background:radial-gradient(circle,rgba(var(--neon-rgb),.25),rgba(0,0,0,0) 65%)}
.lvl-flash div{font-family:var(--f-display);font-weight:900;font-size:clamp(34px,11vw,64px);letter-spacing:.12em;color:var(--neon);text-shadow:0 0 30px var(--neon),0 0 60px var(--neon-glow);text-align:center;line-height:1.1;animation:lvlIn 1.2s ease-out forwards}
.lvl-flash small{display:block;font-size:.32em;letter-spacing:.3em;color:var(--text)}
@keyframes lvlIn{0%{opacity:0;transform:scale(2.2)}20%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:scale(.95)}}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:140;background:var(--panel-2);border:1px solid var(--neon);color:var(--text);padding:11px 16px;border-radius:4px;font-size:13px;max-width:calc(100% - 32px);box-shadow:0 0 20px rgba(var(--neon-rgb),.25);text-align:center}
.toast.warn{border-color:var(--alert)}

/* ---------- sync, nom, astuces ---------- */
.sync{display:inline-flex;align-items:center;gap:7px;font-family:var(--f-display);font-size:9.5px;letter-spacing:.16em;padding:7px 9px;border:1px solid var(--line);border-radius:3px;color:var(--muted);white-space:nowrap;background:var(--panel)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:block}
.sync.cloud{color:var(--neon);border-color:var(--line-hi)}
.sync.cloud i{background:var(--neon);box-shadow:0 0 8px var(--neon)}
.sync.saving,.sync.connecting{color:var(--text)}
.sync.saving i,.sync.connecting i{background:var(--neon);animation:blink .8s infinite}
.sync.error{color:var(--alert);border-color:var(--alert-soft)}
.sync.error i{background:var(--alert)}
.sync.offline{color:var(--legend);border-color:rgba(var(--legend-rgb),.3)}
.sync.offline i{background:var(--legend)}
.btn-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.code-box{width:100%;min-height:120px;font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:11px;line-height:1.4;background:var(--panel);color:var(--text);border:1px solid var(--line-hi);border-radius:4px;padding:10px;word-break:break-all;resize:vertical}
.code-box:focus{outline:2px solid var(--neon);outline-offset:1px}

/* ---------- favoris, contrats, suggestions, disques, courbes, prises ---------- */
.fav-list{display:flex;flex-direction:column;gap:8px}
.fav{display:flex;align-items:center;gap:12px;padding:12px 14px}
.fav-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.fav-info b{font-family:var(--f-display);font-size:13px;letter-spacing:.06em;color:var(--neon)}
.fav-info small{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fav-act{display:flex;align-items:center;gap:6px;flex:none}
.fav-act .del{width:44px}
.fav-save{width:100%;margin-top:10px;padding:11px 12px;border:1px dashed var(--line-hi);border-radius:4px;font-family:var(--f-display);font-size:10px;letter-spacing:.14em;color:var(--neon);background:var(--panel)}
.fav-save:hover{border-style:solid;background:var(--neon-soft)}
.streak{display:flex;align-items:center;gap:14px;padding:12px 14px}
.streak-n{display:flex;flex-direction:column;align-items:center;min-width:56px}
.streak-n b{font-family:var(--f-display);font-size:28px;font-weight:900;color:var(--muted);line-height:1}
.streak-n span{font-family:var(--f-display);font-size:8px;letter-spacing:.16em;color:var(--muted)}
.streak.hot .streak-n b{color:var(--legend);text-shadow:0 0 12px rgba(var(--legend-rgb),.6)}
.streak-t{display:flex;flex-direction:column;gap:3px;min-width:0}
.streak-t b{font-size:14px;font-weight:600}
.streak.hot .streak-t b{color:var(--legend)}
.streak-t small{font-size:12px;color:var(--muted);line-height:1.45}
.contracts{padding:14px;display:flex;flex-direction:column;gap:14px}
.ct{display:flex;flex-direction:column;gap:6px}
.ct-top,.ct-bot,.sqc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.ct-name{font-size:14px;font-weight:500}
.ct.done .ct-name{color:var(--neon)}
.ct-xp{font-family:var(--f-display);font-size:10px;letter-spacing:.12em;color:var(--legend)}
.ct-bar{height:6px}
.ct-bar i{background:var(--neon);box-shadow:0 0 6px var(--neon)}
.ct-bot{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.ct-ok{font-family:var(--f-display);font-size:9px;letter-spacing:.14em;color:var(--neon)}
.sq-challenge{margin-top:14px;padding:14px;display:flex;flex-direction:column;gap:8px;border-color:var(--line-hi)}
.sq-challenge.done{border-color:var(--neon);box-shadow:inset 0 0 0 1px rgba(var(--neon-rgb),.25)}
.sqc-name{font-family:var(--f-display);font-size:15px;font-weight:700;letter-spacing:.08em;color:var(--neon)}
.sqc-contrib{display:flex;flex-wrap:wrap;gap:6px}
.sqc-contrib span{font-size:11.5px;padding:3px 8px;border:1px solid var(--line);border-radius:3px;color:var(--muted);font-variant-numeric:tabular-nums}
.sqc-contrib span.me{border-color:var(--line-hi);color:var(--text)}
.sugg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:var(--panel-2)}
.sugg > div{display:flex;flex-direction:column;gap:2px;min-width:0;font-size:13px}
.sugg .eyebrow{font-size:8.5px}
.sugg b{color:var(--neon);font-weight:600;font-size:14px}
.sugg small{font-size:11px;color:var(--muted)}
@media (max-width:420px){.sugg{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.sugg .btn{grid-column:1/-1}}
.plates{grid-column:1/-1;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pl-svg{height:30px;width:auto;max-width:140px;flex:none}
.pl-svg .pl-bar{stroke:var(--muted);stroke-width:3}
.pl-svg .pl-col{stroke:var(--muted);stroke-width:3}
.pl-svg rect{fill:var(--neon-soft);stroke:var(--neon);stroke-width:1.2}
.pl-txt{font-size:12px;color:var(--muted)}
.pl-txt b{color:var(--neon);font-weight:600}
.pchart{width:100%;height:auto;display:block}
.pchart .pc-grid{stroke:var(--line);stroke-width:1}
.pchart .pc-tick{font-family:var(--f-body);font-size:9px;fill:var(--muted);text-anchor:end}
.pchart .pc-area{fill:rgba(var(--neon-rgb),.08)}
.pchart .pc-line{fill:none;stroke:var(--neon);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.pchart .pc-dot{fill:var(--panel-2);stroke:var(--neon);stroke-width:2}
.pchart .pc-dot.last{fill:var(--neon)}
.pchart .pc-hit{fill:transparent}
.pchart g:hover .pc-dot{fill:var(--neon)}
.pc-sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pc-sum div{display:flex;flex-direction:column;gap:2px;min-width:0}
.pc-sum span{font-family:var(--f-display);font-size:8.5px;letter-spacing:.14em;color:var(--muted)}
.pc-sum b{font-family:var(--f-display);font-size:12.5px;color:var(--text);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.pc-sum b.up{color:var(--neon)}
.pc-sum b.down{color:var(--alert)}
.grip-svg{display:block;width:100%;height:auto}
.grip-svg .gr-guide{stroke:var(--dim);stroke-dasharray:3 4;stroke-width:1}
.grip-svg .gr-lab{font-family:var(--f-display);font-size:7.5px;letter-spacing:.12em;fill:var(--muted)}
.grip-svg .gr-body{fill:rgba(var(--neon-rgb),.05);stroke:rgba(var(--neon-rgb),.5);stroke-width:1.4;stroke-linejoin:round}
.grip-svg path.gr-body{fill:none}
.grip-svg path.gr-body[d$="Z"]{fill:rgba(var(--neon-rgb),.05)}
.grip-svg .gr-arm{stroke:rgba(var(--neon-rgb),.6);stroke-width:2.2;stroke-linecap:round}
.grip-svg .gr-hand{fill:rgba(var(--neon-rgb),.25);stroke:var(--neon);stroke-width:2;filter:drop-shadow(0 0 3px rgba(var(--neon-rgb),.7))}
.grip-svg path.gr-hand{fill:none;stroke-width:1.5}
.grip-svg .gr-arrow{fill:none;stroke:var(--legend);stroke-width:1.4;stroke-linecap:round}
.grip-svg .gr-bar{stroke:var(--equip);stroke-width:4;stroke-linecap:round}
.grip-svg .gr-mark{font-family:var(--f-display);font-size:8px;font-weight:700;fill:var(--ink);text-anchor:middle}
.debrief{padding:14px;display:flex;flex-direction:column;gap:14px}
.chips-pick{display:flex;gap:6px;flex-wrap:wrap}
.pick{min-width:42px;height:38px;padding:0 10px;border:1px solid var(--line-hi);border-radius:4px;font-family:var(--f-display);font-size:12px;color:var(--muted);background:var(--panel-2)}
.pick.wide{font-size:9.5px;letter-spacing:.1em}
.pick.on{background:var(--neon);color:var(--ink);border-color:var(--neon)}
textarea.txt{resize:vertical;min-height:58px;font-family:var(--f-body)}
.note-line{font-size:12px;color:var(--neon);margin-top:3px;opacity:.85}
.seg.seg-mini{display:inline-grid;grid-template-columns:1fr 1fr}
.seg.seg-mini button{padding:8px 10px;font-size:9px}
.avatar .badge path:first-child,.avatar .badge polygon{fill:var(--panel);stroke:var(--legend);stroke-width:1.3}
.avatar .badge .bi{fill:none;stroke:var(--legend);stroke-width:1.4}
.avatar .badge text{font-family:var(--f-display);font-size:9px;font-weight:900;fill:var(--legend);text-anchor:middle}
.avatar .badge.bw polygon{stroke:var(--neon)}
.avatar .badge.bw text{fill:var(--neon)}

/* ---------- fiches arsenal / châssis ---------- */
.gear-preview{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px;border:1px solid var(--line-hi);border-radius:4px;background:var(--deep)}
.gear-preview .avatar{width:min(240px,70vw)}
.gear-preview.locked .avatar{filter:saturate(.6)}
.gear-name{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;text-align:left;font-weight:600;font-size:15px;color:var(--text)}
.gear-name:hover{color:var(--neon)}
.gear-name .more{font-family:var(--f-display);font-size:8.5px;letter-spacing:.16em;color:var(--neon)}
.gear-actions{display:flex;align-items:center;gap:12px}
.cmp{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.cmp-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:10px;align-items:baseline;padding:9px 12px;border-bottom:1px solid var(--line);font-size:13.5px;font-variant-numeric:tabular-nums}
.cmp-row:last-child{border-bottom:0}
.cmp-row b{font-family:var(--f-display);font-size:12px;color:var(--neon);text-align:right}
.cmp-row b.up::after{content:" ▲";font-size:9px}
.cmp-row b.down{color:var(--alert)}
.cmp-row b.down::after{content:" ▼";font-size:9px}
.cmp-old{color:var(--muted);font-family:var(--f-display);font-size:11px}
.cmp-arrow{color:var(--dim)}
.ms{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.ms-row{display:grid;grid-template-columns:56px minmax(0,1fr);gap:10px;font-size:13px;color:var(--muted);align-items:baseline}
.ms-row b{font-family:var(--f-display);font-size:10px;letter-spacing:.1em;color:var(--dim)}
.ms-row.done{color:var(--text)}
.ms-row.done b{color:var(--neon)}
.slot-btn{width:100%;text-align:left}
.slot-btn:hover{background:var(--panel-2)}
.rar.COMMUN{color:var(--common)}

/* ---------- matériel disponible ---------- */
.eq-bar{margin-top:10px;display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px dashed var(--line-hi);border-radius:4px;background:var(--panel)}
.eq-bar.on{border-style:solid;border-color:var(--neon);background:var(--neon-soft)}
.eq-toggle{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left}
.sw{width:38px;height:22px;border:2px solid var(--neon);border-radius:12px;position:relative;flex:none}
.sw i{position:absolute;top:3px;left:3px;width:12px;height:12px;border-radius:50%;background:var(--muted);transition:transform .15s,background .15s}
.eq-bar.on .sw i{transform:translateX(16px);background:var(--neon);box-shadow:0 0 8px var(--neon)}
.eq-lab{display:flex;flex-direction:column;min-width:0;gap:2px}
.eq-lab b{font-family:var(--f-display);font-size:10px;letter-spacing:.14em;color:var(--text);font-weight:700}
.eq-bar.on .eq-lab b{color:var(--neon)}
.eq-lab small{font-size:12px;color:var(--muted)}
.eq-sum{display:flex;align-items:baseline;gap:10px}
.eq-sum b{font-family:var(--f-display);font-size:26px;color:var(--neon);font-variant-numeric:tabular-nums}
.eq-sum span{color:var(--muted);font-size:13px}
.eq-list{display:flex;flex-direction:column}
.eq-item{border-bottom:1px solid var(--line)}
.eq-item:last-child{border-bottom:0}
.eq-row{display:flex;align-items:center;gap:14px;padding:12px 14px;width:100%;text-align:left}
.eq-row .check{flex:none}
.eq-name{display:flex;flex-direction:column;gap:2px;font-size:15px;color:var(--text);font-weight:500;min-width:0}
.eq-name small{font-size:12px;color:var(--muted);font-weight:400}
.eq-item.on .eq-name{color:var(--neon)}
.eq-max{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:0 14px 12px 52px;font-size:13px;color:var(--muted)}
.eq-max input{width:72px;background:var(--panel-2);border:1px solid var(--line-hi);border-radius:4px;padding:7px 8px;color:var(--text);font-family:var(--f-display);font-size:14px;text-align:center}
.mtags .miss{border-color:var(--alert);color:var(--alert)}
.eq-hq{display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap;padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:var(--panel);text-align:left;width:100%}
.eq-hq:hover{border-color:var(--line-hi)}
.eq-hq span{font-family:var(--f-display);font-size:9.5px;letter-spacing:.16em;color:var(--muted)}
.eq-hq b{font-weight:500;font-size:13.5px;color:var(--text);flex:1;min-width:0}
.eq-hq em{font-style:normal;font-family:var(--f-display);font-size:10px;letter-spacing:.14em;color:var(--neon)}

/* ---------- schéma du mouvement ---------- */
.illus-wrap{border:1px solid var(--line-hi);border-radius:4px;background:var(--deep);overflow:hidden}
.illus{display:block;width:100%;height:auto;max-width:100%}
.illus .ig{stroke:rgba(var(--neon-rgb),.06);stroke-width:.5;fill:none}
.illus .ifloor{stroke:var(--dim);stroke-width:1.5}
.illus .ighost path,.illus .ighost circle{fill:none;stroke:rgba(var(--muted-rgb),.6);stroke-width:1.5;stroke-dasharray:3 3}
.illus .ifig{filter:drop-shadow(0 0 3px rgba(var(--neon-rgb),.7))}
.illus .ifig path,.illus .ifig circle{fill:none;stroke:var(--neon);stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.illus .ifig circle{fill:var(--deep)}
.illus .ifig .idim{opacity:.38}
.illus .ip{fill:none;stroke:var(--prop);stroke-width:1.5}
.illus .ip-heavy{fill:none;stroke:var(--equip);stroke-width:2.4;stroke-linecap:round}
.illus .ip-cable{stroke-dasharray:2 3}
.illus-cap{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 10px;border-top:1px solid var(--line);font-family:var(--f-display);font-size:8.5px;letter-spacing:.14em;color:var(--muted)}
.illus-cap [data-phase]{color:var(--neon)}
.illus-alt{margin-top:8px}
.illus .ip-mat{stroke-dasharray:4 3;opacity:.7}
.illus .ip-band{fill:none;stroke:var(--alert);stroke-width:2;stroke-linecap:round}
.ex-link{display:flex;align-items:center;gap:8px;text-align:left;font-size:16.5px;font-weight:600;margin-top:3px;color:var(--text)}
.ex-link:hover{color:var(--neon)}
.ex-link .i{font-family:var(--f-display);font-size:9px;color:var(--muted);border:1px solid var(--dim);border-radius:50%;width:16px;height:16px;display:inline-grid;place-items:center;flex:none}
.tip .btn{flex:none}
.cmdbar .title-neon{flex:1 1 auto;min-width:max-content}

/* ---------- escouades (version autonome) ---------- */
.sq-banner{background:var(--panel);border-color:var(--line-hi)}
.sq-intro{margin-top:16px;display:flex;flex-direction:column;gap:10px}
.sq-panel{padding:16px;display:flex;flex-direction:column;gap:14px;margin-top:16px}
.sq-head{padding:16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px 16px;align-items:center;margin-top:16px}
.sq-actions{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.sq-actions .btn{flex:1 1 140px}
.row-inline{display:flex;gap:8px}
.row-inline .txt{flex:1;min-width:0}
.sq-row .who em.chief{background:transparent;color:var(--legend);border:1px solid var(--legend)}
.sq-name{font-family:var(--f-display);font-size:18px;font-weight:700;letter-spacing:.06em;color:var(--neon);overflow-wrap:anywhere;margin-top:4px}
.sq-code{text-align:right}
.sq-code b{display:block;font-family:var(--f-display);font-size:20px;letter-spacing:.12em;color:var(--text);font-variant-numeric:tabular-nums}
.seg.seg4{grid-template-columns:repeat(4,minmax(0,1fr));margin-top:14px}
.seg.seg4 button{font-size:8.5px;letter-spacing:.08em;padding:12px 2px}
.board{display:flex;flex-direction:column;margin-top:10px;overflow:hidden}
.sq-row{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.sq-row:last-child{border-bottom:0}
button.sq-row:hover{background:var(--panel-2)}
.sq-row.me{background:var(--neon-soft)}
.sq-row .pos{font-family:var(--f-display);font-weight:900;font-size:15px;color:var(--muted);text-align:center}
.sq-row .pos.p1{color:var(--ink);background:var(--neon);border-radius:3px;padding:4px 0;box-shadow:0 0 12px var(--neon-glow)}
.sq-row .pos.p2,.sq-row .pos.p3{color:var(--neon)}
.sq-row .who{min-width:0;display:flex;flex-direction:column;gap:2px}
.sq-row .who b{font-weight:600;font-size:15px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sq-row .who em{font-style:normal;font-family:var(--f-display);font-size:8px;letter-spacing:.16em;color:var(--ink);background:var(--neon);padding:2px 5px;border-radius:2px;margin-left:8px;vertical-align:middle}
.sq-row .who small{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sq-row .val{font-family:var(--f-display);font-size:13px;color:var(--neon);white-space:nowrap;font-variant-numeric:tabular-nums}

/* ---------- connexion (version autonome) ---------- */
.auth{position:fixed;inset:0;z-index:95;background:var(--void);overflow-y:auto;padding:calc(28px + env(safe-area-inset-top,0px)) var(--gut-r) calc(24px + env(safe-area-inset-bottom,0px)) var(--gut-l)}
.auth-in{max-width:420px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.auth-in > div#auth-body{display:flex;flex-direction:column;gap:18px}
.auth-head{display:flex;flex-direction:column;gap:10px}
.auth-title{font-family:var(--f-display);font-weight:900;font-size:clamp(22px,7vw,28px);letter-spacing:.1em;color:var(--neon);text-shadow:0 0 16px var(--neon-glow)}
.auth .lead{font-size:15px;line-height:1.55;color:var(--text)}
.auth form{display:flex;flex-direction:column;gap:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--panel)}
.seg button{font-family:var(--f-display);font-size:10px;letter-spacing:.14em;padding:13px 4px;color:var(--muted)}
.seg button.on{color:var(--neon);background:var(--neon-soft);box-shadow:inset 0 -2px 0 var(--neon)}
.auth-err{min-height:1.3em;font-size:13px;color:var(--alert);line-height:1.45}
.auth-err.ok{color:var(--neon)}
.link-btn{color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:3px;align-self:center;padding:8px}
.link-btn:hover{color:var(--neon)}
.or{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:9px;letter-spacing:.2em;color:var(--dim)}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.auth-wait{display:flex;gap:10px;align-items:center;justify-content:center;font-family:var(--f-display);font-size:11px;letter-spacing:.2em;color:var(--neon);padding:48px 0}
.callsign-btn{display:flex;align-items:center;gap:8px;text-align:left;min-width:0;max-width:100%}
.callsign-btn svg{flex:none;color:var(--muted)}
.callsign-btn:hover svg{color:var(--neon)}
.tip{margin-top:12px;display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 12px;border:1px dashed var(--line-hi);border-radius:4px;font-size:13px;line-height:1.45;color:var(--text);background:var(--panel)}
.tip b{color:var(--neon);font-weight:600}
.empty-note b{color:var(--neon);font-weight:600}
.sync-sheet p{font-size:14.5px;line-height:1.6;max-width:62ch}

/* ---------- guide d'accueil ---------- */
.ob{position:fixed;inset:0;z-index:90;background:var(--void);overflow-y:auto;padding:calc(20px + env(safe-area-inset-top,0px)) var(--gut-r) calc(24px + env(safe-area-inset-bottom,0px)) var(--gut-l)}
.ob-in{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:26px}
.ob-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.ob-dots{display:flex;gap:6px}
.ob-dots i{width:24px;height:3px;background:var(--dim);display:block}
.ob-dots i.on{background:var(--neon);box-shadow:0 0 6px var(--neon)}
.ob-step{display:flex;flex-direction:column;gap:18px;animation:obIn .35s ease-out}
@keyframes obIn{from{opacity:.2;transform:translateX(14px)}to{opacity:1;transform:none}}
.ob h2{font-family:var(--f-display);font-weight:900;font-size:clamp(22px,7vw,30px);letter-spacing:.08em;color:var(--neon);text-shadow:0 0 16px var(--neon-glow);line-height:1.15}
.ob .lead{font-size:16px;line-height:1.6;max-width:42ch}
.ob-rows{display:flex;flex-direction:column;gap:10px}
.ob-row{display:grid;grid-template-columns:48px minmax(0,1fr);gap:12px;padding:14px;align-items:start}
.ob-row .k{font-family:var(--f-display);font-weight:900;font-size:15px;color:var(--neon);letter-spacing:.04em;padding-top:1px}
.ob-row b{display:block;font-weight:600;font-size:15px;color:var(--text)}
.ob-row span{font-size:13px;color:var(--muted);line-height:1.5}
.ob-actions{margin-top:auto;display:grid;grid-template-columns:56px minmax(0,1fr);gap:10px}
.ob-actions.solo{grid-template-columns:minmax(0,1fr)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
@media (max-width:380px){
  .op-card{grid-template-columns:100px minmax(0,1fr);gap:12px;padding:12px}
  .lvl b{font-size:28px}
  .title-neon{font-size:18px}
  .slot-line{grid-template-columns:96px minmax(0,1fr)}
}

/* ---------- thème clair (réglage : Archives → Paramètres → Thème) ---------- */

  --void:#EFF2EC;
  --panel:#FFFFFF;
  --panel-2:#F3F6F1;
  --line:#B4C2AE;

  --neon-rgb:10,102,0;
  --line-hi:rgba(10,102,0,.5);
  --neon-soft:rgba(10,102,0,.08);
  --neon-glow:rgba(10,102,0,.18);
  --alert:#B01D13;
  --alert-rgb:176,29,19;
  --alert-soft:rgba(176,29,19,.1);
  --legend:#7A4800;
  --legend-rgb:122,72,0;
  --text:#050A04;
  --muted:#1F291C;
  --muted-rgb:31,41,28;

  --line-hi:rgba(10,102,0,.5);
  --neon-soft:rgba(10,102,0,.08);
  --neon-glow:rgba(10,102,0,.18);
  --alert:#B01D13;
  --alert-rgb:176,29,19;
  --alert-soft:rgba(176,29,19,.1);
  --legend:#7A4800;
  --legend-rgb:122,72,0;
  --text:#050A04;
  --muted:#1F291C;
  --muted-rgb:31,41,28;
  --dim:#5D6A58;
  --ink:#FFFFFF;
  --void-rgb:239,242,236;
  --deep:#F7F9F5;
  --sel:#E2EEDB;
  --common:#2F6324;
  --equip:#3B5E2F;
  --prop:#7F9278;
  --scan:rgba(0,0,0,.016);

  }
}
:root[data-nf-theme="light"] .brand b,:root[data-nf-theme="light"] .lvl b,:root[data-nf-theme="light"] .rar.ÉPIQUE,:root[data-nf-theme="light"] .rar.LÉGENDAIRE,:root[data-nf-theme="light"] .pp-head b,:root[data-nf-theme="light"] .title-neon,:root[data-nf-theme="light"] .gain,:root[data-nf-theme="light"] .rp-hero h1,:root[data-nf-theme="light"] .auth-title,:root[data-nf-theme="light"] .ob h2,:root[data-nf-theme="light"] .streak.hot .streak-n b,:root[data-nf-theme="light"] .float-xp{text-shadow:none}
@media (prefers-color-scheme: light){ :root[data-nf-theme="auto"] .brand b,:root[data-nf-theme="auto"] .lvl b,:root[data-nf-theme="auto"] .rar.ÉPIQUE,:root[data-nf-theme="auto"] .rar.LÉGENDAIRE,:root[data-nf-theme="auto"] .pp-head b,:root[data-nf-theme="auto"] .title-neon,:root[data-nf-theme="auto"] .gain,:root[data-nf-theme="auto"] .rp-hero h1,:root[data-nf-theme="auto"] .auth-title,:root[data-nf-theme="auto"] .ob h2,:root[data-nf-theme="auto"] .streak.hot .streak-n b,:root[data-nf-theme="auto"] .float-xp{text-shadow:none} }
.theme-picks .pick{flex:1 1 0}

/* ---------- audio ---------- */
.top-r{display:flex;align-items:center;gap:8px}
.aud-btn{width:34px;height:31px;flex:none;display:grid;place-items:center;border:1px solid var(--line);border-radius:3px;color:var(--muted);background:var(--panel)}
.aud-btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.aud-btn .w{display:none}.aud-btn.s1 .w1,.aud-btn.s2 .w1,.aud-btn.s2 .w2{display:inline}
.aud-btn.s0 .x{display:inline}.aud-btn .x{display:none}
.aud-btn.s1,.aud-btn.s2{color:var(--neon);border-color:var(--line-hi)}
.aud-btn[aria-expanded="true"]{background:var(--neon-soft);border-color:var(--neon)}
.aud-pop{position:fixed;z-index:90;width:min(272px,calc(100vw - 24px));background:var(--panel);border:1px solid var(--line-hi);border-radius:4px;padding:6px 12px 10px;box-shadow:0 10px 30px rgba(0,0,0,.45);animation:popIn .14s ease-out}
@keyframes popIn{from{opacity:0;transform:translateY(-4px)}}
.aud-row{display:flex;align-items:center;gap:10px;width:100%;padding:9px 0 6px;text-align:left}
.aud-row + .aud-vol + .aud-row,.aud-row + .aud-row{border-top:1px solid var(--line)}
.aud-row .eq-lab{flex:1}
.aud-row .eq-lab small{font-size:11px;color:var(--muted)}
.aud-row .sw{width:34px;height:20px}
.aud-row .sw i{width:10px;height:10px}
.aud-row.on .sw i{transform:translateX(14px);background:var(--neon);box-shadow:0 0 8px var(--neon)}
.aud-row.on .eq-lab b{color:var(--neon)}
.aud-vol{display:flex;align-items:center;gap:8px;padding:0 0 6px}
.aud-vol span{font-family:var(--f-display);font-size:8px;letter-spacing:.16em;color:var(--muted)}
.aud-vol input{flex:1;min-width:0;height:34px;margin:0;background:transparent;touch-action:none;-webkit-appearance:none;appearance:none;cursor:pointer;--p:50%}
.aud-vol input::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--neon) var(--p),var(--line) var(--p))}
.aud-vol input::-moz-range-track{height:4px;border-radius:2px;background:var(--line)}
.aud-vol input::-moz-range-progress{height:4px;border-radius:2px;background:var(--neon)}
.aud-vol input::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:22px;margin-top:-9px;border-radius:50%;background:var(--neon);border:3px solid var(--panel);box-shadow:0 0 0 1px var(--neon),0 0 10px var(--neon-glow)}
.aud-vol input::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--neon);border:3px solid var(--panel);box-shadow:0 0 0 1px var(--neon)}
.cmd-r{display:flex;align-items:center;gap:10px;margin-left:auto}

/* ---------- entrée EXERCICES & écran des systèmes ---------- */
.ex-entry{margin-top:10px;width:100%;display:flex;align-items:center;gap:14px;padding:14px;border:1px solid var(--neon);border-radius:4px;background:var(--neon-soft);text-align:left;box-shadow:0 0 16px rgba(var(--neon-rgb),.12)}
.ex-entry:hover{box-shadow:0 0 22px var(--neon-glow)}
.ex-ic{width:38px;height:38px;flex:none;display:grid;place-items:center;border-radius:4px;background:var(--neon);color:var(--ink)}
.ex-ic svg{width:24px;height:24px}.ex-ic svg .f{fill:currentColor}
.ex-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ex-txt b{font-family:var(--f-display);font-size:15px;font-weight:900;letter-spacing:.14em;color:var(--neon)}
.ex-txt small{font-size:12.5px;color:var(--muted)}
.ex-entry .go{font-family:var(--f-display);font-size:10.5px;letter-spacing:.14em;color:var(--neon);white-space:nowrap}
.cat .when{font-family:var(--f-display);font-size:9.5px;letter-spacing:.06em;color:var(--neon);text-transform:uppercase}
.cat .when.never{color:var(--dim)}
.cat .code em{font-style:normal;color:var(--neon)}
.cat-grid + .btn{margin-top:2px;width:100%}
