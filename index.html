  ${st.mission ? `<button class="banner" data-act="go" data-to="briefing"><div><div class="d">MISSION EN COURS · ${hms(Date.now() - st.mission.start)}</div><p>${plural(mSets, "série").toLowerCase()} validée${mSets > 1 ? "s" : ""}, ${state.loadoutSession.length} exercice${state.loadoutSession.length > 1 ? "s" : ""} au loadout</p></div><span class="go">REPRENDRE →</span></button>` : ""}
  ${STANDALONE && fb.user ? `<button class="banner sq-banner" data-act="go" data-to="squad"><div><div class="d">ESCOUADES</div><p>${st.squads.length ? `${st.squads.length} escouade${st.squads.length > 1 ? "s" : ""} · classement de la semaine` : "Comparez vos progressions avec vos amis"}</p></div><span class="go">OUVRIR →</span></button>` : ""}
  <nav class="tabs" role="tablist">
    ${tabs.map(([id, l]) => `<button class="tab" role="tab" aria-selected="${ui.tab === id}" data-act="tab" data-tab="${id}">${l}${id === "aptitudes" && st.perkPoints > 0 && availPerks ? '<span class="pip" aria-label="points disponibles"></span>' : ""}</button>`).join("")}
  </nav>
  <button class="ex-entry" data-act="go" data-to="systems"><span class="ex-ic" aria-hidden="true"><svg viewBox="0 0 24 24"><path class="f" d="M1.5 10h2v4h-2zM4.5 6.5h3.5v11H4.5zM16 6.5h3.5v11H16zM20.5 10h2v4h-2zM8 11h8v2H8z"/></svg></span><span class="ex-txt"><b>EXERCICES</b><small>${CATS.length} systèmes musculaires · ${EXERCISES.length} exercices</small></span><span class="go">OUVRIR →</span></button>
  <div>${ui.tab === "arsenal" ? tabArsenal(b) : ui.tab === "aptitudes" ? tabPerks() : ui.tab === "archives" ? tabArchives() : tabFiche(b)}</div>`;
}

function tabFiche(b) {
  const st = state, rookie = st.missions === 0;
  const scale = Math.max(40, ...STAT_KEYS.map(k => statTotal(k, b))) * 1.15;
  const attrs = `
  <section class="block">
    <h2 class="h2">ATTRIBUTS DU CHÂSSIS</h2>
    <div class="panel stats">
      ${STAT_KEYS.map(k => {
        const base = st.stats[k], bonus = b.stat[k], xpb = Math.round(b.xp.global + b.xp[k]);
        return `<div class="stat">
          <div class="stat-head"><span class="stat-name">${STATS[k].label}</span><span class="stat-val">${fmt1(base + bonus)}${bonus ? `<em>dont +${bonus} cyberware</em>` : ""}</span></div>
          <div class="stat-bar"><i class="gear" style="width:${(base + bonus) / scale * 100}%"></i><i style="width:${base / scale * 100}%"></i></div>
          <div class="stat-sub"><span>${STATS[k].groups}</span><span>${xpb ? `XP +${xpb} %` : "XP de base"}</span></div>
        </div>`;
      }).join("")}
    </div>
    ${rookie ? `<p class="hint">Chaque série renforce l'attribut du groupe musculaire travaillé.</p>` : ""}
  </section>`;
  if (rookie) return `<section class="block"><div class="empty-note">Pour votre première mission, touchez <b>EXERCICES</b> juste au-dessus, choisissez un système musculaire puis cochez vos exercices.</div></section>` + contractsBlock() + attrs + `
  <section class="block"><div class="empty-note">Le cyberware et les aptitudes se débloquent en jouant. Consultez les onglets <b>Arsenal</b> et <b>Aptitudes</b> quand vous voulez.</div></section>`;
  return contractsBlock() + attrs + `
  <section class="block">
    <h2 class="h2">CYBERWARE ÉQUIPÉ</h2>
    <div class="panel slot-list">
      ${SLOT_KEYS.map(s => { const g = GEAR_BY_ID[st.gear.equipped[s]];
        return `<button class="slot-line slot-btn" ${g ? `data-act="gear-sheet" data-id="${g.id}"` : `data-act="tab" data-tab="arsenal"`}><span class="eyebrow">${SLOTS[s]}</span><div>${g ? `<b>${esc(g.name)}</b><span class="fx">${fxLines(g.fx).join(" · ")}</span>` : `<span class="empty">EMPLACEMENT LIBRE</span>`}</div></button>`; }).join("")}
    </div>
  </section>
  <section class="block">
    <h2 class="h2">APTITUDES ACTIVES</h2>
    ${st.perks.length ? `<div class="chips-wrap">${st.perks.map(id => { const p = PERK_BY_ID[id]; return `<span class="chip ${p.type === "ACTIVE" ? "active-type" : ""}">${esc(p.name)}</span>`; }).join("")}</div>`
      : `<div class="empty-note">Aucune aptitude installée. ${st.perkPoints ? `Vous avez ${st.perkPoints} point à dépenser dans l'onglet Aptitudes.` : "Montez de niveau pour gagner des points."}</div>`}
  </section>`;
}

function tabArsenal() {
  const st = state;
  return SLOT_KEYS.map(s => `
  <section class="block gear-slot">
    <h2 class="h2">${SLOTS[s]}</h2>
    ${GEAR.filter(g => g.slot === s).map(g => {
      const unlocked = st.gear.unlocked.includes(g.id), eq = st.gear.equipped[s] === g.id;
      let side = "";
      if (eq) side = `<span class="tag-eq">ÉQUIPÉ</span>`;
      else if (unlocked) side = `<button class="btn btn-neon btn-sm" data-act="equip" data-id="${g.id}">ÉQUIPER</button>`;
      let lock = "";
      if (!unlocked) {
        const [cur, tgt] = condProgress(g.cond, st);
        lock = `<div class="lock"><span class="req">VERROUILLÉ · ${condText(g.cond)}</span><div class="mini-bar"><i style="width:${Math.min(100, cur / tgt * 100)}%"></i></div><span class="hint">${fmt(cur)} / ${fmt(tgt)}</span></div>`;
      }
      return `<article class="panel gear ${eq ? "equipped" : ""} ${unlocked ? "" : "locked"}">
        <div><div class="rar ${g.rarity}">${g.rarity}</div><button class="nm gear-name" data-act="gear-sheet" data-id="${g.id}">${esc(g.name)}<span class="more">FICHE ›</span></button></div>
        <div>${side}</div>
        <p class="ds">${esc(g.desc)}</p>
        <div class="fx-list">${fxLines(g.fx).map(l => `<span>${l}</span>`).join("")}</div>
        ${lock}
        ${eq ? `<div style="grid-column:1/-1"><button class="btn btn-quiet btn-sm" data-act="unequip" data-slot="${s}">RETIRER</button></div>` : ""}
      </article>`;
    }).join("")}
  </section>`).join("");
}

function perkState(p) {
  if (state.perks.includes(p.id)) return "owned";
  if (state.level >= p.lvl && (!p.req || state.perks.includes(p.req)) && state.perkPoints > 0) return "avail";
  return "locked";
}
function tabPerks() {
  const st = state;
  return `
  <section class="block">
    <div class="panel pp-head">
      <div><div class="eyebrow">POINTS D'APTITUDE</div><b class="num">${st.perkPoints}</b></div>
      <p class="hint" style="max-width:34ch">Un point gagné à chaque niveau. Chaque branche se débloque dans l'ordre.</p>
    </div>
  </section>
  <section class="block">
    <div class="branches">
      ${Object.entries(BRANCHES).map(([bid, br]) => {
        const nodes = PERKS.filter(p => p.branch === bid).sort((a, z) => a.tier - z.tier);
        return `<div class="branch"><div class="branch-h"><div class="d">${br.label}</div><p>${br.sub}</p></div>
          ${nodes.map((p, i) => {
            const s = perkState(p);
            let status;
            if (s === "owned") status = "INSTALLÉE";
            else if (s === "avail") status = "TOUCHER POUR INSTALLER";
            else if (st.level < p.lvl) status = `NIVEAU ${p.lvl} REQUIS`;
            else if (p.req && !st.perks.includes(p.req)) status = `REQUIERT ${PERK_BY_ID[p.req].name.toUpperCase()}`;
            else status = "AUCUN POINT DISPONIBLE";
            const link = i < nodes.length - 1 ? `<span class="link ${s === "owned" ? "lit" : ""}" aria-hidden="true"></span>` : "";
            return `<button class="panel node ${s}" ${s === "avail" ? `data-act="perk" data-id="${p.id}"` : "aria-disabled=\"true\""}>
              <span class="st"><span>T${p.tier} · NIV ${p.lvl}</span><span class="ptype ${p.type}">${p.type}</span></span>
              <span class="nm">${esc(p.name)}</span><span class="ds">${esc(p.desc)}</span>
              <span class="st">${status}</span></button>${link}`;
          }).join("")}</div>`;
      }).join("")}
    </div>
  </section>`;
}

function tabArchives() {

      <div class="panel kpi"><b>${fmt(st.totalXp)}</b><span>XP totale</span></div>

      ${canUndo() ? `<div class="danger-zone"><button class="btn btn-quiet hold" data-hold="undo-mission" data-ms="1500"><span class="stack">ANNULER LA DERNIÈRE MISSION<small>APPUI LONG 1,5 S · POSSIBLE ENCORE ${Math.max(1, Math.ceil((state.undo.at + DAY - Date.now()) / 3600000))} H</small></span></button></div>` : ""}`
      : `<div class="empty-note">Aucune mission archivée. Votre premier rapport apparaîtra ici.</div>`}
  </section>

/* =====================================================================
   Schémas de mouvement : squelette filaire animé (départ ↔ contraction)
   Vue de profil, l'opérateur regarde vers la droite. viewBox 240 × 160, sol à y = 152.
   Angles en degrés : 0 = vers le bas, 90 = vers la droite, 180 = vers le haut, -90 = vers la gauche.

const ILL = { T: 36, NECK: 13, HR: 7, UA: 21, FA: 20, TH: 26, SH: 26, FT: 8, FLOOR: 152, W: 240, H: 160 };

  ang(p.arm, "sh", "elb", "hand", L.UA, L.FA); ang(p.arm2, "sh", "elb2", "hand2", L.UA, L.FA);

      J[kL1] = ilAdd(J[rootL], -spec.a, l1); J[kL2] = ilAdd(J[kL1], -spec.f, l2);

      const tR = [base[0] + spec.ik[0], base[1] + spec.ik[1]];
      const tL = spec.same ? tR : [2 * J.sh[0] - tR[0], tR[1]];
      [J[kR1], J[kR2]] = ilIK(J[rootR], tR, l1, l2, spec.bend || -1);
      [J[kL1], J[kL2]] = ilIK(J[rootL], tL, l1, l2, -(spec.bend || -1));
    }

  limb(p.leg, "rhip", "lhip", L.TH, L.SH, "rknee", "rank", "lknee", "lank");

  const draw = (t) => {
    const f = illusFrame(spec, ease(t));
    mainEl.setAttribute("d", f.main); dimEl.setAttribute("d", f.dim); propsEl.innerHTML = f.props;
    const h = f.J.head; headEl.setAttribute("cx", r1(h[0])); headEl.setAttribute("cy", r1(h[1]));
  };
  if (reduced()) { draw(1); if (phaseEl) phaseEl.textContent = spec.iso ? "MAINTIEN" : "POSITION FINALE · DÉPART EN POINTILLÉS"; return; }
  const period = spec.iso ? 3200 : spec.neg ? 5600 : 2600, t0 = performance.now();
  let lastLabel = "";
  const loop = (now) => {
    if (!svg.isConnected) { stopIllus(); return; }
    const ph = ((now - t0) % period) / period;
    const t = spec.neg ? (ph < 0.12 ? ph / 0.12 : ph < 0.22 ? 1 : Math.max(0, 1 - (ph - 0.22) / 0.72)) : ph < 0.5 ? ph * 2 : 2 - ph * 2;
    draw(t);
    const label = spec.iso ? "MAINTIEN · RESPIRATION CONTRÔLÉE"
      : spec.neg ? (ph < 0.12 ? "MONTÉE SANS TIRER · SAUT OU MARCHE" : ph < 0.22 ? "MENTON AU-DESSUS · ON VERROUILLE" : ph < 0.94 ? "DESCENTE LENTE · 3 À 5 SECONDES" : "BRAS TENDUS · ON REMONTE")
      : ph < 0.5 ? "PHASE CONCENTRIQUE · POUSSER / TIRER" : "PHASE EXCENTRIQUE · RETOUR CONTRÔLÉ";
    if (phaseEl && label !== lastLabel) { phaseEl.textContent = label; lastLabel = label; }
    illusRAF = requestAnimationFrame(loop);
  };
  illusRAF = requestAnimationFrame(loop);
}

function toB64(str) {
  const bytes = new TextEncoder().encode(str); let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function fromB64(b64) {
  const bin = atob(b64), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
const exportCode = () => "NFP1." + toB64(JSON.stringify(state));
function parseImport(code) {
  code = String(code || "").replace(/\s+/g, "");
  if (!code.startsWith("NFP1.")) throw new Error("prefix");
  const obj = JSON.parse(fromB64(code.slice(5)));
  if (!isObj(obj) || !isObj(obj.operator)) throw new Error("shape");
  return sanitize(obj);
}

function setAuthBusy(on) {

async function doAuth() {
  if (authBusy || !fb.auth) return;
  const em = $("#au-email"), pw = $("#au-pass"), err = $("#auth-err");
  const email = em ? em.value.trim() : "", pass = pw ? pw.value : "";

function setContext(id, score) {

}
function deleteSet(id, i) {

/* ---- Repos tactique ---- */
let restTick = null, wakeLock = null, restDoneFired = false;
const RING_C = 2 * Math.PI * 82;
function openRest() {
  const m = state.mission; if (!m || !m.rest) return;
  const r = m.rest, e = EX[r.exId];
  const el = $("#rest");
  $("#rest-gain").textContent = `+${fmt(r.xp)} XP`;

  const b = computeBonuses(state);

  restDoneFired = Date.now() >= r.endAt; restLastSec = null;
  musicRest(!restDoneFired);
  el.hidden = false;
  document.body.style.overflow = "hidden";
  tickRest();
  clearInterval(restTick); restTick = setInterval(tickRest, 250);
  try { if (navigator.wakeLock && !wakeLock) navigator.wakeLock.request("screen").then(w => { wakeLock = w; }).catch(() => {}); } catch (e2) {}
  setTimeout(() => $("#rest-btn").focus({ preventScroll: true }), 50);
}
let restLastSec = null;
function tickRest() {
  const m = state.mission;
  if (!m || !m.rest) { closeRest(); return; }
  const r = m.rest, left = (r.endAt - Date.now()) / 1000;
  const ring = $("#ring"), fg = $("#ring-fg");
  fg.setAttribute("stroke-dasharray", RING_C.toFixed(2));
  if (left > 0) {
    ring.classList.remove("done");
    $("#rest-time").textContent = mmss(Math.ceil(left));
    const sec = Math.ceil(left);
    if (sec !== restLastSec) { if (restLastSec !== null) { if (sec <= 3) sfx("count", sec); else sfx("sec", sec % 2); } restLastSec = sec; }
    $("#rest-state").textContent = "RÉCUPÉRATION";
    fg.setAttribute("stroke-dashoffset", (RING_C * (1 - Math.min(1, left / r.total))).toFixed(2));
    $("#rest-btn").textContent = "PASSER LE REPOS";
  } else {
    ring.classList.add("done");
    $("#rest-time").textContent = "+" + mmss(-left);
    $("#rest-state").textContent = "SYSTÈMES PRÊTS";
    fg.setAttribute("stroke-dashoffset", "0");
    $("#rest-btn").textContent = "REPRENDRE LE COMBAT";
    if (!restDoneFired) { restDoneFired = true; vibrate([200, 100, 200]); sfx("restDone"); musicRest(false); }
  }
}
function closeRest() {
  clearInterval(restTick); restTick = null; musicRest(false);
  $("#rest").hidden = true;

}

  if (state.mission) { state.mission.rest = null; save(); }
  closeRest();
}

/* =====================================================================
   Écran 4 — Rapport de mission
   ===================================================================== */
function finishMission() {
  const st = state, m = st.mission;
  if (!m) return;
  const t = missionTotals();
  if (!t.sets) { toast("Validez au moins une série avant de terminer.", true); return; }
  const b = computeBonuses(st);
  const undoSnap = progressSnapshot();
  const streakBefore = streakInfo();
  const gains = { power: 0, armor: 0, propulsion: 0, core: 0 };
  const xpStat = { power: 0, armor: 0, propulsion: 0, core: 0 };
  const perEx = [], records = [];
  let push = 0, coreSec = 0;
  const now = Date.now();
  for (const id in m.sets) {
    const e = EX[id]; if (!e) continue;
    let exXp = 0, exTon = 0, best = null;
    m.sets[id].forEach(s => {
      exXp += s.xp; if (e.type !== "time") exTon += s.load * s.reps;
      for (const k in e.stats) { gains[k] += s.xp * e.stats[k] / 60; xpStat[k] += s.xp * e.stats[k]; }
      if (PUSH_IDS(id)) push += s.reps;
      if (e.type === "time" && e.cat === "abdos") coreSec += s.reps;
      if (!best || s.score > best.score) best = s;
    });
    perEx.push({ id, sets: m.sets[id].length, xp: exXp, ton: exTon });
    if (best) {
      const log = st.exLog[id] || (st.exLog[id] = []);
      log.push({ d: now, kg: best.kg, reps: best.reps, score: best.score, e1: e1rm(e, best), sets: m.sets[id].length, vol: Math.round(exTon) });
      if (log.length > 40) log.splice(0, log.length - 40);
    }
    const old = st.records[id];
    if (best && (!old || best.score > old.score)) {
      st.records[id] = { score: best.score, kg: best.kg, reps: best.reps, date: Date.now() };
      if (old) records.push({ id, kg: best.kg, reps: best.reps, prev: old });
    }
  }
  // la série compte si cette mission est la 2e de la semaine ou si la série est déjà sécurisée
  const streakNow = streakBefore.secured ? streakBefore.weeks : (streakBefore.thisWeek + 1 >= 2 ? streakBefore.weeks + 1 : streakBefore.weeks);
  const sBonus = streakBonus(streakNow);
  const bonusPct = 10 + b.missionBonus + sBonus;
  const bonusXp = Math.round(t.xp * bonusPct / 100);
  const totalXp = t.xp + bonusXp;
  const oldLevel = st.level, oldXp = st.xp, oldStats = { ...st.stats };
  const oldPct = oldXp / xpNeeded(oldLevel) * 100;
  st.xp += totalXp; st.totalXp += totalXp;
  let levels = 0;
  while (st.xp >= xpNeeded(st.level)) { st.xp -= xpNeeded(st.level); st.level++; st.perkPoints++; levels++; }
  STAT_KEYS.forEach(k => { gains[k] = Math.round(gains[k] * 10) / 10; st.stats[k] = Math.round((st.stats[k] + gains[k]) * 10) / 10; });
  st.missions++; st.tonnage += t.ton;
  const newGear = checkUnlocks(st);
  const newPerks = PERKS.filter(p => p.lvl > oldLevel && p.lvl <= st.level).map(p => p.id);
  const dur = Date.now() - m.start;
  const catCount = {};
  perEx.forEach(p => { const c = EX[p.id].cat; catCount[c] = (catCount[c] || 0) + p.sets; });
  const focus = Object.keys(catCount).sort((a, z) => catCount[z] - catCount[a]).slice(0, 2).map(c => CAT_BY_ID[c].label.toLowerCase()).join(" + ");
  STAT_KEYS.forEach(k => { xpStat[k] = Math.round(xpStat[k]); });
  st.history.unshift({ date: now, xp: totalXp, ton: Math.round(t.ton), sets: t.sets, exCount: perEx.length, dur, level: st.level, focus: focus.charAt(0).toUpperCase() + focus.slice(1),
    recs: records.length, push, coreSec, xpStat, cats: Object.keys(catCount) });
  st.undo = { at: now, snap: undoSnap };
  st.history = st.history.slice(0, 60);
  st.mission = null;
  st.loadoutSession = [];
  ui.report = { t, bonusXp, bonusPct, totalXp, oldLevel, newLevel: st.level, oldPct, newPct: st.xp / xpNeeded(st.level) * 100, levels,
                oldStats, newStats: { ...st.stats }, gains, newGear, newPerks, records, perEx, dur, missionNo: st.missions,
                streak: streakNow, sBonus, note: { energy: 0, rpe: 0, text: "" }, noteSaved: false };
  save();
  closeRest();
  ui.screen = "report";
  render();
  window.scrollTo(0, 0);
}

let reportAnimToken = 0;
function animateReport() {
  const r = ui.report; if (!r || r.animated) return;
  r.animated = true;
  const token = ++reportAnimToken;
  const bars = document.querySelectorAll(".stat-bar i[data-to]");
  const bar = $("#rp-xpfill"), lvlEl = $("#rp-level"), lu = $("#rp-levelup");
  if (reduced()) {
    bars.forEach(i => { i.style.width = i.dataset.to + "%"; });
    if (bar) bar.style.width = r.newPct + "%";
    if (lvlEl) lvlEl.textContent = r.newLevel;
    return;
  }
  setTimeout(() => bars.forEach(i => { i.style.width = i.dataset.to + "%"; }), 350);
  let level = r.oldLevel, steps = r.levels;
  const next = () => {
    if (token !== reportAnimToken || !bar) return;
    if (steps > 0) {
      bar.style.transition = ""; bar.style.width = "100%";
      setTimeout(() => {
        if (token !== reportAnimToken) return;
        level++; steps--;
        lvlEl.textContent = level;
        lu.classList.add("show");
        levelFlash(level);
        bar.style.transition = "none"; bar.style.width = "0%"; void bar.offsetWidth;
        setTimeout(next, 700);
      }, 950);
    } else {
      bar.style.transition = ""; bar.style.width = r.newPct + "%";
    }
  };
  setTimeout(next, 500);
}
function levelFlash(level) {
  vibrate([60, 40, 120]); sfx("levelup");
  const f = document.createElement("div");
  f.className = "lvl-flash"; f.setAttribute("aria-hidden", "true");
  f.innerHTML = `<div>LEVEL UP<small>NIVEAU ${level} · ${rankFor(level)}</small></div>`;
  document.body.appendChild(f);
  setTimeout(() => f.remove(), 1300);
}

    if (ui.screen === "catalog") html = renderCatalog();

const SND_OWN = new Set(["toggle-ex", "validate-set", "step", "close-sheet", "finish-mission", "aud-toggle"]);
const SND_NAV = new Set(["go", "tab", "validate-loadout", "report-done", "squad-select", "pick-cat"]);
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (el) {
    if (el.closest("[aria-disabled='true']")) return;
    const act = el.dataset.act, fn = actions[act];
    if (fn) {
      e.preventDefault();
      const own = SND_OWN.has(act);
      if (!own) sfx(SND_NAV.has(act) ? "nav" : "tap");
      fn(el, e);
      if (act === "toggle-ex") sfx(state.loadoutSession.includes(el.dataset.id) ? "on" : "off");
      else if (act === "step") sfx("step", +el.dataset.d > 0);
      else if (act === "finish-mission" && ui.screen === "report") sfx("complete");
    }
    return;
  }
  const h = e.target.closest("[data-hold]");
  if (h && Date.now() - lastHoldFire > 400) toast(`Maintenez le bouton appuyé (${(+(h.dataset.ms || 600) / 1000).toLocaleString("fr-FR")} s) pour confirmer.`, true);
  if (ui.delArm && !e.target.closest(".del")) { ui.delArm = null; if (ui.screen === "briefing") render(); }
  if (ui.favDel && !e.target.closest(".del")) { ui.favDel = null; if (ui.screen === "hq" || ui.screen === "systems") render(); }
});

/* ---- appui long ---- */
let hold = null, lastHoldFire = 0;
function startHold(el) {
  cancelHold();
  const ms = +el.dataset.ms || 600;
  el.style.setProperty("--hold-ms", ms + "ms");
  void el.offsetWidth;
  el.classList.add("arming");
  vibrate(10); holdTone(ms);
  hold = { el, timer: setTimeout(() => {
    el.classList.remove("arming"); holdToneStop(); sfx("off");
    const act = el.dataset.hold; hold = null; lastHoldFire = Date.now();
    if (holdActions[act]) holdActions[act](el);
  }, ms) };
}
function cancelHold() { if (!hold) return; holdToneStop(); clearTimeout(hold.timer); hold.el.classList.remove("arming"); hold = null; }
document.addEventListener("pointerdown", e => {
  const el = e.target.closest("[data-hold]");
  if (!el || el.disabled || (e.button !== undefined && e.button > 0)) return;
  startHold(el);
});
["pointerup", "pointercancel"].forEach(t => document.addEventListener(t, cancelHold));
document.addEventListener("pointerout", e => { if (hold && e.target === hold.el && !hold.el.contains(e.relatedTarget)) cancelHold(); });
document.addEventListener("contextmenu", e => { if (e.target.closest("[data-hold]")) e.preventDefault(); });
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { if ($("#aud-pop")) { audClose(); return; } if (!$("#sheet").hidden) closeSheet(); return; }
  const el = e.target.closest && e.target.closest("[data-hold]");
  if (el && (e.key === " " || e.key === "Enter")) { e.preventDefault(); if (!e.repeat) startHold(el); }
  if (e.key === "Enter" && e.target.matches("[data-field]")) { e.preventDefault(); validateSet(e.target.dataset.id, e.target); }
  if (e.key === "Enter" && e.target.id === "name-input") { e.preventDefault(); actions["save-name"](); }
  if (e.key === "Enter" && e.target.id === "ob-name") { e.preventDefault(); obNext(); }
  if (e.key === "Enter" && e.target.id === "sq-name") { e.preventDefault(); squadCreate(); }
  if (e.key === "Enter" && e.target.id === "fav-name") { e.preventDefault(); saveFavorite(); }
  if (e.key === "Enter" && e.target.id === "sq-code") { e.preventDefault(); squadJoin(); }
});
document.addEventListener("keyup", e => { if (e.key === " " || e.key === "Enter") { if (e.target.closest && e.target.closest("[data-hold]")) e.preventDefault(); cancelHold(); } });

/* ---- saisies ---- */
function onDraftInput(id) {
  const { kg, reps } = readDraftInputs(id);
  const pl = document.getElementById("pl-" + id); if (pl) pl.innerHTML = plateHTML(kg);
  storeDraft(id, kg, reps);
  const pv = document.getElementById("pv-" + id);
  if (pv) pv.textContent = previewXp(id, kg, reps);
}
document.addEventListener("input", e => {
  const t = e.target;
  if (t.matches("[data-field]")) { t.parentElement.classList.remove("bad"); onDraftInput(t.dataset.id); }
  if (t.dataset && t.dataset.eqbar) { const v = parseNum(t.value); if (Number.isFinite(v) && v >= 5 && v <= 30) { curPlace().barKg = Math.round(v * 10) / 10; save(); } }
  if (t.dataset && t.dataset.eqmax) {
    const v = parseNum(t.value), pl = curPlace();
    const val = Number.isFinite(v) && v > 0 ? Math.min(t.dataset.eqmax === "db" ? 200 : 500, Math.round(v * 10) / 10) : 0;
    if (t.dataset.eqmax === "db") pl.maxDb = val; else pl.maxBb = val;
    save();
  }
  if (t.id === "snd-sfxvol" || t.id === "snd-musvol") {
    t.style.setProperty("--p", t.value + "%");
    setSnd(t.id === "snd-sfxvol" ? { sfxVol: (+t.value || 0) / 100 } : { musicVol: (+t.value || 0) / 100 });
  }
  if (t.id === "sq-name") squad.draftName = t.value;
  if (t.id === "sq-code") squad.draftCode = t.value;
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "snd-sfxvol") { sfx("confirm"); return; }
  if (t.id === "set-callsign") {
    if (commitName(t.value)) { toast("Nom de code mis à jour."); render(); } else t.value = state.operator.callsign;
  } else if (t.id === "set-bw") {
    const v = parseNum(t.value);
    if (!Number.isFinite(v) || v < 30 || v > 250) { toast("Poids de corps : entre 30 et 250 kg.", true); t.value = fmt1(state.operator.bodyweight); return; }
    state.operator.bodyweight = Math.round(v * 10) / 10; save(); toast("Poids de corps enregistré.");
  }
});
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { if (sync.ref && sync.mode === "saving") pushNow(); return; }
  if (!$("#rest").hidden) tickRest();
});
window.addEventListener("pagehide", () => { if (sync.ref && sync.mode === "saving") pushNow(); });
window.addEventListener("error", () => toast("Anomalie système détectée. Rechargez la page si l'affichage est bloqué.", true));

/* ---- démarrage ---- */
window.addEventListener("offline", () => { if (sync.ref) setSyncMode("offline"); });
window.addEventListener("online", () => {
  if (!sync.ref) return;
  setSyncMode(sync.writing ? "saving" : "cloud");
  if (sync.pending || sync.fails) { sync.fails = 0; pushNow(); }
});
if (STANDALONE) {
  bootFirebase();
} else {
  bootPristine = isPristine();
  render();
  const obFallback = setTimeout(maybeOnboard, 3500);
  initSync().finally(() => { clearTimeout(obFallback); maybeOnboard(); });
}
</script>
</body>
</html>
