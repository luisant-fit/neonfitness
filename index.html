<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="NeonFitness Pro : musculation gamifiée façon RPG cyberpunk.">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NeonFitness">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
html{-webkit-text-size-adjust:100%;color-scheme:dark}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>NeonFitness Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Orbitron:wght@500;700;900&display=swap">
<style>
/* Layout: single-column tactical ship terminal (max 600px), sticky command bars, fixed action footers, bottom-sheet analysis terminal */
:root{
  --void:#000000;
  --panel:#0D0D0D;
  --panel-2:#141414;
  --line:#1C2819;
  --line-hi:rgba(57,255,20,.34);
  --neon:#39FF14;
  --neon-soft:rgba(57,255,20,.12);
  --neon-glow:rgba(57,255,20,.55);
  --alert:#FF3B30;
  --alert-soft:rgba(255,59,48,.14);
  --legend:#FFC53D;
  --text:#DCE8D6;
  --muted:#80907B;
  --dim:#3E4B3B;
  --ink:#000000;
  --f-display:"Orbitron","Eurostile","Arial Black",system-ui,sans-serif;
  --f-body:"Inter","Roboto",system-ui,-apple-system,"Segoe UI",sans-serif;
  --gut-l:max(16px, env(safe-area-inset-left, 0px));
  --gut-r:max(16px, env(safe-area-inset-right, 0px));
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--void);color:var(--text)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent;min-height:100%;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--void)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:200;background:repeating-linear-gradient(0deg,rgba(255,255,255,.022) 0 1px,transparent 1px 3px)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--neon);outline-offset:2px}
input{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}

.app{max-width:600px;margin:0 auto;padding-left:var(--gut-l);padding-right:var(--gut-r);padding-block:12px 32px;min-height:100vh}
.app.has-footer{padding-bottom:calc(112px + env(safe-area-inset-bottom,0px))}

/* ---------- type ---------- */
.d{font-family:var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.eyebrow{font-family:var(--f-display);font-size:10px;letter-spacing:.22em;color:var(--muted);text-transform:uppercase}
.h2{font-family:var(--f-display);font-size:12px;font-weight:700;letter-spacing:.2em;color:var(--neon);text-transform:uppercase;display:flex;align-items:center;gap:10px}
.h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line-hi),transparent)}
.hint{color:var(--muted);font-size:13px}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}

/* ---------- panels ---------- */
.panel{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:4px}
.panel.bracket::before,.panel.bracket::after{content:"";position:absolute;width:12px;height:12px;border:2px solid var(--neon);pointer-events:none}
.panel.bracket::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
.panel.bracket::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
.block{display:flex;flex-direction:column;gap:12px;margin-top:26px}

/* ---------- buttons ---------- */
.btn{font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;min-height:48px;padding:10px 16px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;gap:8px;position:relative;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:transform .08s,box-shadow .2s,filter .2s}
.btn:active{transform:scale(.98)}
.btn-neon{background:var(--neon);color:var(--ink);box-shadow:0 0 18px rgba(57,255,20,.35)}
.btn-neon:hover{box-shadow:0 0 26px var(--neon-glow)}
.btn-alert{background:var(--alert);color:var(--ink)}
.btn-ghost{border:1px solid var(--neon);color:var(--neon);background:transparent}
.btn-ghost:hover{background:var(--neon-soft)}
.btn-quiet{border:1px solid var(--line);color:var(--muted);background:var(--panel-2)}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn small{display:block;font-size:8px;letter-spacing:.18em;opacity:.75;font-weight:500}
.btn .stack{display:flex;flex-direction:column;align-items:center;line-height:1.15;gap:2px}
.hold{touch-action:manipulation}
.hold::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.38);transform:scaleX(0);transform-origin:left;pointer-events:none}
.hold.arming::after{transform:scaleX(1);transition:transform var(--hold-ms,600ms) linear}
.hold.btn-ghost::after,.hold.btn-quiet::after{background:var(--alert-soft)}

/* ---------- top bar / HQ ---------- */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:6px 14px}
.brand{font-family:var(--f-display);font-weight:900;font-size:15px;letter-spacing:.12em;display:flex;align-items:center;gap:10px;color:var(--text)}
.brand b{color:var(--neon);margin-left:6px;text-shadow:0 0 10px var(--neon-glow)}
.brand-mark{width:14px;height:14px;border:2px solid var(--neon);transform:rotate(45deg);box-shadow:0 0 8px var(--neon-glow)}
.sys{font-family:var(--f-display);font-size:10px;letter-spacing:.18em;color:var(--muted);display:flex;align-items:center;gap:8px;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--neon);box-shadow:0 0 8px var(--neon);animation:blink 2.4s infinite}
@keyframes blink{0%,70%,100%{opacity:1}80%{opacity:.25}}

.op-card{display:grid;grid-template-columns:112px minmax(0,1fr);gap:16px;padding:16px;align-items:center}
.avatar{width:100%;height:auto;display:block}
.avatar .grid{stroke:rgba(57,255,20,.06);stroke-width:.5}
.avatar .part{fill:none;stroke:var(--dim);stroke-width:2;stroke-dasharray:3 3;stroke-linejoin:round;stroke-linecap:round}
.avatar .part.on{stroke:var(--neon);stroke-dasharray:none;fill:rgba(57,255,20,.07);filter:drop-shadow(0 0 3px rgba(57,255,20,.8))}
.avatar .scan{fill:url(#scanGrad);animation:scan 3.6s linear infinite}
@keyframes scan{from{transform:translateY(-20px)}to{transform:translateY(190px)}}
.op-info{min-width:0;display:flex;flex-direction:column;gap:6px}
.callsign{font-family:var(--f-display);font-size:19px;font-weight:700;letter-spacing:.06em;color:var(--text);overflow-wrap:anywhere;line-height:1.2}
.rank{font-family:var(--f-display);font-size:10px;letter-spacing:.24em;color:var(--neon)}
.lvl-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:2px}
.lvl{display:flex;align-items:baseline;gap:6px;font-family:var(--f-display)}
.lvl span{font-size:11px;letter-spacing:.2em;color:var(--muted)}
.lvl b{font-size:34px;font-weight:900;color:var(--neon);line-height:1;text-shadow:0 0 14px var(--neon-glow)}
.pp-badge{font-family:var(--f-display);font-size:9px;letter-spacing:.16em;color:var(--ink);background:var(--neon);padding:5px 8px;border-radius:3px;animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 14px var(--neon-glow)}}
.xpbar{height:10px;background:var(--panel-2);border:1px solid var(--line-hi);border-radius:2px;overflow:hidden;position:relative}
.xpbar i{position:absolute;inset:0 auto 0 0;background:var(--neon);box-shadow:0 0 12px var(--neon);display:block}
.xpbar i.proj{background:repeating-linear-gradient(45deg,rgba(57,255,20,.55) 0 4px,rgba(57,255,20,.25) 4px 8px);box-shadow:none}
.xpbar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 9%,rgba(0,0,0,.55) 9% 10%)}
.xp-meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.xp-meta span:first-child{color:var(--text);font-family:var(--f-display);font-size:10px;letter-spacing:.08em}

.banner{margin-top:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid var(--neon);border-radius:4px;background:var(--neon-soft);width:100%;text-align:left}
.banner .d{font-size:11px;color:var(--neon);letter-spacing:.18em}
.banner p{font-size:13px;color:var(--text)}
.banner .go{font-family:var(--f-display);font-size:11px;color:var(--neon);letter-spacing:.14em;white-space:nowrap}

.tabs{display:grid;grid-template-columns:repeat(4,1fr);margin-top:18px;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--panel)}
.tab{font-family:var(--f-display);font-size:9.5px;letter-spacing:.12em;padding:12px 2px;color:var(--muted);border-right:1px solid var(--line);position:relative}
.tab:last-child{border-right:0}
.tab[aria-selected="true"]{color:var(--neon);background:var(--neon-soft)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--neon);box-shadow:0 0 8px var(--neon)}
.tab .pip{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--neon);margin-left:4px;vertical-align:middle;box-shadow:0 0 6px var(--neon)}

.stats{display:flex;flex-direction:column;gap:14px;padding:16px}
.stat-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.stat-name{font-family:var(--f-display);font-size:11px;letter-spacing:.14em;font-weight:700}
.stat-val{font-family:var(--f-display);font-size:16px;color:var(--neon);font-variant-numeric:tabular-nums;white-space:nowrap}
.stat-val em{font-style:normal;font-size:10px;color:var(--muted);margin-left:6px}
.stat-bar{height:6px;background:var(--panel-2);border-radius:1px;margin-top:6px;overflow:hidden;position:relative}
.stat-bar i{position:absolute;inset:0 auto 0 0;background:var(--neon);box-shadow:0 0 8px var(--neon);transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.stat-bar i.gear{background:rgba(57,255,20,.35);box-shadow:none}
.stat-sub{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);margin-top:5px;flex-wrap:wrap}

.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.cat{text-align:left;padding:14px;display:flex;flex-direction:column;gap:4px;min-height:96px;transition:border-color .2s,background .2s}
.cat:hover{border-color:var(--line-hi)}
.cat.sel{border-color:var(--neon);background:var(--neon-soft)}
.cat .code{font-family:var(--f-display);font-size:9px;letter-spacing:.2em;color:var(--muted)}
.cat .lab{font-family:var(--f-display);font-size:14px;font-weight:700;letter-spacing:.06em;color:var(--text)}
.cat.sel .lab{color:var(--neon)}
.cat .meta{font-size:12px;color:var(--muted);margin-top:auto}

.slot-list{display:flex;flex-direction:column}
.slot-line{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);align-items:baseline}
.slot-line:last-child{border-bottom:0}
.slot-line .eyebrow{font-size:9px}
.slot-line b{font-weight:600;font-size:14px;color:var(--text)}
.slot-line .empty{color:var(--dim);font-family:var(--f-display);font-size:11px;letter-spacing:.14em}
.slot-line .fx{font-size:12px;color:var(--neon);display:block}
.chips-wrap{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--f-display);font-size:10px;letter-spacing:.12em;padding:7px 10px;border:1px solid var(--line-hi);border-radius:3px;color:var(--neon);background:var(--panel)}
.chip.active-type{border-color:var(--legend);color:var(--legend)}
.empty-note{padding:14px;color:var(--muted);font-size:13px;border:1px dashed var(--line);border-radius:4px}

/* ---------- arsenal ---------- */
.gear-slot{display:flex;flex-direction:column;gap:10px}
.gear{padding:14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 12px;align-items:start}
.gear.equipped{border-color:var(--neon);box-shadow:inset 0 0 0 1px rgba(57,255,20,.2)}
.gear.locked{opacity:.78}
.gear .nm{font-weight:600;font-size:15px;color:var(--text)}
.gear.locked .nm{color:var(--muted)}
.rar{font-family:var(--f-display);font-size:9px;letter-spacing:.2em;color:var(--muted)}
.rar.RARE{color:var(--neon)}
.rar.ÉPIQUE{color:var(--neon);text-shadow:0 0 8px var(--neon-glow)}
.rar.LÉGENDAIRE{color:var(--legend);text-shadow:0 0 8px rgba(255,197,61,.5)}
.gear .ds{font-size:13px;color:var(--muted);grid-column:1/-1}
.fx-list{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.fx-list span{font-size:12px;padding:3px 8px;border-radius:3px;background:var(--neon-soft);color:var(--neon);font-variant-numeric:tabular-nums}
.gear.locked .fx-list span{background:var(--panel-2);color:var(--muted)}
.lock{grid-column:1/-1;display:flex;flex-direction:column;gap:6px}
.lock .req{font-family:var(--f-display);font-size:10px;letter-spacing:.14em;color:var(--text)}
.mini-bar{height:4px;background:var(--panel-2);overflow:hidden;border-radius:1px}
.mini-bar i{display:block;height:100%;background:var(--muted)}
.tag-eq{font-family:var(--f-display);font-size:9px;letter-spacing:.18em;color:var(--ink);background:var(--neon);padding:4px 7px;border-radius:2px;white-space:nowrap}
.btn-sm{min-height:36px;padding:6px 12px;font-size:10px}

/* ---------- perks ---------- */
.pp-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;flex-wrap:wrap}
.pp-head b{font-family:var(--f-display);font-size:28px;color:var(--neon);text-shadow:0 0 12px var(--neon-glow)}
.branches{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.branch{display:flex;flex-direction:column;gap:0}
.branch-h{padding:0 2px 10px}
.branch-h .d{font-size:13px;font-weight:700;color:var(--neon)}
.branch-h p{font-size:12px;color:var(--muted)}
.node{text-align:left;padding:12px;display:flex;flex-direction:column;gap:6px;width:100%}
.node + .link{display:block;width:2px;height:14px;margin-left:22px;background:var(--dim)}
.link.lit{background:var(--neon);box-shadow:0 0 6px var(--neon)}
.node .nm{font-weight:600;font-size:14px}
.node .ds{font-size:12.5px;color:var(--muted)}
.node .st{font-family:var(--f-display);font-size:9px;letter-spacing:.18em;display:flex;justify-content:space-between;gap:6px;align-items:center}
.node.owned{border-color:var(--neon);background:var(--neon-soft)}
.node.owned .nm{color:var(--neon)}
.node.avail{border-color:var(--line-hi);animation:pulse 1.6s infinite}
.node.avail .st{color:var(--neon)}
.node.locked{opacity:.55}
.node.locked .st{color:var(--muted)}
.ptype{font-family:var(--f-display);font-size:8px;letter-spacing:.16em;padding:2px 5px;border:1px solid var(--muted);color:var(--muted);border-radius:2px}
.ptype.ACTIVE{border-color:var(--legend);color:var(--legend)}

/* ---------- archives ---------- */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{padding:14px;display:flex;flex-direction:column;gap:4px}
.kpi b{font-family:var(--f-display);font-size:20px;color:var(--neon);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi span{font-size:12px;color:var(--muted)}
.rows{display:flex;flex-direction:column}
.rows .r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:13.5px}
.rows .r:last-child{border-bottom:0}
.rows .r .s{color:var(--muted);font-size:12px}
.rows .r .v{font-family:var(--f-display);font-size:12px;color:var(--neon);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.settings{padding:16px;display:flex;flex-direction:column;gap:14px}
.field-line{display:flex;flex-direction:column;gap:6px}
.field-line label{font-family:var(--f-display);font-size:10px;letter-spacing:.18em;color:var(--muted)}
.txt{background:var(--panel-2);border:1px solid var(--line-hi);border-radius:4px;padding:11px 12px;color:var(--text);width:100%;font-size:15px}
.danger-zone{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px}

/* ---------- command bar ---------- */
.cmdbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--void);margin-left:calc(-1 * var(--gut-l));margin-right:calc(-1 * var(--gut-r));padding:10px var(--gut-r) 12px var(--gut-l);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.back{width:44px;height:44px;border:2px solid var(--neon);border-radius:4px;display:grid;place-items:center;color:var(--neon);flex:none;box-shadow:0 0 10px rgba(57,255,20,.2)}
.back:hover{background:var(--neon-soft)}
.title-neon{font-family:var(--f-display);font-weight:900;font-size:21px;letter-spacing:.14em;color:var(--neon);text-shadow:0 0 12px var(--neon-glow);flex:1;min-width:0}
.lo-counter{font-family:var(--f-display);font-size:11px;letter-spacing:.14em;color:var(--text);border:1px solid var(--line-hi);padding:7px 10px;border-radius:3px;white-space:nowrap;font-variant-numeric:tabular-nums}
.lo-counter b{color:var(--neon);font-size:14px;display:inline-block;min-width:1.2ch;text-align:center}
.lo-counter.bump b{animation:bump .3s}
@keyframes bump{40%{transform:scale(1.5);text-shadow:0 0 10px var(--neon)}}
.timer{font-family:var(--f-display);font-size:13px;color:var(--neon);font-variant-numeric:tabular-nums;letter-spacing:.08em}

.filters{display:flex;gap:8px;overflow-x:auto;padding-block:14px 4px;scrollbar-width:none;margin-left:calc(-1 * var(--gut-l));margin-right:calc(-1 * var(--gut-r));padding-left:var(--gut-l);padding-right:var(--gut-r)}
.filters::-webkit-scrollbar{display:none}
.filt{font-family:var(--f-display);font-size:10px;letter-spacing:.14em;padding:9px 12px;border:1px solid var(--line);border-radius:3px;color:var(--muted);white-space:nowrap;background:var(--panel)}
.filt.on{border-color:var(--neon);color:var(--neon);background:var(--neon-soft)}
.list-head{display:flex;justify-content:space-between;gap:10px;padding:14px 2px 8px;font-family:var(--f-display);font-size:10px;letter-spacing:.18em;color:var(--muted)}

.ex-list{display:flex;flex-direction:column;gap:8px}
.ex-row{display:flex;align-items:stretch;background:var(--panel);border:1px solid var(--line);border-radius:4px;transition:border-color .15s,background .15s}
.ex-row.is-on{border-color:var(--line-hi);background:#0F140D}
.ex-name{flex:1;min-width:0;text-align:left;padding:12px 8px 12px 14px;display:flex;flex-direction:column;gap:3px}
.ex-name:hover .ex-title{color:var(--neon)}
.ex-title{font-weight:600;font-size:15px;color:var(--text);display:flex;align-items:center;gap:8px}
.ex-title .i{font-family:var(--f-display);font-size:9px;color:var(--muted);border:1px solid var(--dim);border-radius:50%;width:16px;height:16px;display:inline-grid;place-items:center;flex:none}
.ex-meta{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ex-meta .x{color:var(--neon);font-family:var(--f-display);font-size:10px}
.check-hit{width:60px;flex:none;display:grid;place-items:center;border-left:1px solid var(--line)}
.check{width:24px;height:24px;border:2px solid #39FF14;border-radius:4px;background:transparent;display:block;transition:background .12s,box-shadow .12s}
.check.on{background:#39FF14;box-shadow:0 0 12px rgba(57,255,20,.7)}

.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:35;background:linear-gradient(180deg,rgba(0,0,0,0),var(--void) 26%);padding:22px var(--gut-r) calc(12px + env(safe-area-inset-bottom,0px)) var(--gut-l)}
.actionbar-in{max-width:568px;margin:0 auto;display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.actionbar .btn{min-height:56px}

const xpNeeded = lvl => Math.round(220 * Math.pow(Math.max(1, lvl), 1.35) / 10) * 10;

function computeBonuses(st) {
  const b = { xp: { global: 0, power: 0, armor: 0, propulsion: 0, core: 0 }, stat: { power: 0, armor: 0, propulsion: 0, core: 0 },
              rest: 0, record: 0, highRep: 0, lowRep: 0, firstSet: 0, flat: 0, missionBonus: 0 };
  const add = fx => {
    if (!fx) return;
    if (fx.xp) for (const k in fx.xp) if (k in b.xp) b.xp[k] += fx.xp[k] || 0;
    if (fx.stat) for (const k in fx.stat) if (k in b.stat) b.stat[k] += fx.stat[k] || 0;
    ["rest","record","highRep","lowRep","firstSet","flat","missionBonus"].forEach(k => { if (fx[k]) b[k] += fx[k]; });
  };
  SLOT_KEYS.forEach(s => { const g = GEAR_BY_ID[st.gear.equipped[s]]; if (g) add(g.fx); });
  st.perks.forEach(id => { const p = PERK_BY_ID[id]; if (p) add(p.fx); });
  b.rest = Math.min(50, b.rest);
  return b;
}
function effLoad(e, kg, bw) {
  kg = Math.max(0, +kg || 0);
  return e.type === "bw" ? bw * e.bw + kg : kg;
}
function setScore(e, kg, reps, bw) {
  return e.type === "time" ? reps * (1 + (kg || 0) / 20) : effLoad(e, kg, bw) * reps;

  const st = state, b = computeBonuses(st), need = xpNeeded(st.level), pct = Math.min(100, st.xp / need * 100);
  const availPerks = PERKS.filter(p => perkState(p) === "avail").length;
  const mSets = st.mission ? missionTotals().sets : 0;
  const tabs = [["fiche", "FICHE"], ["arsenal", "ARSENAL"], ["aptitudes", "APTITUDES"], ["archives", "ARCHIVES"]];
  return `
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span>NEONFITNESS<b>PRO</b></span></div>
    <button class="sync ${sync.mode}" id="sync-chip" data-act="sync-info" aria-label="État de la sauvegarde"><i aria-hidden="true"></i><span>${SYNC_LABEL[sync.mode]}</span></button>
  </header>
  <section class="panel bracket op-card" aria-label="Fiche de l'opérateur">
    <div>${avatarSVG(st)}</div>
    <div class="op-info">
      <div class="eyebrow">OPÉRATEUR</div>
      <button class="callsign-btn" data-act="edit-name" aria-label="Modifier le nom de code"><h1 class="callsign">${esc(st.operator.callsign)}</h1><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/></svg></button>
      <div class="rank">${rankFor(st.level)}</div>
      <div class="lvl-row">
        <div class="lvl"><span>NIV</span><b class="num">${st.level}</b></div>
        ${st.perkPoints > 0 && availPerks ? `<button class="pp-badge" data-act="tab" data-tab="aptitudes">${plural(st.perkPoints, "POINT")} D'APTITUDE</button>` : ""}
      </div>
      <div class="xpbar" role="progressbar" aria-valuemin="0" aria-valuemax="${need}" aria-valuenow="${Math.round(st.xp)}" aria-label="Expérience"><i style="width:${pct}%"></i></div>
      <div class="xp-meta"><span>${fmt(st.xp)} / ${fmt(need)} XP</span><span>${fmt(need - st.xp)} XP avant NIV ${st.level + 1}</span></div>
    </div>
  </section>
  ${st.mission ? `<button class="banner" data-act="go" data-to="briefing"><div><div class="d">MISSION EN COURS · ${hms(Date.now() - st.mission.start)}</div><p>${plural(mSets, "série").toLowerCase()} validée${mSets > 1 ? "s" : ""}, ${state.loadoutSession.length} exercice${state.loadoutSession.length > 1 ? "s" : ""} au loadout</p></div><span class="go">REPRENDRE →</span></button>` : ""}
  <nav class="tabs" role="tablist">
    ${tabs.map(([id, l]) => `<button class="tab" role="tab" aria-selected="${ui.tab === id}" data-act="tab" data-tab="${id}">${l}${id === "aptitudes" && st.perkPoints > 0 && availPerks ? '<span class="pip" aria-label="points disponibles"></span>' : ""}</button>`).join("")}
  </nav>
  <div>${ui.tab === "arsenal" ? tabArsenal(b) : ui.tab === "aptitudes" ? tabPerks() : ui.tab === "archives" ? tabArchives() : tabFiche(b)}</div>`;
}

function tabFiche(b) {
  const st = state, rookie = st.missions === 0;
  const scale = Math.max(40, ...STAT_KEYS.map(k => statTotal(k, b))) * 1.15;
  const target = `
  <section class="block">
    <h2 class="h2">${rookie ? "PREMIÈRE MISSION" : "CIBLE DE MISSION"}</h2>
    <p class="hint">${rookie ? "Choisissez le système musculaire à travailler aujourd'hui. Le catalogue d'exercices s'ouvre directement dessus." : "Sélectionnez le système à travailler. Vous pourrez mélanger plusieurs systèmes dans le loadout."}</p>
    <div class="cat-grid">
      ${CATS.map(c => {
        const list = exByCat(c.id), aff = {};
        list.forEach(e => { for (const k in e.stats) aff[k] = (aff[k] || 0) + e.stats[k]; });
        const main = Object.keys(aff).sort((a, z) => aff[z] - aff[a])[0];
        return `<button class="panel cat ${st.category === c.id ? "sel" : ""}" data-act="pick-cat" data-cat="${c.id}">
          <span class="code">${c.code}</span><span class="lab">${c.label}</span>
          <span class="meta">${list.length} exercices · ${STATS[main].short.toLowerCase()}</span></button>`;
      }).join("")}
    </div>
  </section>`;
  const attrs = `
  <section class="block">
    <h2 class="h2">ATTRIBUTS DU CHÂSSIS</h2>
    <div class="panel stats">
      ${STAT_KEYS.map(k => {
        const base = st.stats[k], bonus = b.stat[k], xpb = Math.round(b.xp.global + b.xp[k]);
        return `<div class="stat">
          <div class="stat-head"><span class="stat-name">${STATS[k].label}</span><span class="stat-val">${fmt1(base + bonus)}${bonus ? `<em>dont +${bonus} cyberware</em>` : ""}</span></div>
          <div class="stat-bar"><i class="gear" style="width:${(base + bonus) / scale * 100}%"></i><i style="width:${base / scale * 100}%"></i></div>
          <div class="stat-sub"><span>${STATS[k].groups}</span><span>${xpb ? `XP +${xpb} %` : "XP de base"}</span></div>
        </div>`;
      }).join("")}
    </div>
    ${rookie ? `<p class="hint">Chaque série renforce l'attribut du groupe musculaire travaillé.</p>` : ""}
  </section>`;
  if (rookie) return target + attrs + `
  <section class="block"><div class="empty-note">Le cyberware et les aptitudes se débloquent en jouant. Consultez les onglets <b>Arsenal</b> et <b>Aptitudes</b> quand vous voulez.</div></section>`;
  return target + attrs + `
  <section class="block">
    <h2 class="h2">CYBERWARE ÉQUIPÉ</h2>
    <div class="panel slot-list">
      ${SLOT_KEYS.map(s => { const g = GEAR_BY_ID[st.gear.equipped[s]];
        return `<div class="slot-line"><span class="eyebrow">${SLOTS[s]}</span><div>${g ? `<b>${esc(g.name)}</b><span class="fx">${fxLines(g.fx).join(" · ")}</span>` : `<span class="empty">EMPLACEMENT LIBRE</span>`}</div></div>`; }).join("")}
    </div>
  </section>
  <section class="block">
    <h2 class="h2">APTITUDES ACTIVES</h2>
    ${st.perks.length ? `<div class="chips-wrap">${st.perks.map(id => { const p = PERK_BY_ID[id]; return `<span class="chip ${p.type === "ACTIVE" ? "active-type" : ""}">${esc(p.name)}</span>`; }).join("")}</div>`
      : `<div class="empty-note">Aucune aptitude installée. ${st.perkPoints ? `Vous avez ${st.perkPoints} point à dépenser dans l'onglet Aptitudes.` : "Montez de niveau pour gagner des points."}</div>`}
  </section>`;
}

function tabArsenal() {
  const st = state;
  return SLOT_KEYS.map(s => `
  <section class="block gear-slot">
    <h2 class="h2">${SLOTS[s]}</h2>
    ${GEAR.filter(g => g.slot === s).map(g => {
      const unlocked = st.gear.unlocked.includes(g.id), eq = st.gear.equipped[s] === g.id;
      let side = "";
      if (eq) side = `<span class="tag-eq">ÉQUIPÉ</span>`;
      else if (unlocked) side = `<button class="btn btn-neon btn-sm" data-act="equip" data-id="${g.id}">ÉQUIPER</button>`;
      let lock = "";
      if (!unlocked) {
        const [cur, tgt] = condProgress(g.cond, st);
        lock = `<div class="lock"><span class="req">VERROUILLÉ · ${condText(g.cond)}</span><div class="mini-bar"><i style="width:${Math.min(100, cur / tgt * 100)}%"></i></div><span class="hint">${fmt(cur)} / ${fmt(tgt)}</span></div>`;
      }
      return `<article class="panel gear ${eq ? "equipped" : ""} ${unlocked ? "" : "locked"}">
        <div><div class="rar ${g.rarity}">${g.rarity}</div><div class="nm">${esc(g.name)}</div></div>
        <div>${side}</div>
        <p class="ds">${esc(g.desc)}</p>
        <div class="fx-list">${fxLines(g.fx).map(l => `<span>${l}</span>`).join("")}</div>
        ${lock}
        ${eq ? `<div style="grid-column:1/-1"><button class="btn btn-quiet btn-sm" data-act="unequip" data-slot="${s}">RETIRER</button></div>` : ""}
      </article>`;
    }).join("")}
  </section>`).join("");
}

function perkState(p) {
  if (state.perks.includes(p.id)) return "owned";
  if (state.level >= p.lvl && (!p.req || state.perks.includes(p.req)) && state.perkPoints > 0) return "avail";
  return "locked";
}
function tabPerks() {
  const st = state;
  return `
  <section class="block">
    <div class="panel pp-head">
      <div><div class="eyebrow">POINTS D'APTITUDE</div><b class="num">${st.perkPoints}</b></div>
      <p class="hint" style="max-width:34ch">Un point gagné à chaque niveau. Chaque branche se débloque dans l'ordre.</p>
    </div>
  </section>
  <section class="block">
    <div class="branches">
      ${Object.entries(BRANCHES).map(([bid, br]) => {
        const nodes = PERKS.filter(p => p.branch === bid).sort((a, z) => a.tier - z.tier);
        return `<div class="branch"><div class="branch-h"><div class="d">${br.label}</div><p>${br.sub}</p></div>
          ${nodes.map((p, i) => {
            const s = perkState(p);
            let status;
            if (s === "owned") status = "INSTALLÉE";
            else if (s === "avail") status = "TOUCHER POUR INSTALLER";
            else if (st.level < p.lvl) status = `NIVEAU ${p.lvl} REQUIS`;
            else if (p.req && !st.perks.includes(p.req)) status = `REQUIERT ${PERK_BY_ID[p.req].name.toUpperCase()}`;
            else status = "AUCUN POINT DISPONIBLE";
            const link = i < nodes.length - 1 ? `<span class="link ${s === "owned" ? "lit" : ""}" aria-hidden="true"></span>` : "";
            return `<button class="panel node ${s}" ${s === "avail" ? `data-act="perk" data-id="${p.id}"` : "aria-disabled=\"true\""}>
              <span class="st"><span>T${p.tier} · NIV ${p.lvl}</span><span class="ptype ${p.type}">${p.type}</span></span>
              <span class="nm">${esc(p.name)}</span><span class="ds">${esc(p.desc)}</span>
              <span class="st">${status}</span></button>${link}`;
          }).join("")}</div>`;
      }).join("")}
    </div>
  </section>`;
}

  const st = state;
  const recs = Object.entries(st.records).map(([id, r]) => ({ id, ...r })).sort((a, z) => z.date - a.date).slice(0, 8);
  return `
  <section class="block">
    <h2 class="h2">BILAN DE SERVICE</h2>
    <div class="kpis">
      <div class="panel kpi"><b>${fmt(st.missions)}</b><span>missions accomplies</span></div>
      <div class="panel kpi"><b>${fmt(st.tonnage)} kg</b><span>tonnage cumulé</span></div>
      <div class="panel kpi"><b>${fmt(st.totalXp)}</b><span>XP totale</span></div>
      <div class="panel kpi"><b>${fmt(Object.keys(st.records).length)}</b><span>exercices avec record</span></div>
    </div>
  </section>
  <section class="block">
    <h2 class="h2">JOURNAL DES MISSIONS</h2>
    ${st.history.length ? `<div class="panel rows">${st.history.slice(0, 12).map(h => `<div class="r"><div>${new Date(h.date).toLocaleDateString("fr-FR", { weekday: "short", day: "numeric", month: "short" })} · ${esc(h.focus || "Mission")}<div class="s">${h.sets} séries · ${fmt(h.ton)} kg · ${hms(h.dur)}</div></div><div class="v">+${fmt(h.xp)} XP<div class="s">NIV ${h.level}</div></div></div>`).join("")}</div>`
      : `<div class="empty-note">Aucune mission archivée. Votre premier rapport apparaîtra ici.</div>`}
  </section>
  <section class="block">
    <h2 class="h2">RECORDS PERSONNELS</h2>
    ${recs.length ? `<div class="panel rows">${recs.map(r => { const e = EX[r.id]; return `<div class="r"><div>${esc(e.name)}<div class="s">${new Date(r.date).toLocaleDateString("fr-FR")}</div></div><div class="v">${e.type === "time" ? `${fmt(r.reps)} s${r.kg ? ` · ${fmt1(r.kg)} kg` : ""}` : `${fmt1(r.kg)} kg × ${fmt(r.reps)}`}</div></div>`; }).join("")}</div>`
      : `<div class="empty-note">Les records sont enregistrés à la fin de chaque mission.</div>`}
  </section>
  <section class="block">
    <h2 class="h2">SAUVEGARDE</h2>
    <div class="panel settings">
      ${STANDALONE && fb.user ? `<div class="field-line"><label>COMPTE</label><p style="font-size:14px;overflow-wrap:anywhere">${esc(fb.user.email || "Compte Google")}</p></div>` : ""}
      <div class="field-line"><label>ÉTAT</label><p id="sync-info-text" class="sync-sheet" style="font-size:14px">${esc(syncInfo())}</p></div>
      <div class="btn-row"><button class="btn btn-ghost" data-act="export">EXPORTER</button><button class="btn btn-ghost" data-act="import">IMPORTER</button></div>
      <p class="hint">L'export produit un code contenant toute votre progression : copie de secours, ou transfert vers une autre version de l'app.</p>
      <button class="btn btn-quiet" data-act="replay-guide">REVOIR LE GUIDE D'ACCUEIL</button>
      ${STANDALONE ? `<button class="btn btn-quiet" data-act="sign-out">SE DÉCONNECTER</button>` : ""}
    </div>
  </section>
  <section class="block">
    <h2 class="h2">PARAMÈTRES</h2>
    <div class="panel settings">
      <div class="field-line"><label for="set-callsign">NOM DE CODE</label><input class="txt" id="set-callsign" maxlength="20" value="${esc(st.operator.callsign)}" autocomplete="off"></div>
      <div class="field-line"><label for="set-bw">POIDS DE CORPS (KG)</label><input class="txt" id="set-bw" inputmode="decimal" value="${fmt1(st.operator.bodyweight)}"><span class="hint">Sert au calcul de la charge des exercices au poids du corps (tractions, dips, pompes).</span></div>
      <div class="danger-zone">
        <button class="btn btn-alert hold" data-hold="wipe-save" data-ms="1500"><span class="stack">RÉINITIALISER L'OPÉRATEUR<small>APPUI LONG 1,5 S · EFFACE TOUTE LA PROGRESSION</small></span></button>
      </div>
    </div>
  </section>`;
}

   Écran 2 — Catalogue & Loadout
   ===================================================================== */
function renderCatalog() {
  const f = ui.filter || state.category;
  const list = exByCat(f), n = state.loadoutSession.length;
  const cat = CAT_BY_ID[f];
  return `
  <header class="cmdbar">
    <button class="back" data-act="go" data-to="hq" aria-label="Retour au QG">${chevron()}</button>
    <h1 class="title-neon">CATALOGUE</h1>
    <div class="lo-counter" id="lo-counter" aria-live="polite">LOADOUT : <b id="lo-count">${n}</b> EXOS</div>
  </header>
  <div class="filters" role="tablist" aria-label="Filtrer par système">
    ${[{ id: "all", label: "TOUS" }, ...CATS].map(c => `<button class="filt ${f === c.id ? "on" : ""}" role="tab" aria-selected="${f === c.id}" data-act="filter" data-cat="${c.id}">${c.label}</button>`).join("")}
  </div>
  ${state.tips.catalog ? "" : `<div class="tip"><p>Touchez le <b>nom</b> d'un exercice pour l'analyser, la <b>case</b> pour l'ajouter au loadout, puis <b>VALIDER</b>.</p><button class="btn btn-quiet btn-sm" data-act="dismiss-tip" data-tip="catalog">COMPRIS</button></div>`}
  <div class="list-head"><span>${cat ? `${cat.code} · ${cat.label}` : "TOUS SYSTÈMES"}</span><span>${list.length} EXERCICES</span></div>
  <div class="ex-list" id="ex-list">${list.map(rowHTML).join("")}</div>
  <footer class="actionbar"><div class="actionbar-in">
    <button class="btn btn-alert hold" data-hold="reset-loadout" data-ms="600" aria-label="Reset du loadout, appui long requis"><span class="stack">RESET<small>APPUI LONG</small></span></button>
    <button class="btn btn-neon" data-act="validate-loadout">VALIDER <span class="badge-n" id="lo-badge">${n}</span></button>
  </div></footer>`;
}
function rowHTML(e) {
  const on = state.loadoutSession.includes(e.id);
  return `<div class="ex-row ${on ? "is-on" : ""}" data-row="${e.id}">
    <button class="ex-name" data-act="sheet-ex" data-id="${e.id}" aria-label="Analyser ${esc(e.name)}">
      <span class="ex-title">${esc(e.name)}<span class="i" aria-hidden="true">i</span></span>
      <span class="ex-meta"><span class="x">×${e.coef.toFixed(2)}</span> · ${esc(e.muscles.slice(0, 2).join(", "))}</span>
    </button>
    <button class="check-hit" data-act="toggle-ex" data-id="${e.id}" role="checkbox" aria-checked="${on}" aria-label="Ajouter ${esc(e.name)} au loadout"><span class="check ${on ? "on" : ""}"></span></button>
  </div>`;
}
const chevron = () => `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" aria-hidden="true"><path d="M15 4 7 12l8 8"/></svg>`;

function syncLoadoutUI(id) {
  const n = state.loadoutSession.length;
  const c = $("#lo-count"), bd = $("#lo-badge"), ctr = $("#lo-counter");
  if (c) c.textContent = n;
  if (bd) bd.textContent = n;
  if (ctr) { ctr.classList.remove("bump"); void ctr.offsetWidth; ctr.classList.add("bump"); }
  const ids = id ? [id] : EXERCISES.map(e => e.id);
  ids.forEach(x => {
    const row = document.querySelector(`[data-row="${x}"]`);
    if (!row) return;
    const on = state.loadoutSession.includes(x);
    row.classList.toggle("is-on", on);
    const hit = row.querySelector(".check-hit"); hit.setAttribute("aria-checked", on);
    row.querySelector(".check").classList.toggle("on", on);
  });
}
function toggleEx(id) {
  if (!EX[id]) return;
  const i = state.loadoutSession.indexOf(id);
  if (i >= 0) state.loadoutSession.splice(i, 1); else state.loadoutSession.push(id);
  save();
  vibrate(12);
  syncLoadoutUI(id);
  if (ui.sheetEx === id) openExSheet(id);
}

function openExSheet(id) {
  const e = EX[id]; if (!e) return;
  ui.sheetEx = id;
  const b = computeBonuses(state), on = state.loadoutSession.includes(id);
  const d = state.lastSets[id] || { kg: e.defKg, reps: e.defReps };
  const est = calcSetXp(e, d.kg, d.reps, { b, bw: bodyweight(), isFirst: false, isRecord: false });
  const pct = Math.round(xpPctFor(e, b));
  const unit = e.type === "time" ? "s" : "reps";
  const aff = Object.entries(e.stats).sort((a, z) => z[1] - a[1]).map(([k, w]) => `${STATS[k].short} ${Math.round(w * 100)} %`).join(" · ");
  const r0 = e.rest, r1 = restFor(e, b);
  const loadTxt = e.type === "bw" ? `${fmt1(bodyweight())} kg × ${e.bw}${d.kg ? ` + ${fmt1(d.kg)} kg` : ""}` : `${fmt1(d.kg)} kg`;
  $("#sheet-in").innerHTML = `
    <div class="grip" aria-hidden="true"></div>
    <div class="sheet-top"><div><div class="eyebrow">TERMINAL D'ANALYSE · ${CAT_BY_ID[e.cat].code}</div><h2>${esc(e.name)}</h2></div>
      <button class="x-close" data-act="close-sheet" aria-label="Fermer">✕</button></div>
    <div class="sec"><h3>ANALYSE BIOMÉCANIQUE</h3><p>${esc(e.desc)}</p></div>
    <div class="sec"><h3>MUSCLES CIBLÉS</h3><div class="mtags">${e.muscles.map(m => `<span>${esc(m)}</span>`).join("")}</div></div>
    <div class="sec"><h3>RATIO D'XP</h3>
      <div class="ratio">
        <div><span>Coefficient de difficulté</span><b>×${e.coef.toFixed(2)}</b></div>
        <div><span>Bonus actifs</span><b>${pct >= 0 ? "+" : ""}${pct} %</b></div>
        <div><span>Estimation (${e.type === "time" ? fmt(d.reps) + " s" : loadTxt + " × " + fmt(d.reps)})</span><b>≈ ${fmt(est.xp)} XP</b></div>
        <div><span>Repos optimal</span><b>${r1 < r0 ? `${r1} s <small style="font-size:10px;color:var(--muted)">(${r0})</small>` : `${r0} s`}</b></div>
      </div>
      <p class="hint">Attributs renforcés : ${aff}</p>
      <p class="formula">${e.type === "time" ? "XP = (secondes × coef × 0,6 + lest × secondes / 40) × bonus" : "XP = (charge × reps × coef / 20 + reps × coef) × bonus"}</p>
    </div>
    <button class="btn ${on ? "btn-ghost" : "btn-neon"}" data-act="toggle-ex" data-id="${e.id}">${on ? "RETIRER DU LOADOUT" : "AJOUTER AU LOADOUT"}</button>`;
  showSheet(".x-close");
}
function showSheet(focusSel) {
  const w = $("#sheet");
  if (w.hidden) { w.hidden = false; requestAnimationFrame(() => requestAnimationFrame(() => w.classList.add("open"))); }
  setTimeout(() => { const x = w.querySelector(focusSel || ".x-close"); if (x) x.focus({ preventScroll: true }); }, 80);
}
function closeSheet() {
  const w = $("#sheet"); if (w.hidden) return;
  w.classList.remove("open"); ui.sheetEx = null;
  setTimeout(() => { if (!w.classList.contains("open")) w.hidden = true; }, reduced() ? 0 : 320);
}

/* ---- Nom de code ---- */
const DEFAULT_NAME = "OPÉRATEUR-07";
const cleanName = v => String(v || "").replace(/\s+/g, " ").trim();
const validName = v => { const n = cleanName(v); return n.length >= 2 && n.length <= 20; };
function openNameSheet() {
  ui.sheetEx = null;
  $("#sheet-in").innerHTML = `
    <div class="grip" aria-hidden="true"></div>
    <div class="sheet-top"><div><div class="eyebrow">FICHE DE L'OPÉRATEUR</div><h2>NOM DE CODE</h2></div>
      <button class="x-close" data-act="close-sheet" aria-label="Fermer">✕</button></div>
    <div class="field-line"><label for="name-input">NOUVEAU NOM</label>
      <input class="txt" id="name-input" maxlength="20" autocomplete="off" value="${esc(state.operator.callsign)}">
      <span class="hint">Entre 2 et 20 caractères. Affiché sur votre fiche et dans vos rapports.</span></div>
    <button class="btn btn-neon" data-act="save-name">ENREGISTRER</button>`;
  showSheet("#name-input");
}
function commitName(raw) {
  if (!validName(raw)) { toast("Le nom doit contenir entre 2 et 20 caractères.", true); return false; }
  state.operator.callsign = cleanName(raw);
  save();
  return true;
}

/* ---- Fiche sauvegarde ---- */
function openSyncSheet() {
  ui.sheetEx = null;

/* ---- Export / import de la progression ---- */
function toB64(str) {
  const bytes = new TextEncoder().encode(str); let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function fromB64(b64) {
  const bin = atob(b64), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
const exportCode = () => "NFP1." + toB64(JSON.stringify(state));
function parseImport(code) {
  code = String(code || "").replace(/\s+/g, "");
  if (!code.startsWith("NFP1.")) throw new Error("prefix");
  const obj = JSON.parse(fromB64(code.slice(5)));
  if (!isObj(obj) || !isObj(obj.operator)) throw new Error("shape");
  return sanitize(obj);
}

function setAuthBusy(on) {
  authBusy = on;
  document.querySelectorAll("#auth button").forEach(x => { x.disabled = on; });
}
async function doAuth() {
  if (authBusy || !fb.auth) return;
  const em = $("#au-email"), pw = $("#au-pass"), err = $("#auth-err");
  const email = em ? em.value.trim() : "", pass = pw ? pw.value : "";
  authEmail = email;
  err.className = "auth-err"; err.textContent = "";
  if (!email) { err.textContent = "Saisissez votre adresse e-mail."; em.focus(); return; }
  if (authMode !== "reset" && !pass) { err.textContent = "Saisissez votre mot de passe."; pw.focus(); return; }
  setAuthBusy(true);
  try {
    if (authMode === "reset") {
      await fb.auth.sendPasswordResetEmail(email);
      setAuthBusy(false);
      renderAuth("login", "Si un compte existe pour cette adresse, un e-mail de réinitialisation vient d'être envoyé. Pensez aux courriers indésirables.", true);
      return;

    if (authMode === "signup") {

      await fb.auth.createUserWithEmailAndPassword(email, pass);
    } else {
      await fb.auth.signInWithEmailAndPassword(email, pass);

}

}

  const d = (m && isObj(m.draft[id]) ? m.draft[id] : null) || state.lastSets[id] || { kg: e.defKg, reps: e.defReps };
  return { kg: num(d.kg, e.defKg, 0, 1000), reps: num(d.reps, e.defReps, 1, 3600) };
}

function setContext(id, score) {
  const sets = (state.mission && state.mission.sets[id]) || [];
  const prevBest = Math.max((state.records[id] && state.records[id].score) || 0, ...sets.map(s => s.score), 0);
  return { isFirst: sets.length === 0, isRecord: prevBest > 0 && score > prevBest };
}
function previewXp(id, kg, reps, b) {
  const e = EX[id];
  if (!Number.isFinite(kg) || !Number.isFinite(reps) || reps < 1 || kg < 0) return "—";
  const c = setContext(id, setScore(e, kg, reps, bodyweight()));
  let xp = calcSetXp(e, kg, reps, { b: b || computeBonuses(state), bw: bodyweight(), ...c }).xp;
  if (state.mission && state.mission.adrenaline === "armed") xp *= 2;
  return fmt(xp);
}
function readDraftInputs(id) {
  const kgEl = document.getElementById("kg-" + id), rEl = document.getElementById("reps-" + id);
  return { kg: kgEl ? parseNum(kgEl.value) : NaN, reps: rEl ? parseNum(rEl.value) : NaN, kgEl, rEl };
}
function storeDraft(id, kg, reps) {
  ensureMission();
  const cur = getDraft(id);
  state.mission.draft[id] = { kg: Number.isFinite(kg) && kg >= 0 ? kg : cur.kg, reps: Number.isFinite(reps) && reps >= 1 ? reps : cur.reps };
  save();
}
function validateSet(id, btn) {
  const e = EX[id]; if (!e) return;
  audioPrime();
  const { kg, reps, kgEl, rEl } = readDraftInputs(id);
  const maxR = e.type === "time" ? 3600 : 500;
  const kgOk = Number.isFinite(kg) && kg >= 0 && kg <= 1000;
  const rOk = Number.isFinite(reps) && reps >= 1 && reps <= maxR;
  if (kgEl) kgEl.parentElement.classList.toggle("bad", !kgOk);
  if (rEl) rEl.parentElement.classList.toggle("bad", !rOk);
  if (!kgOk || !rOk) {
    shake(document.querySelector(`[data-card="${id}"] .entry`));
    toast(!kgOk ? "Charge invalide : entre 0 et 1 000 kg." : (e.type === "time" ? "Durée invalide : entre 1 et 3 600 s." : "Répétitions invalides : entre 1 et 500."), true);
    vibrate(60);
    return;
  }
  const r = Math.round(reps), k = Math.round(kg * 100) / 100;
  ensureMission();
  const m = state.mission, b = computeBonuses(state), bw = bodyweight();
  const score = setScore(e, k, r, bw);
  const ctx = setContext(id, score);
  const res = calcSetXp(e, k, r, { b, bw, ...ctx });
  let xp = res.xp; const tags = res.tags.slice();
  if (m.adrenaline === "armed") { xp *= 2; tags.push("ADRÉNALINE ×2"); m.adrenaline = "used"; }
  (m.sets[id] = m.sets[id] || []).push({ kg: k, reps: r, xp, load: res.load, score, tags, ts: Date.now() });
  state.lastSets[id] = { kg: k, reps: r };
  m.draft[id] = { kg: k, reps: r };
  const rest = restFor(e, b);
  m.rest = { endAt: Date.now() + rest * 1000, total: rest, exId: id, xp, tags };
  ui.delArm = null;
  save();
  vibrate([30, 40, 30]);
  beep(1320, 0.07);
  floatXp(`+${fmt(xp)} XP`, btn);
  render();
  openRest();
}
function deleteSet(id, i) {
  const key = `${id}:${i}`;
  if (ui.delArm !== key) { ui.delArm = key; render(); return; }
  const m = state.mission; if (!m || !m.sets[id] || !m.sets[id][i]) { ui.delArm = null; render(); return; }
  const [rm] = m.sets[id].splice(i, 1);
  if (!m.sets[id].length) delete m.sets[id];
  if (rm.tags.some(t => t.startsWith("ADRÉNALINE"))) m.adrenaline = "ready";
  ui.delArm = null;
  save(); vibrate(40); redFlash();

/* ---- Repos tactique ---- */
let restTick = null, wakeLock = null, restDoneFired = false;
const RING_C = 2 * Math.PI * 82;
function openRest() {
  const m = state.mission; if (!m || !m.rest) return;
  const r = m.rest, e = EX[r.exId];
  const el = $("#rest");
  $("#rest-gain").textContent = `+${fmt(r.xp)} XP`;
  $("#rest-gain").style.animation = "none"; void $("#rest-gain").offsetWidth; $("#rest-gain").style.animation = "";
  $("#rest-tags").innerHTML = r.tags.map(t => `<span class="${t.startsWith("ADR") ? "leg" : ""}">${esc(t)}</span>`).join("");
  const t = missionTotals();
  $("#rest-mxp").textContent = "+" + fmt(t.xp);
  $("#rest-sets").textContent = t.sets;
  $("#rest-ton").textContent = fmt(t.ton);
  const n = (m.sets[r.exId] || []).length;
  $("#rest-next").innerHTML = e ? `Série suivante : <b>${esc(e.name)}</b> · S${n + 1}` : "";
  const b = computeBonuses(state);
  $("#rest-note").textContent = b.rest ? `Récupération réduite de ${b.rest} % par vos aptitudes et votre cyberware.` : "Le temps de repos optimal dépend de l'exercice.";
  restDoneFired = Date.now() >= r.endAt;
  el.hidden = false;
  document.body.style.overflow = "hidden";
  tickRest();
  clearInterval(restTick); restTick = setInterval(tickRest, 250);
  try { if (navigator.wakeLock && !wakeLock) navigator.wakeLock.request("screen").then(w => { wakeLock = w; }).catch(() => {}); } catch (e2) {}
  setTimeout(() => $("#rest-btn").focus({ preventScroll: true }), 50);
}
function tickRest() {
  const m = state.mission;
  if (!m || !m.rest) { closeRest(); return; }
  const r = m.rest, left = (r.endAt - Date.now()) / 1000;
  const ring = $("#ring"), fg = $("#ring-fg");
  fg.setAttribute("stroke-dasharray", RING_C.toFixed(2));
  if (left > 0) {
    ring.classList.remove("done");
    $("#rest-time").textContent = mmss(Math.ceil(left));
    $("#rest-state").textContent = "RÉCUPÉRATION";
    fg.setAttribute("stroke-dashoffset", (RING_C * (1 - Math.min(1, left / r.total))).toFixed(2));
    $("#rest-btn").textContent = "PASSER LE REPOS";
  } else {
    ring.classList.add("done");
    $("#rest-time").textContent = "+" + mmss(-left);
    $("#rest-state").textContent = "SYSTÈMES PRÊTS";
    fg.setAttribute("stroke-dashoffset", "0");
    $("#rest-btn").textContent = "REPRENDRE LE COMBAT";
    if (!restDoneFired) { restDoneFired = true; vibrate([200, 100, 200]); beep(880, 0.15); beep(1320, 0.2, 0.18); }
  }
}
function closeRest() {
  clearInterval(restTick); restTick = null;
  $("#rest").hidden = true;
  document.body.style.overflow = "";
  try { if (wakeLock) { wakeLock.release(); wakeLock = null; } } catch (e) { wakeLock = null; }
}
function endRest() {
  if (state.mission) { state.mission.rest = null; save(); }
  closeRest();
}

/* =====================================================================
   Écran 4 — Rapport de mission
   ===================================================================== */
function finishMission() {
  const st = state, m = st.mission;
  if (!m) return;
  const t = missionTotals();
  if (!t.sets) { toast("Validez au moins une série avant de terminer.", true); return; }
  const b = computeBonuses(st);
  const gains = { power: 0, armor: 0, propulsion: 0, core: 0 };
  const perEx = [], records = [];
  for (const id in m.sets) {
    const e = EX[id]; if (!e) continue;
    let exXp = 0, exTon = 0, best = null;
    m.sets[id].forEach(s => {
      exXp += s.xp; if (e.type !== "time") exTon += s.load * s.reps;
      for (const k in e.stats) gains[k] += s.xp * e.stats[k] / 60;
      if (!best || s.score > best.score) best = s;
    });
    perEx.push({ id, sets: m.sets[id].length, xp: exXp, ton: exTon });
    const old = st.records[id];
    if (best && (!old || best.score > old.score)) {
      st.records[id] = { score: best.score, kg: best.kg, reps: best.reps, date: Date.now() };
      if (old) records.push({ id, kg: best.kg, reps: best.reps, prev: old });
    }
  }
  const bonusPct = 10 + b.missionBonus;
  const bonusXp = Math.round(t.xp * bonusPct / 100);
  const totalXp = t.xp + bonusXp;
  const oldLevel = st.level, oldXp = st.xp, oldStats = { ...st.stats };
  const oldPct = oldXp / xpNeeded(oldLevel) * 100;
  st.xp += totalXp; st.totalXp += totalXp;
  let levels = 0;
  while (st.xp >= xpNeeded(st.level)) { st.xp -= xpNeeded(st.level); st.level++; st.perkPoints++; levels++; }
  STAT_KEYS.forEach(k => { gains[k] = Math.round(gains[k] * 10) / 10; st.stats[k] = Math.round((st.stats[k] + gains[k]) * 10) / 10; });
  st.missions++; st.tonnage += t.ton;
  const newGear = checkUnlocks(st);
  const newPerks = PERKS.filter(p => p.lvl > oldLevel && p.lvl <= st.level).map(p => p.id);
  const dur = Date.now() - m.start;
  const catCount = {};
  perEx.forEach(p => { const c = EX[p.id].cat; catCount[c] = (catCount[c] || 0) + p.sets; });
  const focus = Object.keys(catCount).sort((a, z) => catCount[z] - catCount[a]).slice(0, 2).map(c => CAT_BY_ID[c].label.toLowerCase()).join(" + ");
  st.history.unshift({ date: Date.now(), xp: totalXp, ton: t.ton, sets: t.sets, exCount: perEx.length, dur, level: st.level, focus: focus.charAt(0).toUpperCase() + focus.slice(1) });
  st.history = st.history.slice(0, 60);
  st.mission = null;
  st.loadoutSession = [];
  ui.report = { t, bonusXp, bonusPct, totalXp, oldLevel, newLevel: st.level, oldPct, newPct: st.xp / xpNeeded(st.level) * 100, levels,
                oldStats, newStats: { ...st.stats }, gains, newGear, newPerks, records, perEx, dur, missionNo: st.missions };
  save();
  closeRest();
  ui.screen = "report";
  render();
  window.scrollTo(0, 0);
}

let reportAnimToken = 0;
function animateReport() {
  const r = ui.report; if (!r || r.animated) return;
  r.animated = true;
  const token = ++reportAnimToken;
  const bars = document.querySelectorAll(".stat-bar i[data-to]");
  const bar = $("#rp-xpfill"), lvlEl = $("#rp-level"), lu = $("#rp-levelup");
  if (reduced()) {
    bars.forEach(i => { i.style.width = i.dataset.to + "%"; });
    if (bar) bar.style.width = r.newPct + "%";
    if (lvlEl) lvlEl.textContent = r.newLevel;
    return;
  }
  setTimeout(() => bars.forEach(i => { i.style.width = i.dataset.to + "%"; }), 350);
  let level = r.oldLevel, steps = r.levels;
  const next = () => {
    if (token !== reportAnimToken || !bar) return;
    if (steps > 0) {
      bar.style.transition = ""; bar.style.width = "100%";
      setTimeout(() => {
        if (token !== reportAnimToken) return;
        level++; steps--;
        lvlEl.textContent = level;
        lu.classList.add("show");
        levelFlash(level);
        bar.style.transition = "none"; bar.style.width = "0%"; void bar.offsetWidth;
        setTimeout(next, 700);
      }, 950);
    } else {
      bar.style.transition = ""; bar.style.width = r.newPct + "%";
    }
  };
  setTimeout(next, 500);
}
function levelFlash(level) {
  vibrate([60, 40, 120]); beep(660, 0.12); beep(990, 0.12, 0.12); beep(1320, 0.25, 0.24);
  const f = document.createElement("div");
  f.className = "lvl-flash"; f.setAttribute("aria-hidden", "true");
  f.innerHTML = `<div>LEVEL UP<small>NIVEAU ${level} · ${rankFor(level)}</small></div>`;
  document.body.appendChild(f);

}

function go(to) {

const actions = {
  "go": el => go(el.dataset.to),
  "tab": el => { ui.tab = el.dataset.tab; if (ui.screen !== "hq") ui.screen = "hq"; render(); },
  "go-perks": () => { ui.report = null; ui.tab = "aptitudes"; go("hq"); },
  "pick-cat": el => { state.category = el.dataset.cat; ui.filter = el.dataset.cat; save(); go("catalog"); },
  "filter": el => { ui.filter = el.dataset.cat; render(); },
  "sheet-ex": el => openExSheet(el.dataset.id),
  "close-sheet": () => closeSheet(),
  "toggle-ex": el => toggleEx(el.dataset.id),
  "validate-loadout": () => {
    if (!state.loadoutSession.length) { shake($("#lo-counter")); vibrate(60); toast("Loadout vide : cochez au moins un exercice.", true); return; }
    ensureMission(); save(); go("briefing");
  },
  "step": el => {
    const id = el.dataset.id, f = el.dataset.f, d = parseFloat(el.dataset.d), e = EX[id];
    const input = document.getElementById(`${f}-${id}`); if (!input || !e) return;
    let v = parseNum(input.value); if (!Number.isFinite(v)) v = f === "kg" ? e.defKg : e.defReps;
    v = f === "kg" ? Math.max(0, Math.min(1000, Math.round((v + d) * 100) / 100)) : Math.max(1, Math.min(e.type === "time" ? 3600 : 500, Math.round(v + d)));
    input.value = f === "kg" ? String(v).replace(".", ",") : String(v);
    input.parentElement.classList.remove("bad");
    onDraftInput(id);
  },
  "validate-set": el => validateSet(el.dataset.id, el),
  "del-set": el => deleteSet(el.dataset.id, +el.dataset.i),
  "adrenaline": () => {
    const m = state.mission; if (!m || m.adrenaline === "used") return;
    m.adrenaline = m.adrenaline === "armed" ? "ready" : "armed";
    if (m.adrenaline === "armed") { vibrate([20, 30, 60]); toast("Injection armée : prochaine série ×2 XP."); }
    save(); render();
  },
  "finish-mission": () => finishMission(),
  "rest-add": el => { const m = state.mission; if (!m || !m.rest) return; const d = +el.dataset.d * 1000; m.rest.endAt = Math.max(Date.now(), m.rest.endAt + d); m.rest.total = Math.max(1, m.rest.total + (+el.dataset.d)); if (m.rest.endAt > Date.now()) restDoneFired = false; save(); tickRest(); },
  "rest-skip": () => endRest(),
  "equip": el => { const g = GEAR_BY_ID[el.dataset.id]; if (!g || !state.gear.unlocked.includes(g.id)) return; state.gear.equipped[g.slot] = g.id; save(); vibrate(25); toast(`${g.name} équipé.`); render(); },
  "unequip": el => { const s = el.dataset.slot; if (!(s in state.gear.equipped)) return; state.gear.equipped[s] = null; save(); render(); },
  "perk": el => {
    const p = PERK_BY_ID[el.dataset.id]; if (!p || perkState(p) !== "avail") return;
    state.perks.push(p.id); state.perkPoints--; save(); vibrate([30, 30, 80]); toast(`Aptitude installée : ${p.name}`); render();
  },
  "report-done": () => { ui.report = null; ui.tab = "fiche"; go("hq"); },
  "edit-name": () => openNameSheet(),
  "save-name": () => { const i = $("#name-input"); if (i && commitName(i.value)) { closeSheet(); toast("Nom de code enregistré."); render(); } else if (i) shake(i); },
  "sync-info": () => openSyncSheet(),
  "sync-retry": () => { sync.fails = 0; if (!state.updatedAt) state.updatedAt = Date.now(); pushNow(); closeSheet(); },
  "dismiss-tip": el => { if (el.dataset.tip in state.tips) { state.tips[el.dataset.tip] = true; save(); render(); } },
  "replay-guide": () => openOnboard(),
  "ob-next": () => obNext(),
  "ob-back": () => { ui.ob = Math.max(0, (ui.ob || 0) - 1); renderOnboard(); },
  "ob-skip": () => closeOnboard(true),
  "export": () => openExportSheet(),
  "copy-export": () => copyExport(),
  "import": () => openImportSheet(),
  "import-preview": () => previewImport(),
  "sign-out": () => signOut(),
  "auth-mode": el => { const em = $("#au-email"); if (em) authEmail = em.value.trim(); renderAuth(el.dataset.mode); },
  "auth-google": () => googleAuth(),
  "reload": () => location.reload()
};
const holdActions = {
  "import-confirm": () => {
    if (!ui.pendingImport) return;
    state = ui.pendingImport; ui.pendingImport = null;
    state.onboarded = true;
    save();
    vibrate([60, 40, 120]);
    closeSheet(); closeRest();
    ui.screen = "hq"; ui.tab = "fiche"; ui.report = null;
    render();
    toast(`Progression importée : ${state.operator.callsign}, niveau ${state.level}.`);
  },
  "reset-loadout": el => {
    state.loadoutSession = [];
    save();
    vibrate([120, 60, 200]);
    redFlash();
    shake($("#ex-list"));
    shake(el);
    syncLoadoutUI();
    if (ui.sheetEx) openExSheet(ui.sheetEx);
    toast("Loadout purgé.");
  },
  "abort-mission": () => {
    state.mission = null; save();
    vibrate([120, 60, 200]); redFlash(); closeRest();
    toast("Mission abandonnée. Le loadout est conservé.");
    go("catalog");
  },
  "wipe-save": () => {
    const keepName = state.operator.callsign;
    state = defaultState(); state.operator.callsign = keepName; state.onboarded = true;
    save(); vibrate([200, 80, 300]); redFlash();
    ui.tab = "fiche"; toast("Opérateur réinitialisé au niveau 1.");
    go("hq");
  }
};

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (el) {
    if (el.closest("[aria-disabled='true']")) return;
    const fn = actions[el.dataset.act];
    if (fn) { e.preventDefault(); fn(el, e); }
    return;
  }
  const h = e.target.closest("[data-hold]");
  if (h && Date.now() - lastHoldFire > 400) toast(`Maintenez le bouton appuyé (${(+(h.dataset.ms || 600) / 1000).toLocaleString("fr-FR")} s) pour confirmer.`, true);
  if (ui.delArm && !e.target.closest(".del")) { ui.delArm = null; if (ui.screen === "briefing") render(); }
});

/* ---- appui long ---- */
let hold = null, lastHoldFire = 0;
function startHold(el) {
  cancelHold();
  const ms = +el.dataset.ms || 600;
  el.style.setProperty("--hold-ms", ms + "ms");
  void el.offsetWidth;
  el.classList.add("arming");
  vibrate(10);
  hold = { el, timer: setTimeout(() => {
    el.classList.remove("arming");
    const act = el.dataset.hold; hold = null; lastHoldFire = Date.now();
    if (holdActions[act]) holdActions[act](el);
  }, ms) };
}
function cancelHold() { if (!hold) return; clearTimeout(hold.timer); hold.el.classList.remove("arming"); hold = null; }
document.addEventListener("pointerdown", e => {
  const el = e.target.closest("[data-hold]");
  if (!el || el.disabled || (e.button !== undefined && e.button > 0)) return;
  startHold(el);
});
["pointerup", "pointercancel"].forEach(t => document.addEventListener(t, cancelHold));
document.addEventListener("pointerout", e => { if (hold && e.target === hold.el && !hold.el.contains(e.relatedTarget)) cancelHold(); });
document.addEventListener("contextmenu", e => { if (e.target.closest("[data-hold]")) e.preventDefault(); });
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { if (!$("#sheet").hidden) closeSheet(); return; }
  const el = e.target.closest && e.target.closest("[data-hold]");
  if (el && (e.key === " " || e.key === "Enter")) { e.preventDefault(); if (!e.repeat) startHold(el); }
  if (e.key === "Enter" && e.target.matches("[data-field]")) { e.preventDefault(); validateSet(e.target.dataset.id, e.target); }
  if (e.key === "Enter" && e.target.id === "name-input") { e.preventDefault(); actions["save-name"](); }
  if (e.key === "Enter" && e.target.id === "ob-name") { e.preventDefault(); obNext(); }
});
document.addEventListener("keyup", e => { if (e.key === " " || e.key === "Enter") { if (e.target.closest && e.target.closest("[data-hold]")) e.preventDefault(); cancelHold(); } });

/* ---- saisies ---- */
function onDraftInput(id) {
  const { kg, reps } = readDraftInputs(id);
  storeDraft(id, kg, reps);
  const pv = document.getElementById("pv-" + id);
  if (pv) pv.textContent = previewXp(id, kg, reps);
}
document.addEventListener("input", e => {
  const t = e.target;
  if (t.matches("[data-field]")) { t.parentElement.classList.remove("bad"); onDraftInput(t.dataset.id); }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "set-callsign") {
    if (commitName(t.value)) { toast("Nom de code mis à jour."); render(); } else t.value = state.operator.callsign;
  } else if (t.id === "set-bw") {
    const v = parseNum(t.value);
    if (!Number.isFinite(v) || v < 30 || v > 250) { toast("Poids de corps : entre 30 et 250 kg.", true); t.value = fmt1(state.operator.bodyweight); return; }
    state.operator.bodyweight = Math.round(v * 10) / 10; save(); toast("Poids de corps enregistré.");
  }
});
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { if (sync.ref && sync.mode === "saving") pushNow(); return; }
  if (!$("#rest").hidden) tickRest();
});
window.addEventListener("pagehide", () => { if (sync.ref && sync.mode === "saving") pushNow(); });
window.addEventListener("error", () => toast("Anomalie système détectée. Rechargez la page si l'affichage est bloqué.", true));

/* ---- démarrage ---- */
window.addEventListener("offline", () => { if (sync.ref) setSyncMode("offline"); });
window.addEventListener("online", () => {
  if (!sync.ref) return;
  setSyncMode(sync.writing ? "saving" : "cloud");
  if (sync.pending || sync.fails) { sync.fails = 0; pushNow(); }
});
if (STANDALONE) {
  bootFirebase();
} else {
  bootPristine = isPristine();
  render();
  const obFallback = setTimeout(maybeOnboard, 3500);
  initSync().finally(() => { clearTimeout(obFallback); maybeOnboard(); });
}
</script>
</body>
</html>
